<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="DeepSeek Harness 开屏动画，4 秒 4K 视觉展示。">
  <title>开屏动画 · DeepSeek Harness — PANGZEHONG</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;font-family:Arial,"Microsoft YaHei",sans-serif;color:#edf0ff;background:#0b1020}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 35%,#172140,transparent 70%)}
    a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}a,button{-webkit-tap-highlight-color:transparent}
    :focus-visible{outline:2px solid #b4c5ff;outline-offset:5px}
    .wrap{width:min(1280px,calc(100% - 80px));margin:auto}
    header{display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:90px;border-bottom:1px solid #ffffff1c}
    header a{display:inline-flex;align-items:center;gap:12px;min-height:44px;font-size:13px;color:#b6bfd5}
    header a:hover{color:#fff}.identity{font-size:11px;letter-spacing:2px;color:#8793b0}
    main{padding:44px 0 30px}.heading{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:25px}
    .eyebrow{font:10px/1.6 Consolas,monospace;letter-spacing:2px;color:#9aaedb;margin:0 0 12px}
    h1{font-size:clamp(25px,3vw,39px);font-weight:500;letter-spacing:-1px;margin:0;line-height:1.4}
    h1 span{font-size:.58em;color:#a6b4d4;letter-spacing:0;display:inline-block;margin-left:14px}
    .specs{font:11px/1.6 Consolas,monospace;color:#aab9d7;letter-spacing:1px;white-space:nowrap}
    .screen{overflow:hidden;border:1px solid #465373;border-radius:8px;background:#050812;box-shadow:0 24px 80px #0005}
    video{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#050812}
    .controls{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:20px}
    .buttons{display:flex;gap:10px;flex-wrap:wrap}button{min-height:44px;display:inline-flex;align-items:center;gap:10px;border:1px solid #465373;border-radius:4px;padding:10px 16px;background:#18213a;color:#e3eaff;transition:background .2s,border-color .2s}
    button:hover{background:#243354;border-color:#a6b9ed}button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    #playback-status{font-size:12px;color:#aab9d7;line-height:1.7;margin:0}footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #ffffff1c;padding:22px 0;margin-top:8px;color:#8290ad;font:10px/1.7 Consolas,monospace;letter-spacing:1px}
    [hidden]{display:none!important}.fallback{color:#c2d1f5;font-size:14px;line-height:1.8}.fallback a{text-decoration:underline;text-underline-offset:4px}
    @media(max-width:700px){.wrap{width:calc(100% - 32px)}header{min-height:72px}.identity{display:none}main{padding-top:30px}.heading{align-items:start;flex-direction:column;gap:10px;margin-bottom:18px}h1 span{display:block;margin:6px 0 0;font-size:17px}.specs{font-size:10px}.controls{align-items:start;flex-direction:column;gap:14px}.screen{border-radius:5px}footer{font-size:9px;flex-wrap:wrap;gap:8px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header class="wrap"><a href="../../index.html#works"><span aria-hidden="true">←</span> 返回作品集</a><span class="identity">PANGZEHONG / MOTION STUDY</span><a href="https://github.com/PZEHONG/deepseek-splash" target="_blank" rel="noopener noreferrer">GitHub 项目 <span aria-hidden="true">↗</span></a></header>
  <main class="wrap">
    <div class="heading"><div><p class="eyebrow">048 / OPENING SEQUENCE</p><h1>开屏动画<span>DeepSeek Harness</span></h1></div><span class="specs">4K · 24 FPS · 4 SEC</span></div>
    <div class="screen"><video id="splash-video" controls playsinline muted preload="metadata" poster="poster.png" aria-label="DeepSeek Harness 开屏动画，4 秒，无声"><source src="harness-splash.webm" type="video/webm">你的浏览器不支持此视频。<a href="harness-splash.webm">打开动画文件</a></video></div>
    <div class="controls"><div class="buttons"><button id="replay" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 1.5 7M3 4v6h6"/></svg>重新播放</button><button id="fullscreen" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>全屏观看</button></div><p id="playback-status" role="status" aria-live="polite">4 秒开屏动画 · 无声</p></div>
    <p id="video-error" class="fallback" hidden>视频暂时无法播放，可<a href="harness-splash.webm">打开原始动画</a>观看。</p>
  </main>
  <footer class="wrap"><span>DEEPSEEK HARNESS / SPLASH ANIMATION</span><span>3840 × 2160</span></footer>
  <script>
    (()=>{
      const video=document.querySelector('#splash-video');
      const status=document.querySelector('#playback-status');
      const fullscreen=document.querySelector('#fullscreen');
      const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
      async function play(){try{await video.play();}catch{status.textContent='点击视频播放按钮或「重新播放」观看';}}
      document.querySelector('#replay').addEventListener('click',()=>{video.currentTime=0;play();});
      video.addEventListener('playing',()=>{status.textContent='正在播放 · 4 秒开屏动画 · 无声';});
      video.addEventListener('pause',()=>{if(!video.ended)status.textContent='已暂停 · 点击播放继续观看';});
      video.addEventListener('ended',()=>{status.textContent='播放完毕 · 可重新播放';});
      function showError(){document.querySelector('#video-error').hidden=false;status.textContent='视频加载失败';}
      video.addEventListener('error',showError);
      video.querySelector('source').addEventListener('error',showError);
      fullscreen.hidden=!video.requestFullscreen&&!video.webkitEnterFullscreen;
      fullscreen.addEventListener('click',async()=>{try{if(video.requestFullscreen)await video.requestFullscreen();else video.webkitEnterFullscreen();}catch{status.textContent='可使用视频控制栏中的全屏按钮';}});
      reducedMotion.addEventListener('change',e=>{if(e.matches){video.pause();status.textContent='已减少动态效果 · 点击播放观看';}});
      if(reducedMotion.matches)status.textContent='已减少动态效果 · 点击播放观看';else play();
      document.addEventListener('visibilitychange',()=>{if(document.hidden)video.pause();});
    })();
  </script>
</body>
</html>
