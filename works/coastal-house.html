    <p class="intro-copy">把日常，安放在海岸。<br>一栋向阳而生的两层小宅，<br>一场关于光与海风的漫游。</p>

      <button class="floor-option" data-floor="2" aria-pressed="false"><span class="floor-mark">2F</span><span class="floor-text">枕海而眠<small>BEDROOM & TERRACE</small></span><i class="active-indicator"></i></button>
    </div>
