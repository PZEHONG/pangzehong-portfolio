<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;min-height:100%;overflow:hidden}
  body{display:grid;place-items:center;min-height:100vh;background:#103843}
  .wrap{width:min(100vw,1120px);padding:20px}
  svg{display:block;width:100%;height:auto;border-radius:28px;background:#a8e3fa;box-shadow:0 24px 70px #06263080}
  @media(max-width:560px){.wrap{padding:8px}svg{border-radius:16px}}
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1000 600" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
<title id="title">鹈鹕骑自行车</title>
<desc id="desc">一只鹈鹕踩着自行车穿过晴朗的乡间道路。</desc>
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#86d5f3"/><stop offset=".58" stop-color="#d2f3ff"/><stop offset="1" stop-color="#eff9ed"/></linearGradient>
  <linearGradient id="road" x2="0" y2="1"><stop stop-color="#d9b176"/><stop offset="1" stop-color="#b9784f"/></linearGradient>
  <linearGradient id="bird" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf2"/><stop offset=".75" stop-color="#f0eee4"/><stop offset="1" stop-color="#cedfdb"/></linearGradient>
  <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf5ef"/><stop offset="1" stop-color="#abc6c4"/></linearGradient>
  <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5bf61"/><stop offset="1" stop-color="#d77138"/></linearGradient>
  <radialGradient id="sun"><stop stop-color="#fff9b2"/><stop offset=".7" stop-color="#ffe486"/><stop offset="1" stop-color="#ffc568"/></radialGradient>
  <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
<![CDATA[
.cloud{transform-box:fill-box;transform-origin:center;animation:cloud 18s ease-in-out infinite alternate}
.cloud.two{animation-duration:25s;animation-direction:alternate-reverse}
.sun{transform-box:fill-box;transform-origin:center;animation:pulse 3.5s ease-in-out infinite}
.marks{animation:road 1.1s linear infinite}
.bird{transform-box:fill-box;transform-origin:center;animation:bob 1.1s ease-in-out infinite}
.wing{transform-box:fill-box;transform-origin:15% 25%;animation:flap 1.1s ease-in-out infinite}
.wind{animation:wind 1.1s ease-in-out infinite}
@keyframes cloud{from{transform:translateX(-26px)}to{transform:translateX(32px)}}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.95)}50%{opacity:.8;transform:scale(1.08)}}
@keyframes road{to{stroke-dashoffset:-160}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes flap{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-10deg)}}
@keyframes wind{0%,100%{opacity:.15;transform:translateX(0)}50%{opacity:.55;transform:translateX(18px)}}
@media(prefers-reduced-motion:reduce){.cloud,.sun,.marks,.bird,.wing,.wind{animation-duration:.001ms!important;animation-iteration-count:1!important}}
]]>
</style>
