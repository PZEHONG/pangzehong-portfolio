<body>
  <main id="app">
    <canvas id="universe" aria-label="可旋转和缩放的三维体素飞船与星际场景"></canvas>
    <header class="topbar">
      <div class="identity"><div class="brand-icon"><i data-lucide="orbit"></i></div><div><div class="brand-line"><h1>星穹号</h1><span class="serial">EXPLORER 07</span></div><p>VOXEL ODYSSEY</p></div></div>
      <div class="top-tools">
        <button id="music" class="music-button" data-tip="播放 / 暂停音乐" aria-label="播放音乐" aria-pressed="false"><i data-lucide="music-2"></i><span id="music-label">星海漫游</span><span class="equalizer"><b></b><b></b><b></b><b></b></span></button>
        <button id="pause" class="icon-button" data-tip="暂停 / 继续时间" aria-label="暂停时间" aria-pressed="false"><i data-lucide="pause"></i></button>
        <button id="fullscreen" class="icon-button" data-tip="全屏" aria-label="全屏"><i data-lucide="maximize"></i></button>
      </div>
    </header>

    <aside class="telemetry" aria-label="飞船状态">
      <div class="sector"><span class="signal-dot"></span><span id="sector-name">翡翠星环</span><span class="sector-code" id="sector-code">KEPLER / 186F</span></div>
      <div class="voyage"><span>航行状态</span><strong id="flight-status">自由巡航</strong></div>
      <div class="stat"><span>核心能量</span><strong><span id="energy-value">100</span><small>%</small></strong><div class="meter"><b id="energy-bar"></b></div></div>
      <div class="stat"><span>推进功率</span><strong><span id="power-value">42</span><small>%</small></strong><div class="meter coral"><b id="power-bar" style="width:42%"></b></div></div>
      <div class="small-stats"><div><span>船员</span><strong id="crew-count">02</strong></div><div><span>命中</span><strong id="hit-count">00</strong></div><div><span>跃迁</span><strong id="jump-count">00</strong></div></div>
      <div class="ship-id"><span class="mini-cross">+</span><span>ASTRA SCIENCE VESSEL<br><b>VX–07 / 体素探索舰</b></span></div>
    </aside>

    <div class="view-controls" role="group" aria-label="相机视角">
      <button data-view="orbit" class="selected" aria-pressed="true"><i data-lucide="orbit"></i><span>环绕</span></button>
      <button data-view="bridge" aria-pressed="false"><i data-lucide="scan-eye"></i><span>舰桥</span></button>
      <button data-view="garden" aria-pressed="false"><i data-lucide="sprout"></i><span>生态舱</span></button>
      <button id="auto-orbit" class="view-icon" data-tip="自动环绕" aria-label="自动环绕" aria-pressed="false"><i data-lucide="rotate-3d"></i></button>
    </div>

    <div class="event-display" id="event-display" aria-live="polite"><span id="event-kicker"></span><strong id="event-title"></strong><div><b id="event-progress"></b></div></div>
    <div id="target-label" class="target-label" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div class="axis-readout"><span>X <b id="axis-x">+024</b></span><span>Y <b id="axis-y">+018</b></span><span>Z <b id="axis-z">+028</b></span></div>

    <section id="console" class="console" hidden aria-label="飞船操控台">
      <header><div><i data-lucide="sliders-horizontal"></i><h2>飞船操控台</h2></div><button id="close-console" class="icon-button" aria-label="关闭操控台" data-tip="关闭"><i data-lucide="x"></i></button></header>
      <div id="console-notice" class="console-notice" role="status" hidden></div>
      <div class="console-content">
