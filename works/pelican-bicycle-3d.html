<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#deeff2">
  <title>鹈鹕，立体兜风。</title>
  <style>
    :root{color-scheme:light;--ink:#29474a;--muted:#657e7c;--accent:#db6855;--sky:#deeff2}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{overflow:hidden;background:var(--sky);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:0;-webkit-tap-highlight-color:transparent}
    button,input{font:inherit}
    main{position:relative;width:100%;height:100%;height:100svh;isolation:isolate}
    #viewport{position:absolute;inset:0}
    canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
    canvas:active{cursor:grabbing}
    .masthead{position:absolute;top:34px;left:40px;pointer-events:none}
    h1{margin:0 0 11px;font-family:"Palatino Linotype","Noto Serif SC","Songti SC",SimSun,serif;font-size:30px;font-weight:600;line-height:1.35}
    .masthead p{margin:0;color:var(--muted);font-size:10px;font-weight:500}
    .footer{position:absolute;right:40px;bottom:max(26px,env(safe-area-inset-bottom));left:40px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .caption{margin:0;font-size:12px;color:#446861;text-shadow:0 1px 5px #e8eee6}
    .control-stack{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
    .music-controls{display:flex;align-items:center;gap:10px;min-height:46px;padding:3px 11px 3px 5px;border:1px solid #ffffffa8;border-radius:8px;background:#fafffad9;backdrop-filter:blur(10px)}
    .music-controls label{display:flex;align-items:center;color:var(--muted)}
    .music-controls label svg{width:16px;height:16px}
    #music-volume{width:76px;height:28px;margin:0;accent-color:var(--accent);cursor:pointer}
    #music-volume-value{width:32px}
    .music-error{max-width:270px;margin:0;color:#a34338;font-size:12px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .controls{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:5px 12px 5px 6px;border:1px solid #ffffffa8;border-radius:8px;background:#fafffad9;box-shadow:0 4px 20px #29474a0a;backdrop-filter:blur(10px)}
    .icon-button{position:relative;display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;padding:0;border:0;border-radius:6px;color:var(--ink);background:transparent;cursor:pointer;transition:background 150ms,color 150ms}
    .icon-button:hover{background:#d9e8df}
    .icon-button.active{background:#d3e6dc;color:#217c68}
    .icon-button svg{display:block;width:19px;height:19px;stroke-width:1.8}
    [hidden]{display:none!important}
    .tooltip{position:absolute;bottom:49px;left:50%;transform:translateX(-50%);padding:6px 9px;border-radius:4px;background:var(--ink);color:white;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none}
    .icon-button:hover .tooltip,.icon-button:focus-visible .tooltip{opacity:1}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .divider{width:1px;height:21px;margin:0 3px;background:#36575624}
    .speed-label{font-size:12px;color:var(--muted)}
    #speed{width:93px;height:28px;margin:0;accent-color:var(--accent);cursor:pointer}
    output{width:33px;font-size:12px;font-variant-numeric:tabular-nums}
    .status{position:absolute;top:50%;left:50%;width:min(330px,calc(100% - 48px));transform:translate(-50%,-50%);text-align:center;font-size:14px;line-height:1.7}
    .status strong{display:block;margin-bottom:8px;font-size:18px;font-weight:500}
    .status p{margin:0;color:var(--muted)}
    .ready .status{display:none}
    .failed .control-stack{display:none}
    @media(max-width:600px){
      .masthead{top:max(27px,env(safe-area-inset-top));left:24px}
      h1{font-size:26px}
      .footer{right:16px;left:16px;bottom:max(24px,env(safe-area-inset-bottom));justify-content:center}
      .caption{display:none}
      .control-stack{align-items:center}
      .controls{gap:7px;padding-right:10px}
      .icon-button{width:36px;height:40px;flex-basis:36px}
      #speed{width:68px}
    }
    @media(max-width:350px){.speed-label{display:none}.controls{gap:4px}.icon-button{width:34px;flex-basis:34px}#speed{width:60px}}
    @media(max-height:500px) and (min-width:601px){
      .masthead{top:18px;left:24px}h1{font-size:22px;margin-bottom:6px}
      .footer{bottom:12px;left:24px;right:24px}.controls{min-height:46px;padding-top:2px;padding-bottom:2px}
      .caption{display:none}.footer{justify-content:flex-end}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main>
    <div id="viewport" aria-busy="true"></div>
    <header class="masthead">
      <h1>鹈鹕，立体兜风。</h1>
      <p>A COASTAL RIDE · 3D</p>
    </header>
    <div id="status" class="status" role="status"><p>正在构建立体场景…</p></div>
    <footer class="footer">
      <p class="caption">海风正好，慢慢骑。</p>
      <div class="control-stack">
      <p id="music-error" class="music-error" role="status" hidden>音乐未能播放，请重试。</p>
      <div class="music-controls" role="group" aria-label="背景音乐控制">
        <button id="music-toggle" class="icon-button" type="button" aria-label="播放音乐" aria-pressed="false" aria-busy="false">
          <i data-lucide="music-2"></i><span id="music-tooltip" class="tooltip" aria-hidden="true">播放音乐</span>
        </button>
        <label for="music-volume"><i data-lucide="volume-2" aria-hidden="true"></i><span class="sr-only">音乐音量</span></label>
        <input id="music-volume" type="range" min="0" max="100" step="5" value="35" aria-valuetext="35%">
        <output id="music-volume-value" for="music-volume">35%</output>
      </div>
      <div class="controls" role="group" aria-label="动画与视角控制">
        <button id="play-toggle" class="icon-button" type="button" aria-label="暂停动画" aria-pressed="true">
          <span id="pause-icon"><i data-lucide="pause"></i></span>
          <span id="play-icon" hidden><i data-lucide="play"></i></span>
          <span id="play-tooltip" class="tooltip" aria-hidden="true">暂停</span>
        </button>
        <button id="orbit-toggle" class="icon-button" type="button" aria-label="自动环绕" aria-pressed="false">
          <i data-lucide="rotate-3d"></i><span class="tooltip" aria-hidden="true">自动环绕</span>
        </button>
        <button id="reset-view" class="icon-button" type="button" aria-label="重置视角">
          <i data-lucide="rotate-ccw"></i><span class="tooltip" aria-hidden="true">重置视角</span>
        </button>
        <button id="mouth-toggle" class="icon-button active" type="button" aria-label="合上鸟嘴" aria-pressed="true">
          <i data-lucide="fish"></i><span id="mouth-tooltip" class="tooltip" aria-hidden="true">合上鸟嘴</span>
        </button>
        <span class="divider" aria-hidden="true"></span>
        <label class="speed-label" for="speed">速度</label>
        <input id="speed" type="range" min="0.5" max="1.75" value="1" step="0.25" aria-valuetext="1 倍速">
        <output id="speed-value" for="speed">1×</output>
      </div>
      </div>
    </footer>
  </main>
  <noscript><div class="status">需要启用 JavaScript 才能显示 3D 动画。</div></noscript>
