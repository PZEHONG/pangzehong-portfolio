<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#88d5e3">
  <meta name="description" content="派大星穿着紫花短裤，骑着黄色自行车在海底快乐兜风。拖动旋转视角，暂停、调速或按铃。">
  <title>派大星骑自行车 · 今天也要快乐</title>
  <style>
    :root{color-scheme:light;--ocean:#88d5e3;--ink:#254c66;--muted:#477386;--paper:#f1fcfb;--purple:#8052ac;--pink:#ffb0bd;--yellow:#ffdb6c}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{background:var(--ocean);color:var(--ink);font-family:"Trebuchet MS","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
    button,input{font:inherit}button{cursor:pointer}
    main{width:100%;height:100%;height:100svh;position:relative;isolation:isolate}
    #ocean{position:absolute;inset:0}
    canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
    canvas:active{cursor:grabbing}
    .heading{position:absolute;top:clamp(24px,4.4vh,50px);left:clamp(24px,4.4vw,72px);pointer-events:none;max-width:350px}
    .eyebrow{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:2px;margin:0 0 12px}
    .little-star{width:17px;height:17px;fill:var(--purple)}
    h1{font-size:clamp(34px,4.1vw,62px);line-height:1.15;letter-spacing:-2px;font-weight:900;margin:0;transform:rotate(-3deg);transform-origin:left bottom;text-shadow:0 3px 0 #b2e7eb}
    h1 span{display:block;color:#fff7e7;text-shadow:0 3px 0 #619dad}
    .heading .hint{font-size:12px;line-height:1.8;margin:21px 0 0;color:var(--muted);letter-spacing:.4px}
    .ride-note{position:absolute;bottom:38px;left:clamp(24px,4.4vw,72px);margin:0;font-size:13px;line-height:1.9;pointer-events:none;color:#3b6b7a}
    .ride-note strong{font-size:17px;display:block;font-weight:800;letter-spacing:1px;color:var(--ink)}
    .toolbar{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:9px 12px 9px 9px;border:1px solid #ffffffbd;border-radius:28px;background:#f1fcfbeb;box-shadow:0 7px 0 #427c9124,0 15px 40px #35688116;backdrop-filter:blur(12px);white-space:nowrap}
    button{width:42px;height:42px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink);border-radius:50%;transition:background .15s,transform .15s;position:relative;flex-shrink:0}
    button:hover{background:#d5edf0;transform:translateY(-2px)}
    button:active{transform:translateY(1px)}
    button.primary{background:var(--purple);color:white}
    button.primary:hover{background:#6e4499}
    button[aria-pressed="true"].view{background:#e8daf3;color:#7348a1}
    button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8}
    .divider{height:23px;width:1px;background:#bfd9dd;margin:0 5px}
    .speed{display:flex;align-items:center;gap:9px;padding-right:3px}
    .speed label{font-size:12px;font-weight:700}
    input[type=range]{width:85px;accent-color:var(--purple);cursor:pointer;height:30px;margin:0}
    output{width:31px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
    :focus-visible{outline:3px solid var(--purple);outline-offset:4px}
    .toast{position:absolute;left:50%;bottom:109px;transform:translateX(-50%) translateY(8px);padding:9px 18px;border-radius:18px;background:#fff6da;color:#805c36;box-shadow:0 4px 16px #547b701a;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;font-size:13px;font-weight:700;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:calc(100% - 40px);text-align:center;line-height:1.7;font-size:14px;padding:18px 24px;border-radius:20px;background:#f1fcfbef}
    .status strong{display:block;font-size:18px}.status p{margin:7px 0 0}
    [hidden]{display:none!important}.is-ready .status{display:none}.has-error .toolbar{display:none}
    .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    @media(max-width:1000px){.ride-note{bottom:116px;font-size:11px}.ride-note strong{font-size:14px}.heading{max-width:290px}}
    @media(max-width:600px){.heading{left:24px;top:max(24px,env(safe-area-inset-top))}.eyebrow{font-size:10px;letter-spacing:1.3px;margin-bottom:9px}h1{font-size:39px;letter-spacing:-1px}.heading .hint{font-size:10px;margin-top:13px}.ride-note{display:none}.toolbar{gap:3px;padding:7px 9px 7px 7px;bottom:max(23px,env(safe-area-inset-bottom))}button{width:38px;height:40px}.divider{margin:0 4px}.speed{gap:5px}.speed label{display:none}input[type=range]{width:63px}output{width:29px}.toast{bottom:95px}}
    @media(max-width:350px){.toolbar{gap:2px;padding-right:7px}button{width:35px}.divider{margin:0 2px}input[type=range]{width:49px}h1{font-size:35px}}
    @media(max-height:650px) and (max-width:600px){.heading .hint{display:none}}
    @media(max-height:500px) and (min-width:601px){.heading{top:20px;left:25px}h1{font-size:31px}.eyebrow{font-size:10px;margin-bottom:8px}.heading .hint{margin-top:11px;font-size:10px}.ride-note{display:none}.toolbar{bottom:14px;left:auto;right:20px;transform:none;padding:5px 9px 5px 5px}button{width:35px;height:35px}.toast{left:auto;right:50px;bottom:76px;transform:none}.toast.show{transform:none}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<main aria-label="派大星骑自行车的海底动画">
  <div id="ocean" aria-busy="true"></div>
  <header class="heading">
    <p class="eyebrow"><svg class="little-star" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 1 3.1 7.4 8 .7-6.1 5.2 1.9 7.8-6.9-4.2-6.9 4.2L7 14.3.9 9.1l8-.7Z"/></svg>比奇堡 · 快乐兜风</p>
    <h1>派大星，<span>骑车去！</span></h1>
    <p class="hint">拖动看四周 · 滚轮拉近<br>双击画面，回到最佳视角</p>
  </header>
  <p class="ride-note"><strong>今天也要快乐。</strong>没有目的地，只有好心情。</p>
  <div id="message" class="toast" role="status" aria-live="polite"></div>
  <div id="status" class="status" role="status">派大星正在准备出发…</div>
  <nav class="toolbar" aria-label="骑行控制">
    <button id="play" class="primary" type="button" aria-label="暂停骑行" aria-pressed="true" title="暂停 / 继续（空格）">
      <svg id="pause-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke-width="3"/></svg>
      <svg id="play-symbol" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m8 5 11 7-11 7Z" fill="currentColor" stroke-width="1"/></svg>
    </button>
    <button id="bell" type="button" aria-label="按车铃" title="叮铃！"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15h14l-2-3V9a5 5 0 0 0-10 0v3Zm4 3a3 3 0 0 0 6 0M12 2v2M20 5l2 2M2 7l2-2"/></svg></button>
    <button id="view" class="view" type="button" aria-label="开启自动环绕" aria-pressed="false" title="自动环绕"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8a9 9 0 0 1 15-2l2 2M21 3v5h-5M20 16a9 9 0 0 1-15 2l-2-2M3 21v-5h5"/></svg></button>
    <button id="home" type="button" aria-label="恢复视角" title="恢复视角"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 1.5 7M3 4v6h6M12 8v5l3 2"/></svg></button>
    <span class="divider" aria-hidden="true"></span>
    <div class="speed"><label for="speed">速度</label><input id="speed" aria-label="骑行速度" type="range" min="0.5" max="2" step="0.25" value="1" aria-valuetext="1 倍速"><output id="speed-text" for="speed">1×</output></div>
  </nav>
  <noscript><p class="status">请在浏览器中启用 JavaScript 后观看动画。</p></noscript>
</main>
