body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
.page{width:min(1440px,100%);margin:auto;padding:34px 56px 25px}
.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:0 5px 22px}
.eyebrow{display:flex;align-items:center;gap:8px;margin:0 0 11px;font-size:11px;letter-spacing:.2em;color:var(--muted)}
.eyebrow svg{width:18px;height:18px}
h1{font-family:"STKaiti","KaiTi","Kaiti SC","Noto Serif CJK SC",serif;font-size:clamp(30px,3.4vw,47px);font-weight:600;letter-spacing:.05em;line-height:1.2;margin:0}
.intro{font-size:13px;letter-spacing:.13em;margin:0 0 7px;color:var(--muted)}
.scene{position:relative;overflow:hidden;margin:0;border-radius:23px;background:#ddf0f0;box-shadow:0 0 0 1px rgba(77,122,126,.12)}
.scene>svg{display:block;width:100%;height:auto;aspect-ratio:1440/760}
.controls{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:21px 5px 0}
.controls-left{display:flex;gap:10px;align-items:center}
.control{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:42px;border:1px solid var(--line);border-radius:22px;padding:10px 17px;background:transparent;color:var(--ink);cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
.control:hover{background:#f7faf4;border-color:#8baea9;transform:translateY(-1px)}
.control:active{transform:translateY(1px)}
.control:focus-visible{outline:3px solid #d97859;outline-offset:4px}
.control svg{width:16px;height:16px;flex-shrink:0}
.control.primary{background:var(--ink);border-color:var(--ink);color:#f7fbf5}
.control.primary:hover{background:#35616a}
.control span{font-size:12px;letter-spacing:.06em;white-space:nowrap}
.footnote{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:11px;letter-spacing:.1em;margin:0}
.footnote:before{content:"";width:5px;height:5px;border-radius:50%;background:#74a798}
.sr-only{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden;white-space:nowrap}
@media(min-width:1600px){.page{padding-top:45px}}
@media(max-width:700px){
 .page{padding:27px 17px 22px}.heading{display:block;padding:0 7px 23px}
 .eyebrow{font-size:10px;margin-bottom:12px}h1{font-size:35px}
 .intro{margin:11px 0 0;font-size:11px}.scene{border-radius:19px}
 .scene>svg{aspect-ratio:660/650}.controls{padding:19px 0 0;justify-content:center}
 .controls-left{gap:7px}.control{min-height:43px;padding:10px 13px}.footnote{display:none}
}
@media(prefers-reduced-motion:reduce){.control{transition:none}}
</style>

<script>
(function(){
 'use strict';
 const el = id => document.getElementById(id);
 const scene = el('scene');
 const media = matchMedia('(prefers-reduced-motion: reduce)');
 const narrow = matchMedia('(max-width: 700px)');
 const speeds = [{value:.65,label:'慢慢骑'},{value:1,label:'悠哉骑'},{value:1.55,label:'追着风'}];
 let speedIndex = 1, paused = media.matches, time = 0, previous = 0, raf = 0;
 let bellStarted = -Infinity, audio = null;
 const set = (id,name,value) => el(id).setAttribute(name,value);
 const at = (x,y) => 'translate('+x.toFixed(3)+' '+y.toFixed(3)+')';
 const cx=705, cy=590, crankRadius=33, wheelRadius=105, ratio=1.65;
 function viewport(){scene.setAttribute('viewBox',narrow.matches?'400 110 660 650':'0 0 1440 760');set('sun','transform',narrow.matches?'translate(282 88) scale(.64)':'translate(0 0)');}
 narrow.addEventListener('change',viewport);
 viewport();
 // Two-link inverse kinematics keeps each ankle on its own pedal.
 function leg(hx,hy,px,py,upper,lower){
  const dx=px-hx,dy=py-hy,d=Math.hypot(dx,dy);
  const a=(upper*upper-lower*lower+d*d)/(2*d);
  const h=Math.sqrt(Math.max(0,upper*upper-a*a));
  const kx=hx+dx*a/d-dy*h/d,ky=hy+dy*a/d+dx*h/d;
  return 'M'+hx.toFixed(3)+' '+hy.toFixed(3)+'L'+kx.toFixed(3)+' '+ky.toFixed(3)+'L'+px.toFixed(3)+' '+py.toFixed(3);
 }
 function pose(){
  const angle=time*3.2-.6, degrees=angle*180/Math.PI;
  const wheelAngle=degrees*ratio;
  const travel=time*3.2*ratio*wheelRadius;
  const bob=Math.sin(angle*2)*2.2;
  const p1={x:cx+crankRadius*Math.cos(angle),y:cy+crankRadius*Math.sin(angle)};
  const p2={x:cx-crankRadius*Math.cos(angle),y:cy-crankRadius*Math.sin(angle)};
  set('rearSpokes','transform','rotate('+wheelAngle.toFixed(3)+')');
  set('frontSpokes','transform','rotate('+wheelAngle.toFixed(3)+')');
  set('crank','transform',at(cx,cy)+' rotate('+degrees.toFixed(3)+')');
  set('nearPedal','transform',at(p1.x,p1.y+2));
  set('farPedal','transform',at(p2.x,p2.y+2));
  set('nearFoot','transform',at(p1.x,p1.y-4));
  set('farFoot','transform',at(p2.x,p2.y-4));
  const back=leg(650,436+bob,p2.x-3,p2.y-12,98,110);
  const front=leg(670,437+bob,p1.x-3,p1.y-12,96,108);
  set('farLeg','d',back);set('farLegHighlight','d',back);
  set('nearLegOutline','d',front);set('nearLeg','d',front);
  set('rider','transform',at(0,bob));
  // Wing tip compensates for the body bounce at the handlebar.
  const end=399-bob, low=415-bob;
  set('wing','d','M558 366C568 341 604 334 637 343Q685 347 718 371L809 '+(388-bob)+'q24 0 34 11C852 '+(end+13)+' 845 '+low+' 839 '+low+'Q826 '+low+' 816 '+(405-bob)+'L729 399C706 426 667 435 629 427C588 423 562 401 558 366Z');
  const flutter=Math.sin(time*6.4)*8, flutter2=Math.sin(time*6.4-1.2)*9;
  set('scarfLong','d','M710 312C662 '+(306+flutter*.3)+' 630 '+(274+flutter)+' 585 '+(298+flutter2)+'L589 '+(283+flutter2)+' 569 '+(278+flutter2)+'C623 '+(249+flutter)+' 663 '+(292+flutter*.3)+' 718 295Z');
  set('scarfShort','d','M716 309C680 '+(333-flutter*.5)+' 659 '+(314-flutter2)+' 631 '+(321-flutter)+'l5-15-15-8Q665 '+(282-flutter2)+' 713 290Z');
  const blinkPhase=time%5.7;
  const blink=blinkPhase>4.95&&blinkPhase<5.17?Math.max(.07,Math.abs(blinkPhase-5.06)/.11):1;
  set('eye','transform',at(777,219)+' scale(1 '+blink.toFixed(3)+')');
  set('cloudTrack','transform',at(-(time*7%1800),Math.sin(time*.3)*3));
  set('gulls','transform',at(-Math.sin(time*.16)*28,Math.sin(time*1.1)*5));
  set('sailboat','transform',at(1115-Math.sin(time*.15)*13,500+Math.sin(time*1.5)*2.5)+' rotate('+Math.sin(time*.8)*1.6+')');
  set('ripples','patternTransform',at(-(time*18%360),0));
  set('roadTexture','patternTransform',at(-(travel%310),0));
  set('plantTrack','transform',at(-(travel*.55%1800),0));
 }
 function frame(now){
  raf=0;
  if(previous && !paused && !document.hidden)time+=Math.min((now-previous)/1000,.055)*speeds[speedIndex].value;
  previous=now;
  pose();
  const bellAge=(now-bellStarted)/1000;
  if(bellAge>=0&&bellAge<1.3){
   set('bellWaves','opacity',Math.min(1,bellAge*10)*(1-bellAge/1.3));
   set('bellWaves','transform',at(0,-bellAge*12));
  }else set('bellWaves','opacity','0');
  if((!paused||bellAge<1.3)&&!document.hidden)raf=requestAnimationFrame(frame);
 }
 function start(){if(!raf&&!document.hidden){previous=0;raf=requestAnimationFrame(frame);}}
 function updateButton(){
  el('playLabel').textContent=paused?'播放':'暂停';
  el('playButton').setAttribute('aria-label',paused?'播放动画':'暂停动画');
  el('playButton').setAttribute('aria-pressed',String(paused));
  set('playIcon','d',paused?'M6 3.5 16 10 6 16.5Z':'M5 4h3v12H5zM12 4h3v12h-3z');
 }
 function toggle(){paused=!paused;updateButton();start();}
 el('playButton').addEventListener('click',toggle);
 el('speedButton').addEventListener('click',()=>{
  speedIndex=(speedIndex+1)%speeds.length;
  el('speedLabel').textContent=speeds[speedIndex].label;
  el('speedButton').setAttribute('aria-label','切换骑行速度，当前'+speeds[speedIndex].label);
  el('announcement').textContent='骑行速度：'+speeds[speedIndex].label;
 });
 el('bellButton').addEventListener('click',async()=>{
  bellStarted=performance.now();start();
  el('announcement').textContent='叮铃！借过一下。';
  try{
   const AudioContext=window.AudioContext||window.webkitAudioContext;
   if(!AudioContext)return;
   if(!audio)audio=new AudioContext();
   if(audio.state==='suspended')await audio.resume();
   const base=audio.currentTime;
   [0,.15].forEach((delay,index)=>{
    const oscillator=audio.createOscillator(),gain=audio.createGain();
    oscillator.type='sine';oscillator.frequency.value=index?2093:2637;
    gain.gain.setValueAtTime(0,base+delay);
    gain.gain.linearRampToValueAtTime(.085,base+delay+.008);
    gain.gain.exponentialRampToValueAtTime(.0001,base+delay+.8);
    oscillator.connect(gain);gain.connect(audio.destination);
    oscillator.start(base+delay);oscillator.stop(base+delay+.82);
    oscillator.onended=()=>{oscillator.disconnect();gain.disconnect();};
   });
  }catch(_){ /* The visual bell is available even when sound is disabled. */ }
 });
 document.addEventListener('keydown',event=>{
  if(event.code==='Space'&&!event.repeat&&!event.target.closest('button,input,select,textarea,a')){
   event.preventDefault();toggle();
  }
 });
 document.addEventListener('visibilitychange',()=>{
  previous=0;if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;}else start();
 });
 media.addEventListener('change',event=>{paused=event.matches;updateButton();start();});
 pose();updateButton();start();
})();
</script>
