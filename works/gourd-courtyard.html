<style>
  :root { color-scheme: light; --ink: #334e45; --paper: #e7f1e9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; overflow: hidden; letter-spacing: 0; }
  button { font: inherit; }
  .world { position: relative; display: grid; place-items: center; width: 100%; height: 100vh; height: 100svh; isolation: isolate; overflow: hidden; }
  .scene { display: block; width: 100%; height: 100%; }
  .masthead { position: absolute; top: 35px; left: 4.5%; z-index: 2; pointer-events: none; }
  h1 { margin: 0; font-family: "STKaiti", "KaiTi", "Noto Serif SC", serif; font-size: 39px; line-height: 1.25; font-weight: 600; }
  .edition { position: absolute; top: 41px; right: 4.5%; font-size: 11px; color: #688577; display: flex; align-items: center; gap: 10px; }
  .edition .line { width: 28px; height: 1px; background: #8ba799; }
  .footer { position: absolute; bottom: 31px; left: 4.5%; font-family: "STKaiti", "KaiTi", serif; font-size: 13px; color: #486756; pointer-events: none; }
  .controls { position: absolute; bottom: 21px; right: 4.5%; display: flex; gap: 9px; z-index: 5; }
  .control { position: relative; display: grid; place-items: center; width: 43px; height: 43px; padding: 0; border: 1px solid #59786540; border-radius: 50%; color: #3d5b49; background: #f8fcf0db; cursor: pointer; transition: background .2s, transform .2s; }
  .control:hover { background: #fffef6; transform: translateY(-2px); }
  .control:focus-visible { outline: 3px solid #376d58; outline-offset: 4px; }
  .control svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tooltip { position: absolute; bottom: 53px; left: 50%; transform: translateX(-50%); background: #334e45; color: #fffef5; border-radius: 4px; padding: 6px 9px; font-size: 11px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s; }
  .control:hover .tooltip, .control:focus-visible .tooltip { opacity: 1; }
  .play-icon, .exit-icon { display: none; }
  .world.is-paused .play-icon { display: block; }
  .world.is-paused .pause-icon { display: none; }
  .world.is-fullscreen .exit-icon { display: block; }
  .world.is-fullscreen .expand-icon { display: none; }
  .outline { stroke: #425946; stroke-linecap: round; stroke-linejoin: round; }
  .sway { animation: sway var(--duration, 5s) ease-in-out infinite; animation-delay: var(--delay, 0s); transform-origin: 0 0; }
  .leaf-sway { animation: leaf-sway var(--duration, 4.8s) ease-in-out infinite; animation-delay: var(--delay, 0s); transform-box: fill-box; transform-origin: 50% 95%; }
  .cloud { animation: cloud-drift 32s ease-in-out infinite alternate; }
  .cloud.far { animation-duration: 46s; animation-delay: -16s; }
  .water-stream { fill: none; stroke: #89c5c9; stroke-width: 3.6; stroke-linecap: round; stroke-dasharray: 2 14; animation: watering 1.1s linear infinite; }
  .water-stream.thin { stroke-width: 2.4; animation-duration: 1.35s; animation-delay: -.4s; }
  .splash { animation: splash 1.35s ease-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .splash.second { animation-delay: -.65s; }
  .head-nod { animation: head-nod 5.6s ease-in-out infinite; transform-origin: 0 105px; }
  .beard { animation: beard 5.6s ease-in-out infinite; transform-origin: 0 87px; }
  .breathe { animation: breathe 5.6s ease-in-out infinite; transform-origin: 0 275px; }
  .gourd-eyes { animation: blink 7.5s ease-in-out infinite; animation-delay: var(--blink, 0s); transform-box: fill-box; transform-origin: center; }
  .grandpa-eyes { animation: blink 8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .grass-sway { animation: grass 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .falling-leaf { animation: falling-leaf 15s linear infinite; }
  .falling-leaf.two { animation-delay: -7s; animation-duration: 18s; }
  .wind { fill: none; stroke: #fafff4; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 100 360; opacity: 0; animation: wind 13s ease-in-out infinite; }
  .wind.second { animation-delay: -6s; }
  .world.is-paused .scene *, .world.is-paused .scene *::before, .world.is-paused .scene *::after { animation-play-state: paused !important; }
  @keyframes sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2.2deg); } }
  @keyframes leaf-sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
  @keyframes cloud-drift { from { transform: translateX(-12px); } to { transform: translateX(28px); } }
  @keyframes watering { to { stroke-dashoffset: -64; } }
  @keyframes splash { 0% { opacity: 0; transform: translateY(4px) scale(.7); } 35% { opacity: .85; } 100% { opacity: 0; transform: translateY(-10px) scale(1.15); } }
  @keyframes head-nod { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  @keyframes beard { 0%, 100% { transform: rotate(1deg); } 50% { transform: rotate(-2deg); } }
  @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
  @keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } }
  @keyframes grass { 0%, 100% { transform: skewX(-2deg); } 50% { transform: skewX(3deg); } }
  @keyframes falling-leaf { 0% { opacity: 0; transform: translate(40px, -15px) rotate(-25deg); } 10% { opacity: .8; } 65% { opacity: .8; } 90%, 100% { opacity: 0; transform: translate(-105px, 360px) rotate(135deg); } }
  @keyframes wind { 0%, 72%, 100% { opacity: 0; stroke-dashoffset: 280; } 80% { opacity: .7; } 93% { opacity: 0; stroke-dashoffset: -250; } }
  @media (max-width: 680px) {
    .masthead { top: 29px; left: 25px; }
    h1 { font-size: 32px; }
    .edition { top: 37px; right: 25px; font-size: 10px; writing-mode: vertical-rl; gap: 9px; }
    .edition .line { width: 1px; height: 24px; }
    .footer { left: 25px; bottom: 31px; font-size: 12px; }
    .controls { right: 24px; bottom: 22px; }
    .control { width: 40px; height: 40px; }
  }
  @media (max-height: 510px) and (orientation: landscape) {
    .masthead { top: 16px; left: 25px; }
    .edition, .footer { display: none; }
    h1 { font-size: 27px; }
    .controls { bottom: 15px; right: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .scene *, .control, .tooltip { animation: none !important; transition: none !important; }
    .falling-leaf, .wind { opacity: 0; }
  }
</style>

<script>
(() => {
  'use strict';
  const world = document.getElementById('world');
  const pauseButton = document.getElementById('pause');
  const fullscreenButton = document.getElementById('fullscreen');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const setLabel = (button, label) => {
    button.setAttribute('aria-label', label);
    button.title = label;
    button.querySelector('.tooltip').textContent = label;
  };
  const setPaused = (paused) => {
    world.classList.toggle('is-paused', paused);
    pauseButton.setAttribute('aria-pressed', String(paused));
    setLabel(pauseButton, paused ? '播放动画' : '暂停动画');
  };
  const syncMotionPreference = () => {
    setPaused(reducedMotion.matches);
    pauseButton.disabled = reducedMotion.matches;
    if (reducedMotion.matches) setLabel(pauseButton, '已按系统设置减少动态效果');
  };
  pauseButton.addEventListener('click', () => setPaused(!world.classList.contains('is-paused')));
  reducedMotion.addEventListener('change', syncMotionPreference);
  syncMotionPreference();
  if (!document.fullscreenEnabled || !world.requestFullscreen) {
    fullscreenButton.hidden = true;
    fullscreenButton.style.display = 'none';
  }
  fullscreenButton.addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await world.requestFullscreen();
    } catch {
      setLabel(fullscreenButton, '当前浏览器无法进入全屏');
    }
  });
  document.addEventListener('fullscreenchange', () => {
    const full = Boolean(document.fullscreenElement);
    world.classList.toggle('is-fullscreen', full);
    setLabel(fullscreenButton, full ? '退出全屏' : '全屏欣赏');
  });
})();
</script>
</body>
</html>
