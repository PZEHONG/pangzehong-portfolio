<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf6f0">
  <title>小壶的兜风日 · 茶壶骑行</title>
  <style>
    :root{--paper:#edf6f0;--ink:#294e48;--muted:#718a7d;--mint:#7fbeb0;--coral:#e99177;--line:#cddfd2;--gold:#edc775;color-scheme:light}
    *{box-sizing:border-box}
    html{min-width:280px;background:var(--paper)}
    body{margin:0;color:var(--ink);font-family:"Microsoft YaHei UI","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .page{width:min(1440px,100%);min-height:100svh;margin:0 auto;padding:29px 52px 25px;display:flex;flex-direction:column}
    .masthead{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:12px;letter-spacing:2px}
    .brand{display:flex;align-items:center;gap:11px;font-weight:700}
    .brand svg{width:30px;height:30px}
    .weather{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px}
    .weather span{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px #dcebe0}
    main{flex:1;display:flex;flex-direction:column;justify-content:center}
    .intro{text-align:center;padding-top:31px;position:relative;z-index:1}
    .eyebrow{margin:0 0 14px;font-size:10px;letter-spacing:4.5px;color:var(--muted);font-weight:600}
    h1{margin:0;font-family:"STKaiti","KaiTi","Kaiti SC",serif;font-weight:500;font-size:clamp(35px,3.8vw,54px);letter-spacing:6px;line-height:1.3}
    .subtitle{margin:16px 0 0;font-size:13px;color:var(--muted);letter-spacing:2px}
    .stage{width:100%;max-width:min(1200px,max(620px,calc((100svh - 392px)*2.033898)));margin:-3px auto -3px}
    .scene{width:100%;height:auto;display:block;overflow:hidden;aspect-ratio:1200/590}
    .console{display:flex;justify-content:center;align-items:center;gap:28px;position:relative;z-index:1}
    .play{display:flex;align-items:center;justify-content:center;gap:10px;min-width:129px;height:47px;padding:0 23px;border:0;border-radius:28px;color:var(--paper);background:var(--ink);cursor:pointer;font-size:13px;letter-spacing:1px;transition:background .18s,transform .18s}
    .play:hover{background:#3c6860;transform:translateY(-1px)}
    .play:active{transform:translateY(1px)}
    .play svg{width:15px;height:15px;flex-shrink:0}
    .speed{display:grid;grid-template-columns:auto 136px 38px;align-items:center;gap:13px;font-size:11px;letter-spacing:1px}
    .speed label{color:var(--muted)}
    .speed output{font-family:"Consolas",monospace;font-size:12px;text-align:right;letter-spacing:0}
    input[type=range]{--fill:38.46%;width:136px;height:32px;appearance:none;-webkit-appearance:none;margin:0;background:transparent;cursor:pointer;touch-action:pan-y}
    input[type=range]::-webkit-slider-runnable-track{height:4px;background:linear-gradient(to right,var(--mint) var(--fill),var(--line) var(--fill));border-radius:3px}
    input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:3px}
    input[type=range]::-moz-range-progress{height:4px;background:var(--mint)}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border:3px solid var(--paper);border-radius:50%;background:var(--ink);box-shadow:0 0 0 1px var(--ink);margin-top:-5.5px}
    input[type=range]::-moz-range-thumb{width:10px;height:10px;border:3px solid var(--paper);border-radius:50%;background:var(--ink);box-shadow:0 0 0 1px var(--ink)}
    button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:5px}
    .caption{margin:19px 0 0;text-align:center;font-size:11px;color:var(--muted);letter-spacing:1.5px;min-height:18px}
    footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);letter-spacing:1.5px}
    .footer-note{display:flex;align-items:center;gap:8px}
    .footer-note svg{width:12px;height:12px}
    .key{font-family:inherit;letter-spacing:0;padding:2px 5px;border:1px solid var(--line);border-radius:4px;font-size:9px}
    .pause-mark{display:block}.play-mark{display:none}
    .is-paused .pause-mark{display:none}.is-paused .play-mark{display:block}
    @media(min-width:1500px){.page{padding-top:38px;padding-bottom:29px}.intro{padding-top:40px}.stage{max-width:min(1200px,max(620px,calc((100svh - 418px)*2.033898)))}}
    @media(max-width:900px){.page{padding:25px 29px 23px}.intro{padding-top:42px}.stage{max-width:100%;margin:16px auto 14px}footer{margin-top:35px}}
    @media(max-width:680px){.page{padding:23px 22px 21px}.masthead{font-size:11px;letter-spacing:1px}.weather{font-size:10px;letter-spacing:1px}.brand svg{width:25px;height:25px}.intro{padding-top:43px}.eyebrow{font-size:9px;letter-spacing:3.3px;margin-bottom:15px}h1{font-size:35px;letter-spacing:3px}.subtitle{font-size:11px;letter-spacing:1.5px;margin-top:13px}.stage{width:calc(100% + 44px);max-width:none;margin:24px -22px 20px}.scene{aspect-ratio:650/505}.console{gap:20px;flex-direction:column}.play{height:45px;min-width:134px}.speed{grid-template-columns:auto 145px 34px;font-size:10px;gap:12px}input[type=range]{width:145px}.caption{font-size:10px;letter-spacing:1px;margin-top:16px}footer{margin-top:31px;letter-spacing:.8px;font-size:9px}.desktop-hint{display:none}}
    @media(max-width:350px){.page{padding-left:17px;padding-right:17px}.stage{width:calc(100% + 34px);margin-left:-17px;margin-right:-17px}h1{font-size:31px}.weather{letter-spacing:0}.brand{gap:6px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
  </style>
</head>

        </svg>
      </figure>
      <div class="console" aria-label="动画控制">
        <button id="play" class="play" type="button" aria-label="暂停动画" aria-controls="scene">
          <svg class="pause-mark" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><rect x="3" y="2" width="3" height="12" rx="1"/><rect x="10" y="2" width="3" height="12" rx="1"/></svg>
          <svg class="play-mark" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M4 2 14 8 4 14Z"/></svg>
          <span id="play-text">歇一小会</span>
        </button>
        <div class="speed"><label for="speed">骑行速度</label><input id="speed" type="range" min="0.5" max="1.8" step="0.1" value="1" aria-valuetext="1.0 倍速度"><output id="speed-value" for="speed">1.0×</output></div>
      </div>
      <p id="caption" class="caption" role="status" aria-live="polite">风很轻，茶还热。</p>
      <noscript><p class="caption">请启用浏览器的 JavaScript，让小壶骑起来。</p></noscript>
    </main>
    <footer><span class="footer-note"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M2 13Q0 2 13 2 13 14 2 13Zm0 0 7-7"/></svg>把日子，骑成一首小诗。</span><span class="desktop-hint"><kbd class="key">空格</kbd> 暂停 / 继续</span><span>慢慢骑，慢慢喜欢。</span></footer>
  </div>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const scene = $('scene'), play = $('play'), speed = $('speed');
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const narrowScreen = window.matchMedia('(max-width: 680px)');
      const nodes = Object.fromEntries(['rear-wheel','front-wheel','chainring','rider','lid','scarf-tail','tea-tag','eyes','clouds','birds','wind','flying-leaf','bike-shadow','far-leg-outline','far-leg-fill','near-leg-outline','near-leg-fill','far-foot','near-foot','far-crank','near-crank','near-crank-highlight'].map(id => [id, $(id)]));
      const meadow = Array.from(scene.querySelectorAll('[data-scenery]'));
      const road = Array.from(scene.querySelectorAll('[data-road]'));
      const flowers = Array.from(scene.querySelectorAll('[data-flower]'));
      const steam = Array.from(scene.querySelectorAll('[data-steam]'));
      let running = !motionPreference.matches, rate = 1, time = 0, previous = 0, frameId = 0;
      const fmt = value => value.toFixed(2);
      const wrap = (value, span, start) => ((value - start) % span + span) % span + start;
      function position(element, x, y, angle = 0) {
        element.setAttribute('transform', `translate(${fmt(x)} ${fmt(y)}) rotate(${fmt(angle)})`);
      }
      function leg(prefix, hip, foot, upper, lower) {
        const dx = foot.x - hip.x, dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const cosine = Math.max(-1, Math.min(1, (upper * upper + distance * distance - lower * lower) / (2 * upper * distance)));
        const angle = Math.atan2(dy, dx) - Math.acos(cosine);
        const knee = {x: hip.x + Math.cos(angle) * upper, y: hip.y + Math.sin(angle) * upper};
        const path = `M${fmt(hip.x)} ${fmt(hip.y)} Q${fmt(knee.x - 5)} ${fmt(knee.y - 10)} ${fmt(knee.x)} ${fmt(knee.y)} L${fmt(foot.x)} ${fmt(foot.y)}`;
        nodes[prefix + '-leg-outline'].setAttribute('d', path);
        nodes[prefix + '-leg-fill'].setAttribute('d', path);
        position(nodes[prefix + '-foot'], foot.x, foot.y);
      }
      function render() {
        const angle = time * 2.8 + .5;
        const bob = Math.sin(angle * 2) * 2.2;
        const near = {x:606 + Math.cos(angle) * 32, y:478 + Math.sin(angle) * 32};
        const far = {x:606 - Math.cos(angle) * 32, y:478 - Math.sin(angle) * 32};
        const wheelAngle = time * 2.8 * 1.9 * 180 / Math.PI;
        nodes['rear-wheel'].setAttribute('transform', `rotate(${fmt(wheelAngle)})`);
        nodes['front-wheel'].setAttribute('transform', `rotate(${fmt(wheelAngle)})`);
        nodes.chainring.setAttribute('transform', `rotate(${fmt(angle * 180 / Math.PI)} 606 488)`);
        nodes.rider.setAttribute('transform', `translate(0 ${fmt(bob)})`);
        nodes.lid.setAttribute('transform', `rotate(${fmt(Math.sin(angle * 2 + .3) * 1.3)} 582 244)`);
        nodes['scarf-tail'].setAttribute('transform', `rotate(${fmt(Math.sin(time * 5) * 4)} 537 258)`);
        nodes['tea-tag'].setAttribute('transform', `rotate(${fmt(Math.sin(time * 3) * 7)} 475 302)`);
        leg('near', {x:591,y:361+bob}, near, 81, 87);
        leg('far', {x:573,y:359+bob}, far, 80, 90);
        nodes['far-crank'].setAttribute('d', `M606 488L${fmt(far.x)} ${fmt(far.y+10)}`);
        const nearCrank = `M606 488L${fmt(near.x)} ${fmt(near.y+10)}`;
        nodes['near-crank'].setAttribute('d', nearCrank);
        nodes['near-crank-highlight'].setAttribute('d', nearCrank);
        const blink = time % 6.3;
        const eyeScale = blink > 5.96 && blink < 6.13 ? .16 : 1;
        nodes.eyes.setAttribute('transform', `translate(0 287) scale(1 ${eyeScale}) translate(0 -287)`);
        steam.forEach((element,index) => {
          const phase = (time * .36 + index * .31) % 1;
          element.setAttribute('transform', `translate(${fmt(-phase * 17 + Math.sin(time * 1.5 + index) * 3)} ${fmt(-phase * 13)})`);
          element.setAttribute('opacity', fmt(Math.sin(phase * Math.PI) * .55));
        });
        position(nodes.clouds, Math.sin(time * .13) * 17, Math.sin(time * .18) * 3);
        position(nodes.birds, Math.sin(time * .2) * 22, Math.sin(time * .8) * 3);
        meadow.forEach(element => position(element, wrap(Number(element.dataset.scenery) - time * 26, 1420, -100), 0));
        road.forEach(element => position(element, wrap(Number(element.dataset.road) - time * 130, 1360, -80), 0));
        flowers.forEach(element => position(element, wrap(Number(element.dataset.flower) - time * 130, 1420, -100), 0));
        const leafX = wrap(930 - time * 64, 1330, -70);
        position(nodes['flying-leaf'], leafX, 312 + Math.sin(time * 1.3) * 25, Math.sin(time * 1.8) * 30 - 12);
        nodes.wind.setAttribute('opacity', fmt(.4 + Math.sin(time * 2.5) * .18));
        nodes['bike-shadow'].setAttribute('rx', fmt(229 + bob * 1.8));
      }
      function tick(now) {
        frameId = 0;
        if (!running || document.hidden) { previous = 0; return; }
        if (previous) time += Math.min((now - previous) / 1000, .05) * rate;
        previous = now;
        render();
        frameId = requestAnimationFrame(tick);
      }
      function schedule() {
        if (running && !document.hidden && !frameId) frameId = requestAnimationFrame(tick);
      }
      function updateControls(systemPaused = false) {
        play.classList.toggle('is-paused', !running);
        play.setAttribute('aria-label', running ? '暂停动画' : '继续播放动画');
        $('play-text').textContent = running ? '歇一小会' : '继续兜风';
        $('caption').textContent = systemPaused ? '已按系统偏好暂停，点「继续兜风」即可出发。' : !running ? '歇一小会，风景不会走远。' : rate > 1.3 ? '追一阵风，带一路茶香。' : rate < .8 ? '慢一点，也是一种好心情。' : '风很轻，茶还热。';
      }
      function setRunning(value, systemPaused = false) {
        running = value;
        previous = 0;
        if (frameId) cancelAnimationFrame(frameId);
        frameId = 0;
        updateControls(systemPaused);
        schedule();
      }
      play.addEventListener('click', () => setRunning(!running));
      speed.addEventListener('input', () => {
        rate = Number(speed.value);
        $('speed-value').textContent = rate.toFixed(1) + '×';
        speed.setAttribute('aria-valuetext', rate.toFixed(1) + ' 倍速度');
        speed.style.setProperty('--fill', ((rate - .5) / 1.3 * 100).toFixed(2) + '%');
        updateControls();
      });
      document.addEventListener('keydown', event => {
        if (event.code === 'Space' && !event.repeat && !event.altKey && !event.ctrlKey && !event.metaKey && !event.target.closest('input,button,textarea,select,a,[contenteditable]')) {
          event.preventDefault();
          setRunning(!running);
        }
      });
      document.addEventListener('visibilitychange', () => {
        previous = 0;
        if (document.hidden && frameId) { cancelAnimationFrame(frameId); frameId = 0; }
        schedule();
      });
      motionPreference.addEventListener('change', event => { if (event.matches) setRunning(false, true); });
      function resizeScene() { scene.setAttribute('viewBox', narrowScreen.matches ? '305 125 650 505' : '0 60 1200 590'); }
      narrowScreen.addEventListener('change', resizeScene);
      resizeScene();
      render();
      updateControls(motionPreference.matches);
      schedule();
    })();
  </script>
</body>
</html>
