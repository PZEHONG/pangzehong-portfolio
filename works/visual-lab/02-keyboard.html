  <style>

      .identity{left:23px;top:95px}.identity h1{font-size:37px}.identity p{font-size:11px;margin-top:10px}.spec{right:23px;top:97px}.spec b{font-size:20px}.spec span{font-size:9px}
      #stage{inset:174px 0 246px}.pin{width:17px;height:17px;font-size:8px}
      .parts{left:24px;right:24px;bottom:228px;flex-direction:row;justify-content:space-between;gap:10px}.part{grid-template-columns:14px auto;gap:4px;font-size:10px}.part>.mono{font-size:9px}.part>em{display:none}.part-name{gap:5px}.part-name em{display:block;width:5px;height:5px}
      .view-tools{right:22px;top:146px;bottom:auto}.view-tools>span{display:none}.icon-button{width:36px;height:36px;background:#edf0eeeb}.icon-button svg{width:16px;height:16px}
      .console{height:206px;left:23px;right:23px;display:flex;flex-wrap:wrap;column-gap:0;row-gap:0;align-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
      .explosion-control{order:0;width:100%;padding-top:13px}.slider-heading{margin-bottom:7px}.slider-heading label{font-size:12px}.slider-heading output{font-size:18px}.range-ends{margin-top:4px}
      .palette-control{order:1;display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:23px}.control-title{margin:0;font-size:11px}.palette-options{gap:10px}.swatch{width:27px;height:27px}#palette-name{font-size:11px;margin-left:4px;min-width:40px}
    }
    @media(max-height:720px) and (min-width:601px){.identity{top:94px}.identity h1{font-size:36px}.identity p{margin-top:9px}.spec{top:96px}#stage{top:151px}.console{height:128px}.parts{bottom:156px}.view-tools{bottom:147px}}
    @media(prefers-reduced-motion:reduce){*,*::after{transition:none!important}}
  </style>

<body>
  <header class="topbar">

  <main id="stage" aria-label="FORM 68 机械键盘三维结构">

    <div class="part"><span class="mono">01</span><span class="part-name"><em style="--part-color:#e96150"></em>双色键帽</span><em style="--part-color:#e96150"></em></div>
    <div class="part"><span class="mono">02</span><span class="part-name"><em style="--part-color:#34735d"></em>电路板</span><em style="--part-color:#34735d"></em></div>
    <div class="part"><span class="mono">03</span><span class="part-name"><em style="--part-color:#8a9599"></em>铝合金底壳</span><em style="--part-color:#8a9599"></em></div>
  </div>
  <div class="view-tools"><span class="mono">ISOMETRIC VIEW</span><button id="reset" class="icon-button" type="button" title="重置视角" aria-label="重置视角"><i data-lucide="rotate-ccw" aria-hidden="true"></i></button></div>

    <div class="explosion-control"><div class="slider-heading"><label for="explode">拆解程度</label><output id="explode-value" for="explode">35<small>%</small></output></div><input type="range" id="explode" min="0" max="100" step="1" value="35" aria-valuetext="拆解 35%"><div class="range-ends"><span>完整组装</span><span>完全展开</span></div></div>

  <script src="assets/three.min.js"></script>

  <script>
  (() => {
    'use strict';
    const stage = document.getElementById('stage');
    const slider = document.getElementById('explode');
    const output = document.getElementById('explode-value');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let renderer, scene, camera, controls, model, capLayer, pcbLayer, baseLayer;
    let frameCount = 0, animationId = 0, previousTime = 0, target = 0.35, current = 0.35;
    let palette = 'coral', lastError = null, running = false, lostContext = false;
    let stageWidth = 1, stageHeight = 1, lastTargetY = 1.2;
    const materials = {}, keyMeshes = [], legendMeshes = [], layerPins = [];
    const basePositions = { keycaps: 0.81, pcb: 0.34, base: 0 };
    const paletteColors = { coral: { accent: '#e96150', key: '#f5f5ed', label: '珊瑚红' }, graphite: { accent: '#354f47', key: '#e0e5df', label: '松石绿' } };
    Object.defineProperty(window, 'labState', { configurable: false, get() {
      return Object.freeze({ ready: Boolean(renderer && frameCount && !lastError), explosion: Number((target * 100).toFixed(2)), renderedExplosion: Number((current * 100).toFixed(2)), palette, renderedFrames: frameCount, frameCount, keyCount: keyMeshes.length, paused: document.hidden || !running, error: lastError, layerCount: model ? model.children.length : 0, layers: Object.freeze([capLayer, pcbLayer, baseLayer].filter(Boolean).map(group => Object.freeze({ name: group.name, y: Number(group.position.y.toFixed(4)), children: group.children.length }))), viewport: Object.freeze({ width: stageWidth, height: stageHeight }), cameraZoom: camera ? camera.zoom : null, cameraPosition: camera ? Object.freeze(camera.position.toArray()) : null, cameraTarget: controls ? Object.freeze(controls.target.toArray()) : null });
    } });
    function fail(error) {
      lastError = error instanceof Error ? error.message : String(error);
      running = false;
      cancelAnimationFrame(animationId);
      document.getElementById('error-detail').textContent = lastError;
      document.getElementById('error').hidden = false;
      console.error('[FORM / 68]', error);
    }
    function roundedShape(w, d, r) {
      const s = new THREE.Shape(), x = -w / 2, y = -d / 2;
      s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
      s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
      s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);
      s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
      return s;
    }
    const geometryCache = new Map();
    function roundedGeometry(w, d, h, r, bevel = 0.025, taper = 0) {
      r = Math.min(r, (w - bevel * 2) * 0.45, (d - bevel * 2) * 0.45);
      const id = [w, d, h, r, bevel, taper].join(':');
      if (geometryCache.has(id)) return geometryCache.get(id);
      const g = new THREE.ExtrudeGeometry(roundedShape(w - bevel * 2, d - bevel * 2, r), { depth: h - 2 * bevel, steps: 1, bevelEnabled: bevel > 0, bevelSegments: 3, bevelSize: bevel, bevelThickness: bevel, curveSegments: 5 });
      g.rotateX(-Math.PI / 2); g.translate(0, -h / 2 + bevel, 0);
      if (taper) {
        const pos = g.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const factor = 1 - taper * (pos.getY(i) / h + 0.5);
          pos.setX(i, pos.getX(i) * factor); pos.setZ(i, pos.getZ(i) * factor);
        }
        pos.needsUpdate = true; g.computeVertexNormals();
      }
      geometryCache.set(id, g); return g;
    }
    function piece(parent, geometry, material, x, y, z, shadow = true) {
      const mesh = new THREE.Mesh(geometry, material); mesh.position.set(x, y, z);
      mesh.castShadow = shadow; mesh.receiveShadow = true; parent.add(mesh); return mesh;
    }
    function box(parent, w, h, d, material, x, y, z, radius = 0.035) {
      return piece(parent, roundedGeometry(w, d, h, radius, Math.min(0.018, h / 5, w / 8, d / 8)), material, x, y, z);
    }
    function cylinder(parent, radius, height, material, x, y, z, segments = 16) {
      return piece(parent, new THREE.CylinderGeometry(radius, radius, height, segments), material, x, y, z);
    }
    function addScrew(parent, x, y, z) {
      cylinder(parent, 0.074, 0.036, materials.steel, x, y, z);
      const slot = piece(parent, new THREE.BoxGeometry(0.079, 0.003, 0.014), materials.darkMetal, x, y + 0.02, z, false);
      slot.rotation.y = Math.PI / 4;
      const slot2 = slot.clone(); slot2.rotation.y += Math.PI / 2; parent.add(slot2);
    }
    const legends = new Map();
    function legendTexture(text, light) {
      const cacheKey = text + ':' + light;
      if (legends.has(cacheKey)) return legends.get(cacheKey);
      const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      if (!ctx) throw new Error('无法创建键帽字符纹理：Canvas 2D 不可用。');
      ctx.clearRect(0, 0, 256, 128); ctx.fillStyle = light ? '#fff8ed' : '#43504a';
      ctx.font = '600 ' + (text.length > 3 ? '29' : text.length > 1 ? '35' : '43') + 'px Arial';
      ctx.textBaseline = 'top'; ctx.textAlign = 'left';
      if (text === 'FORM') { ctx.font = '500 17px Arial'; ctx.textAlign = 'center'; ctx.fillText(text, 128, 57); }
      else ctx.fillText(text, 18, 16);
      const texture = new THREE.CanvasTexture(canvas); texture.encoding = THREE.sRGBEncoding;
      texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); legends.set(cacheKey, texture); return texture;
    }
    function boardTexture() {
      const canvas = document.createElement('canvas'); canvas.width = 2048; canvas.height = 768;
      const c = canvas.getContext('2d');
      if (!c) throw new Error('无法创建电路板纹理：Canvas 2D 不可用。');
      c.fillStyle = '#216648'; c.fillRect(0, 0, canvas.width, canvas.height);
      c.strokeStyle = '#8d9a50'; c.lineWidth = 2;
      // Routed horizontal buses and angled branches follow the real key matrix.
      for (let row = 0; row < 5; row++) {
        for (let lane = 0; lane < 4; lane++) {
          const y = 70 + row * 143 + lane * 8;
          c.beginPath(); c.moveTo(33, y); c.lineTo(1980 - lane * 12, y); c.lineTo(2010 - lane * 12, y + 30); c.stroke();
        }
      }
      for (let col = 0; col < 16; col++) {
        const x = 64 + col * 124;
        for (let row = 0; row < 5; row++) {
          const y = 35 + row * 142;
          c.strokeStyle = row % 2 ? '#b2a466' : '#759b54'; c.lineWidth = 2.3;
          c.beginPath(); c.moveTo(x, y); c.lineTo(x + 36, y); c.lineTo(x + 57, y + 21); c.lineTo(x + 57, y + 91); c.lineTo(x + 78, y + 112); c.lineTo(x + 112, y + 112); c.stroke();
          c.strokeStyle = '#c4cdaa'; c.lineWidth = 1.4; c.strokeRect(x + 5, y + 25, 70, 66);
          c.fillStyle = '#dfd6a1';
          for (let pad = 0; pad < 3; pad++) { c.beginPath(); c.arc(x + 12 + pad * 27, y + 108, 4, 0, Math.PI * 2); c.fill(); }
          c.fillStyle = '#d9e3c5'; c.font = '11px monospace'; c.fillText('D' + (row * 16 + col + 1), x + 3, y + 20);
        }
      }
      c.strokeStyle = '#d4dfb7'; c.lineWidth = 3; c.strokeRect(17, 17, 2014, 734);
      c.fillStyle = '#e0e8cc'; c.font = 'bold 24px monospace'; c.fillText('FORM / 68', 700, 733);
      c.font = '14px monospace'; c.fillText('REV 02   |   HOT SWAP   |   FR-4', 952, 730);
      const t = new THREE.CanvasTexture(canvas); t.encoding = THREE.sRGBEncoding;
      t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); return t;
    }
    function createModel() {
      materials.key = new THREE.MeshStandardMaterial({ color: '#f5f5ed', roughness: 0.37, metalness: 0.02 });
      materials.accent = new THREE.MeshStandardMaterial({ color: '#e96150', roughness: 0.32, metalness: 0.03 });
      materials.aluminum = new THREE.MeshStandardMaterial({ color: '#b7c0be', metalness: 0.78, roughness: 0.31 });
      materials.edge = new THREE.MeshStandardMaterial({ color: '#d5ded9', metalness: 0.75, roughness: 0.26 });
      materials.darkMetal = new THREE.MeshStandardMaterial({ color: '#333e3b', metalness: 0.65, roughness: 0.4 });
      materials.steel = new THREE.MeshStandardMaterial({ color: '#dbe0d5', metalness: 0.83, roughness: 0.23 });
      materials.board = new THREE.MeshStandardMaterial({ color: '#276849', roughness: 0.55, metalness: 0.13 });
      materials.black = new THREE.MeshStandardMaterial({ color: '#1e2824', roughness: 0.58 });
      materials.switch = new THREE.MeshStandardMaterial({ color: '#cfddd0', roughness: 0.25, metalness: 0.1 });
      materials.stem = new THREE.MeshStandardMaterial({ color: '#e79580', roughness: 0.4 });
      materials.copper = new THREE.MeshStandardMaterial({ color: '#cda969', metalness: 0.72, roughness: 0.35 });
      materials.rubber = new THREE.MeshStandardMaterial({ color: '#65716a', roughness: 0.95 });
      model = new THREE.Group(); model.name = 'FORM 68'; scene.add(model);
      capLayer = new THREE.Group(); capLayer.name = 'keycaps'; model.add(capLayer);
      pcbLayer = new THREE.Group(); pcbLayer.name = 'pcb'; model.add(pcbLayer);
      baseLayer = new THREE.Group(); baseLayer.name = 'base'; model.add(baseLayer);
      box(baseLayer, 10.12, 0.33, 3.59, materials.aluminum, 0, 0, 0, 0.16);
      box(baseLayer, 9.73, 0.043, 3.22, materials.darkMetal, 0, 0.18, 0, 0.1);
      box(baseLayer, 9.45, 0.02, 2.96, materials.rubber, 0, 0.207, 0, 0.08);
      box(baseLayer, 10.05, 0.16, 0.11, materials.edge, 0, 0.215, -1.72, 0.04);
      box(baseLayer, 10.05, 0.16, 0.11, materials.edge, 0, 0.215, 1.72, 0.04);
      box(baseLayer, 0.11, 0.16, 3.41, materials.edge, -4.97, 0.215, 0, 0.035);
      box(baseLayer, 0.11, 0.16, 3.41, materials.edge, 4.97, 0.215, 0, 0.035);
      for (const x of [-4.76, 0, 4.76]) for (const z of [-1.48, 1.48]) {
        cylinder(baseLayer, 0.11, 0.085, materials.aluminum, x, 0.235, z);
        addScrew(baseLayer, x, 0.29, z);
      }

      for (let i = 0; i < 9; i++) for (const side of [-1, 1]) box(pcbLayer, 0.025, 0.045, 0.075, materials.steel, -0.12 + i * 0.055, 0.085, 1.15 + side * 0.235, 0.002);
      for (let i = 0; i < 18; i++) {

        for (const dx of [-0.065, 0.065]) box(pcbLayer, 0.033, 0.045, 0.058, materials.steel, x + dx, 0.08, z, 0.004);
      }
      const rows = [
        [['Esc',1,1],['1',1],['2',1],['3',1],['4',1],['5',1],['6',1],['7',1],['8',1],['9',1],['0',1],['-',1],['=',1],['Back',2],['Del',1,1]],

        [['Caps',1.75],['A',1],['S',1],['D',1],['F',1],['G',1],['H',1],['J',1],['K',1],['L',1],[';',1],["'",1],['Enter',2.25,1],['PgDn',1]],
        [['Shift',2.25],['Z',1],['X',1],['C',1],['V',1],['B',1],['N',1],['M',1],[',',1],['.',1],['/',1],['Shift',1.75],['↑',1,1],['End',1]],

      const padGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.009, 10);

          textPlane.rotation.x = -Math.PI / 2; legendMeshes.push(textPlane);

          piece(pcbLayer, switchGeo, materials.switch, x, 0.16, z);
          piece(pcbLayer, stemGeo, materials.stem, x, 0.255, z);
          const cross = piece(pcbLayer, stemGeo, materials.stem, x, 0.255, z); cross.rotation.y = Math.PI / 2;
          for (const dx of [-0.225, 0.225]) piece(pcbLayer, padGeo, materials.copper, x + dx, 0.066, z + 0.13, false);

    }
    function frameCamera() {
      const aspect = stageWidth / stageHeight;
      // Open the orthographic framing with the layers, keeping the entire assembly visible.
      const height = Math.max(7.15 + current * 2.1, 11.85 / aspect);
      camera.left = -height * aspect / 2; camera.right = height * aspect / 2;
      camera.top = height / 2; camera.bottom = -height / 2;
      camera.updateProjectionMatrix();
    }
    function resize() {
      stageWidth = stage.clientWidth; stageHeight = stage.clientHeight;
      if (!renderer || !stageWidth || !stageHeight) return;
      frameCamera(); renderer.setSize(stageWidth, stageHeight, false);
    }
    function updateExplosion() {
      capLayer.position.y = basePositions.keycaps + current * 3.45;
      pcbLayer.position.y = basePositions.pcb + current * 1.57;
      const targetY = 0.48 + current * 1.62, delta = targetY - lastTargetY;
      controls.target.y += delta; camera.position.y += delta; lastTargetY = targetY;
      frameCamera();
    }
    const projectedPoint = { value: null };

      if (!projectedPoint.value) projectedPoint.value = new THREE.Vector3();
      for (const pin of layerPins) {
        const p = projectedPoint.value.copy(pin.point); pin.group.localToWorld(p); p.project(camera);
        const x = (p.x * 0.5 + 0.5) * stageWidth, y = (-p.y * 0.5 + 0.5) * stageHeight;
        pin.element.style.left = x.toFixed(1) + 'px'; pin.element.style.top = y.toFixed(1) + 'px';
        pin.element.style.opacity = current > 0.24 && x > 16 && x < stageWidth - 16 && y > 16 && y < stageHeight - 16 ? '1' : '0';
      }
    }
    function tick(time) {
      if (!running || document.hidden || lostContext) return;
      const dt = Math.min((time - (previousTime || time)) / 1000, 0.05); previousTime = time;
      current = reducedMotion ? target : current + (target - current) * (1 - Math.exp(-dt * 10));
      if (Math.abs(target - current) < 0.00005) current = target;
      updateExplosion(); controls.update();
      scene.updateMatrixWorld(); updatePins();
      try { renderer.render(scene, camera); frameCount++; } catch (error) { fail(error); return; }
      animationId = requestAnimationFrame(tick);
    }
    function setExplosion(value) {
      target = Math.min(100, Math.max(0, Number(value))) / 100;
      slider.value = String(Math.round(target * 100)); slider.style.setProperty('--fill', slider.value + '%');
      slider.setAttribute('aria-valuetext', '拆解 ' + slider.value + '%');
      output.replaceChildren(document.createTextNode(slider.value), Object.assign(document.createElement('small'), { textContent: '%' }));
    }
    function setPalette(name) {
      if (!paletteColors[name]) return;
      palette = name; const colors = paletteColors[name];
      materials.accent.color.set(colors.accent); materials.key.color.set(colors.key);
      document.documentElement.style.setProperty('--accent', colors.accent);
      document.getElementById('palette-name').textContent = colors.label;

    }

      const damping = controls.enableDamping;
      controls.enableDamping = false; controls.update(); controls.enableDamping = damping;
      lastTargetY = 0.48 + current * 1.62;
      controls.target.set(0, lastTargetY, 0);
      camera.position.set(8.3, lastTargetY + 10.5, 13.5); camera.zoom = 1; camera.updateProjectionMatrix();
      camera.lookAt(controls.target); controls.update();

    try {
      if (!window.THREE) throw new Error('本地资源缺失：assets/three.min.js');
      if (!THREE.OrbitControls) throw new Error('本地资源缺失：assets/OrbitControls.js');
      if (!window.lucide) throw new Error('本地资源缺失：assets/lucide.min.js');
      lucide.createIcons();
      THREE.ColorManagement.legacyMode = false;
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });

      renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.78;

      controls.rotateSpeed = 0.65; controls.zoomSpeed = 0.75;

      const keyLight = new THREE.DirectionalLight(0xfffaf2, 1.1); keyLight.position.set(-5, 12, 7); keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(2048, 2048); keyLight.shadow.camera.left = -9; keyLight.shadow.camera.right = 9;
      keyLight.shadow.camera.top = 9; keyLight.shadow.camera.bottom = -9; keyLight.shadow.camera.near = 0.5; keyLight.shadow.camera.far = 32;
      keyLight.shadow.normalBias = 0.018; keyLight.shadow.bias = -0.00015; keyLight.shadow.radius = 3; scene.add(keyLight);
      const fill = new THREE.DirectionalLight(0xe0edf2, 0.32); fill.position.set(5, 4, -7); scene.add(fill);
      const rim = new THREE.DirectionalLight(0xffffff, 0.22); rim.position.set(-7, 3, -4); scene.add(rim);
