<body>
  <main id="game" data-state="loading" aria-busy="true" inert>
    <canvas id="world" aria-label="沙漠公路驾驶场景"></canvas>
    <div class="film-edge" aria-hidden="true"></div>
    <header class="topbar">
      <div class="wordmark"><span class="brand-icon" data-icon="route"></span><div><strong>孤独的沙漠公路</strong><span id="edition">DLC 09 · 旅途回声</span></div></div>
      <div class="journey" id="journey" hidden>
        <div class="journey-label"><span id="mode-label">八小时旅程</span><span id="progress-percent">0.0%</span></div>
        <div class="progress-track"><div id="progress-fill"></div></div>
        <div class="journey-time"><time id="elapsed">00:00:00</time><span id="goal-time">/ 08:00:00</span></div>
      </div>
      <nav class="tools" aria-label="游戏设置">
        <button class="icon-button" id="pause" aria-label="暂停" data-tip="暂停" hidden><i data-icon="pause"></i></button>
        <button class="icon-button" id="camera" aria-label="切换驾驶视角" data-tip="切换视角" hidden><i data-icon="camera"></i></button>
        <button class="icon-button" id="headlights" aria-label="开启车灯" aria-pressed="false" data-tip="开启车灯" hidden><i data-icon="flashlight"></i></button>
        <button class="icon-button" id="audio" aria-label="开启声音" aria-pressed="false" data-tip="开启声音"><i data-icon="volume-x"></i></button>
        <button class="icon-button" id="fullscreen" aria-label="全屏" data-tip="全屏"><i data-icon="maximize"></i></button>
      </nav>
    </header>

    <section id="start-screen" class="start-screen" aria-labelledby="game-title">
      <div class="intro">
        <div class="eyebrow">THE LONELY DESERT HIGHWAY</div>
        <h1 id="game-title">孤独的<br>沙漠公路<span class="title-period">。</span></h1>
        <div class="mode-picker" role="radiogroup" aria-label="旅程模式">
          <button type="button" role="radio" class="mode selected" aria-checked="true" data-mode="classic"><span>原著模式</span><b>8 小时</b></button>
          <button type="button" role="radio" class="mode" aria-checked="false" data-mode="trial"><span>短途体验</span><b>3 分钟</b></button>
        </div>
        <div class="route-options">
          <button id="landscapes" class="landscape-button" aria-label="选择场景"><i data-icon="map"></i><span id="landscape-label">孤独沙漠</span><i data-icon="chevron-down"></i></button>
          <label class="endless-switch"><input id="endless" type="checkbox"><i data-icon="infinity"></i><span>无尽往返</span></label>
        </div>
        <div class="extra-options">
          <label class="endless-switch"><input id="story-on" type="checkbox" checked><span>旅途奇遇</span></label>
          <button id="appearance" class="landscape-button" aria-label="选择车辆"><i data-icon="car-front"></i><span id="appearance-label">旅行车</span></button>
          <button id="journal" class="icon-button" aria-label="旅途手记" data-tip="旅途手记"><i data-icon="book-open"></i></button>
        </div>
        <label class="driver-field"><i data-icon="user-round"></i><input id="driver" aria-label="驾驶员姓名" placeholder="无名旅人" maxlength="16" autocomplete="off" spellcheck="false"></label>
        <div class="start-actions"><button id="start" class="primary" disabled><span id="start-label">准备公路…</span><i data-icon="arrow-right"></i></button><button id="online" class="text-button" hidden><i data-icon="users"></i>联机同行</button><button id="records" class="text-button"><i data-icon="trophy"></i>时间榜</button></div>
      </div>
      <div class="route-stamp" aria-hidden="true"><span id="stamp-label">终点之前</span><b id="stamp-time">08:00:00</b><span class="stamp-line"></span><small id="stamp-place">孤独沙漠 / 00</small></div>
      <footer class="credits"><span>灵感源自《亏成首富从游戏开始》</span><span>原著 / 青衫取醉</span></footer>
    </section>

    <section id="hud" class="hud" aria-label="驾驶仪表" hidden>
      <div class="boost-dock"><button id="reverse-control" class="icon-button" aria-label="切换倒车" aria-pressed="false" data-tip="切换倒车"><i data-icon="rotate-ccw"></i></button><button id="boost-control" data-control="boost" class="icon-button" aria-label="喷气加速" data-tip="喷气加速"><i data-icon="rocket"></i></button><div id="boost-energy" class="boost-gauge" role="meter" aria-label="加速能量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span id="boost-fill"></span></div><span id="boost-percent" aria-hidden="true">100%</span></div>
      <div class="odometer"><span class="instrument-label">本次旅程</span><div><b id="distance">0.0</b><small>km</small></div><span id="weather">晴 · 微风</span></div>
      <div class="speedometer"><div class="speed-line"><span id="gear">N</span><b id="speed">000</b><small>km/h</small></div><div class="speed-track"><div id="speed-fill"></div></div><div class="speed-foot"><span id="drive-status">发动机怠速</span><span id="clock">16:40</span></div></div>
      <div class="radio"><button id="radio" class="icon-button" aria-label="关闭电台" aria-pressed="true" data-tip="电台开关"><i data-icon="radio"></i></button><div class="radio-info"><span class="instrument-label" id="radio-station">FM 88.0</span><strong id="radio-title">公路来信</strong></div><div class="radio-adjust"><button id="radio-next" class="icon-button" aria-label="下一首" data-tip="下一首"><i data-icon="skip-forward"></i></button><input id="radio-volume" type="range" min="0" max="100" value="70" aria-label="电台音量" title="电台音量"></div><div class="radio-track"><div id="radio-progress"></div></div></div>
    </section>
    <aside id="story-status" class="story-status" hidden><div><i id="story-icon" data-icon="user-round"></i><strong id="story-title">旅行者 · 包旭</strong></div><span id="story-detail"></span><button id="pickup" class="text-button" hidden><i data-icon="user-plus"></i><span>接包旭上车</span></button><button id="check-in" class="text-button" hidden><i data-icon="map-pin"></i><span>景点打卡</span></button><button id="view-site" class="text-button" aria-pressed="false" hidden><i data-icon="binoculars"></i><span id="view-site-label">停车观景</span></button></aside>
    <button id="assistant-toggle" class="assistant-toggle" aria-pressed="true" aria-label="关闭 AEEIS 副驾" data-tip="关闭 AEEIS 副驾" hidden><i data-icon="bot"></i><span>AEEIS</span></button>
    <div id="dialogue" class="dialogue" role="status" hidden></div>
    <aside id="road-event-status" class="road-event-status" hidden><strong id="road-event-title"></strong><span id="road-event-detail"></span><select id="repair-target" aria-label="维修车辆" hidden></select><div class="road-event-actions"><button id="repair-open" class="text-button" hidden><i data-icon="wrench"></i>停车维修</button><button id="night-view" class="text-button" hidden><i data-icon="binoculars"></i><span id="night-view-label">停靠观赏</span></button><button id="night-stamp" class="text-button" hidden><i data-icon="map-pin"></i><span id="night-stamp-label">记录奇遇</span></button><button id="survey-start" class="text-button" hidden><i data-icon="scan-line"></i><span id="survey-start-label">停车扫描</span></button><button id="survey-cancel" class="icon-button" aria-label="结束扫描并返回公路" data-tip="返回公路" hidden><i data-icon="x"></i></button><button id="night-photo" class="icon-button" aria-label="保存奇遇照片" data-tip="留影" hidden><i data-icon="camera"></i></button></div><div id="survey-work" hidden><strong id="survey-phase"></strong><div id="survey-tuner"><div class="survey-reading"><output id="survey-frequency-label" for="survey-frequency"></output><span id="survey-lock"></span></div><div class="survey-dial"><span id="survey-band"></span><input id="survey-frequency" type="range" min="0" max="100" value="50" aria-label="扫描接收频率"></div></div><progress id="survey-progress" max="1" value="0" aria-label="扫描进度"></progress></div></aside>
    <dialog id="repair-panel" aria-labelledby="repair-heading"><div class="repair-top"><h2 id="repair-heading"></h2><button id="repair-close" class="icon-button" aria-label="返回公路" data-tip="返回公路"><i data-icon="x"></i></button></div><p id="repair-step"></p><progress id="repair-progress" max="3" value="0" aria-label="维修进度"></progress><div id="repair-work"></div><p id="repair-message" role="status"></p></dialog>
    <div id="road-warning" class="road-warning" role="status" hidden><i data-icon="triangle-alert"></i><span>偏离公路</span></div>
    <aside id="online-dock" class="online-dock" hidden aria-label="同行房间">
      <div class="online-bar"><button id="room-members" class="room-members" aria-label="同行旅人" aria-expanded="false"><i data-icon="users"></i><span id="room-count">1 / 8</span></button><div class="room-meta"><b id="room-code"></b><span id="connection-state" role="status">连接中</span></div><button id="invite" class="icon-button" aria-label="复制邀请链接" data-tip="邀请好友"><i data-icon="copy"></i></button><button id="voice" class="icon-button" aria-label="开启语音" aria-pressed="false" data-tip="语音"><i data-icon="mic-off"></i></button><button id="chat-toggle" class="icon-button" aria-label="房间聊天" aria-expanded="false" data-tip="聊天"><i data-icon="message-circle"></i><span id="chat-unread" hidden></span></button></div>
      <div id="room-roster" class="room-roster" hidden>
        <section id="encounter-status" hidden aria-label="途中偶遇"><strong id="encounter-title"></strong><span id="encounter-detail"></span><div><button id="encounter-accept" class="text-button"><i data-icon="users"></i><span id="encounter-accept-label">结伴同行</span></button><button id="encounter-decline" class="text-button"><i data-icon="arrow-right"></i><span>继续独行</span></button></div></section>
        <div id="roster-players"></div>
      </div>
    </aside>
    <section id="chat-panel" class="chat-panel" aria-label="房间聊天" hidden>
      <div class="chat-heading"><strong>公路上的声音</strong><button id="chat-close" class="icon-button" aria-label="收起聊天"><i data-icon="x"></i></button></div>
      <ol id="chat-messages" aria-label="聊天消息" aria-live="polite" aria-relevant="additions" role="log"></ol>
      <form id="chat-form"><input id="chat-input" maxlength="200" placeholder="说点什么…" aria-label="聊天内容" autocomplete="off"><button type="submit" class="icon-button" aria-label="发送消息"><i data-icon="send"></i></button></form>
      <span id="chat-error" role="status"></span>
    </section>
    <aside id="rescue-status" class="rescue-status" hidden><strong id="rescue-title"></strong><span id="rescue-detail"></span><select id="rescue-target" aria-label="邀请搭车的旅人" hidden></select><div id="rescue-actions"><button id="rescue-action" class="text-button"><i data-icon="user-plus"></i><span id="rescue-action-label"></span></button></div></aside>
    <div id="toast" class="toast" role="status" hidden></div>
    <div class="touch-controls" id="touch-controls" hidden aria-label="驾驶控制">
      <div class="touch-steering"><button data-control="left" aria-label="向左转向"><i data-icon="arrow-left"></i></button><button data-control="right" aria-label="向右转向"><i data-icon="arrow-right"></i></button></div>
      <div class="touch-pedals"><button data-control="horn" aria-label="鸣笛"><i data-icon="megaphone"></i></button><button id="boost-touch" data-control="boost" aria-label="喷气加速"><i data-icon="rocket"></i></button><button data-control="brake" aria-label="刹车"><i data-icon="octagon-pause"></i></button><button class="throttle" data-control="throttle" aria-label="油门"><i data-icon="chevrons-up"></i></button></div>
    </div>

    <dialog id="panel" aria-labelledby="panel-title">
      <div class="panel-top"><span id="panel-kicker">DESERT HIGHWAY</span><button id="close-panel" class="icon-button" aria-label="关闭"><i data-icon="x"></i></button></div>
      <h2 id="panel-title"></h2>
      <div id="panel-body"></div>
      <div id="panel-actions" class="panel-actions"></div>
    </dialog>
    <section id="fatal" class="fatal" role="alert" hidden><h2>无法启动驾驶场景</h2><p id="fatal-message"></p><button class="primary" onclick="location.reload()">重新打开</button></section>
    <noscript><section class="fatal"><h2>浏览器已禁用 JavaScript</h2><p>请在启用 JavaScript 的 Chrome 或 Edge 中打开此文件。</p></section></noscript>
