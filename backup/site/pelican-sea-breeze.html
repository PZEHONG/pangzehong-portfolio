<script>
(()=>{
'use strict';
const ids=['rear-spokes','front-spokes','far-leg-outline','far-leg','far-crank','far-foot','near-leg-outline','near-leg','near-crank','near-foot','crank-highlight','knee-highlight','pelican-body','eye','tail','riding-wing','wing-tips','wing-lines','scarf-upper','scarf-lower','water','road','fence','foreground','cloud-a','cloud-b','cloud-c','gull-a','gull-b','sailboat','wind-lines','rider-shadow'];

const toggle=document.getElementById('toggle'),label=document.getElementById('toggle-text'),icon=document.getElementById('control-icon'),speedInput=document.getElementById('speed'),speedValue=document.getElementById('speed-value');
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
let paused=reduce.matches,rate=1,time=0,last=null,frame=null;
const tau=Math.PI*2;
const n=v=>v.toFixed(3);
function joint(hx,hy,ax,ay,a,b){
 const dx=ax-hx,dy=ay-hy,d=Math.hypot(dx,dy),q=Math.min(d,a+b-.001),along=(a*a-b*b+q*q)/(2*q),height=Math.sqrt(Math.max(0,a*a-along*along));
 return {x:hx+dx/d*along+dy/d*height,y:hy+dy/d*along-dx/d*height};
}
function leg(which,angle,bob){
 const px=557+32*Math.cos(angle),py=480+32*Math.sin(angle),ax=px-4,ay=py-8;
 const hx=which==='near'?520:544,hy=(which==='near'?340:336)+bob;
 const k=joint(hx,hy,ax,ay,91,91);
 const d=`M${hx} ${n(hy)}L${n(k.x)} ${n(k.y)}L${n(ax)} ${n(ay)}`;
 el[which+'-leg'].setAttribute('d',d);el[which+'-leg-outline'].setAttribute('d',d);
 el[which+'-crank'].setAttribute('d',`M557 480L${n(px)} ${n(py)}`);
 el[which+'-foot'].setAttribute('transform',`translate(${n(ax)} ${n(ay)})`);
 if(which==='near'){
  el['crank-highlight'].setAttribute('d',`M557 480L${n(px)} ${n(py)}`);
  el['knee-highlight'].setAttribute('d',`M${n(k.x-.8)} ${n(k.y-1)}l1 3`);
 }
}
function render(t){
 const angle=t*2.45-.32,bob=Math.sin(angle*2)*1.8,wheelDegrees=t*2.45*1.15*180/Math.PI;
 el['rear-spokes'].setAttribute('transform',`rotate(${n(wheelDegrees)})`);
 el['front-spokes'].setAttribute('transform',`rotate(${n(wheelDegrees)})`);
 leg('far',angle+Math.PI,bob);leg('near',angle,bob);
 el['pelican-body'].setAttribute('transform',`translate(0 ${n(bob)})`);
 el.tail.setAttribute('transform',`rotate(${n(Math.sin(t*3)*1.5)} 444 299)`);
 const blink=t%5.6,eyeScale=blink>4.9&&blink<5.08?.12:1;
 el.eye.setAttribute('transform',`translate(659 154) scale(1 ${eyeScale})`);
 const w=Math.sin(t*5)*3,v=Math.sin(t*5-1.4)*3;
 el['scarf-upper'].setAttribute('d',`M615 226C585 ${215+w} 559 ${222+v} 536 ${202+w}L544 ${224+v}L530 ${232+w}C557 ${241+v} 583 231 610 241Z`);
 el['scarf-lower'].setAttribute('d',`M607 232C585 ${238+v} 565 ${250+w} 541 ${244+v}L550 ${257+w}L541 ${264+v}C570 ${268+w} 589 249 615 246Z`);
 el['riding-wing'].setAttribute('d',`M479 ${278+bob}C508 ${260+bob} 538 ${277+bob} 560 ${296+bob}C595 ${317+bob} 644 320 702 309Q714 300 723 306L718 312Q734 310 733 316L722 320Q733 321 729 326C673 347 610 ${350+bob} 568 ${341+bob}C529 ${337+bob} 490 ${321+bob} 475 ${301+bob}Q468 ${287+bob} 479 ${278+bob}Z`);
 el['wing-tips'].setAttribute('d',`M565 ${312+bob}C607 ${333+bob} 663 326 702 316L704 331C654 347 602 ${347+bob} 568 ${336+bob}Z`);
 el['wing-lines'].setAttribute('d',`M492 ${287+bob}Q514 ${293+bob} 530 ${306+bob}M489 ${298+bob}Q511 ${311+bob} 530 ${315+bob}M498 ${312+bob}Q514 ${321+bob} 534 ${323+bob}M572 ${320+bob}Q625 338 687 323M581 ${331+bob}Q633 342 689 330`);
 el.water.setAttribute('transform',`translate(${-t*14%240} 0)`);
 el.road.setAttribute('transform',`translate(${-t*278.9325%140} 0)`);
 el.fence.setAttribute('transform',`translate(${-t*136%210} 0)`);
 el.foreground.setAttribute('transform',`translate(${-t*300%1200} 0)`);
 const cloud=(start,velocity,width)=>((start-t*velocity+width+((t*velocity/(1200+width)|0)+1)*(1200+width))%(1200+width))-width;
 el['cloud-a'].setAttribute('transform',`translate(${cloud(143,6,160)} 153) scale(1.05)`);
 el['cloud-b'].setAttribute('transform',`translate(${cloud(859,3,105)} 77) scale(.63)`);
 el['cloud-c'].setAttribute('transform',`translate(${cloud(1084,8,130)} 252) scale(.78)`);
 el['gull-a'].setAttribute('transform',`translate(${Math.sin(t*.3)*10} ${Math.sin(t*1.6)*3})`);
 el['gull-b'].setAttribute('transform',`translate(${Math.sin(t*.24)*7} ${Math.sin(t*1.5+1)*3})`);
 el.sailboat.setAttribute('transform',`translate(${980+Math.sin(t*.13)*18} ${405+Math.sin(t*1.1)*1.2})`);
 el['wind-lines'].setAttribute('transform',`translate(${-Math.sin(t*2)*6} 0)`);
 el['wind-lines'].setAttribute('opacity',.45+Math.sin(t*2)*.12);
 el['rider-shadow'].setAttribute('rx',253+Math.sin(angle*2)*1.5);
}
function loop(now){
 frame=null;
 if(paused||document.hidden){last=null;return;}
 if(last!==null)time+=(now-last)/1000*rate;
 last=now;render(time);frame=requestAnimationFrame(loop);
}
function sync(){
 document.body.classList.toggle('paused',paused);
 toggle.setAttribute('aria-label',paused?'继续动画':'暂停动画');
 label.textContent=paused?'继续兜风':'歇一会儿';
 icon.innerHTML=paused?'<path d="M4 2l10 6-10 6z"/>':'<path d="M3 2h3v12H3zm7 0h3v12h-3z"/>';
 if(frame!==null){cancelAnimationFrame(frame);frame=null;}last=null;
 if(!paused&&!document.hidden)frame=requestAnimationFrame(loop);
}
toggle.addEventListener('click',()=>{paused=!paused;sync();});
speedInput.addEventListener('input',()=>{rate=Number(speedInput.value);speedValue.textContent=rate+'×';speedInput.setAttribute('aria-valuetext',rate+' 倍速');});
document.addEventListener('keydown',event=>{if(event.code==='Space'&&!event.repeat&&!/INPUT|BUTTON|TEXTAREA|SELECT/.test(event.target.tagName)){event.preventDefault();paused=!paused;sync();}});
document.addEventListener('visibilitychange',sync);
reduce.addEventListener('change',event=>{if(event.matches){paused=true;sync();}});
render(0);sync();
})();
</script>
</body>
</html>
