  <div class="control-foot"><p id="helpText">按住加减速，松开保持巡航。<span class="desktop-hint">　<kbd>空格</kbd> 跳一下 · <kbd>P</kbd> 暂停</span></p><div class="small-actions"><button type="button" id="hornButton" class="text-button" title="H · 呱一声"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17c-6-16 20-16 16 0l-8 4Z"/><path d="M7 13h.1m10 0h.1M9 17q3 2 6 0"/></svg>呱一声</button><button type="button" id="resetButton" class="text-button" title="R · 重新开始"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2 7M3 4v7h7"/></svg>重来</button></div></div>
 </section>
 <footer class="footer"><span class="club">LILY LAKE CYCLING CLUB</span><span id="footerNote">不赶路，只感受路。</span></footer>
</main>
<script>
(() => {
 'use strict';
 const $ = id => document.getElementById(id), NS = 'http://www.w3.org/2000/svg';
 const clamp = (n,lo,hi) => Math.max(lo,Math.min(hi,n));
 const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
 const state = { mode:'free', running:!reducedMotion, over:false, speed:18, target:18, travel:0, distance:0, elapsed:0, wheel:0, pedal:0, jump:0, jumpVelocity:0, pitch:0, lean:0, leaves:0, lives:3, invulnerable:0, nextWave:620, wave:0, wheelieTap:0, best:0, sound:false, toastUntil:0, scene:'day' };

 const buttons = {accelerate:$('accelerateButton'),brake:$('brakeButton'),wheelie:$('wheelieButton')};

 const objects = [], particles = [];
 let last = null, hudTick = 0, audio = null;
 try { const saved = Number(localStorage.getItem('lily-ride-best-v1')); if (Number.isFinite(saved) && saved >= 0) state.best = Math.floor(saved); } catch (_) { /* File access can disable local storage; the ride remains fully playable. */ }
 function attr(node,name,value){ node.setAttribute(name,String(value)); }
 function saveBest(){ if(state.leaves>state.best){state.best=state.leaves;try{localStorage.setItem('lily-ride-best-v1',String(state.best));}catch(_){} } }
 function notify(message,duration=1.8){ parts.toast.textContent=message; parts.toast.classList.add('show'); state.toastUntil=performance.now()+duration*1000; }
 function setTarget(value){ state.target=clamp(value,0,48); const rounded=Math.round(state.target); $('speedRange').value=String(rounded); $('speedRange').style.setProperty('--fill',`${state.target/48*100}%`); $('targetSpeed').textContent=`${rounded} km/h`; }
 function makeSound(kind){
  if(!state.sound)return;
  try{
   const AudioConstructor=window.AudioContext||window.webkitAudioContext;
   if(!AudioConstructor)return;
   audio??=new AudioConstructor(); if(audio.state==='suspended')audio.resume().catch(()=>{});
   const now=audio.currentTime;
   const note=(offset,frequency,endFrequency,length,volume,type='sine')=>{const osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(frequency,now+offset);osc.frequency.exponentialRampToValueAtTime(endFrequency,now+offset+length);gain.gain.setValueAtTime(0,now+offset);gain.gain.linearRampToValueAtTime(volume,now+offset+.015);gain.gain.exponentialRampToValueAtTime(.001,now+offset+length);osc.connect(gain);gain.connect(audio.destination);osc.start(now+offset);osc.stop(now+offset+length+.025);osc.onended=()=>{osc.disconnect();gain.disconnect();};};
   if(kind==='horn'){note(0,250,105,.15,.12,'triangle');note(.16,230,95,.23,.12,'triangle');}
   if(kind==='jump')note(0,220,590,.18,.055);
   if(kind==='leaf'){note(0,660,800,.13,.06);note(.075,990,1050,.15,.045);}
   if(kind==='hit')note(0,100,45,.2,.075,'triangle');
  }catch(_){state.sound=false;updateSound();}
 }
 function updateSound(){ $('soundButton').setAttribute('aria-pressed',String(state.sound));$('soundButton').setAttribute('aria-label',state.sound?'关闭音效':'开启音效');$('soundButton').title=state.sound?'关闭音效':'开启音效';attr($('soundWaves'),'d',state.sound?'M16 8q4 4 0 8m3-11q7 7 0 14':'m16 9 6 6m0-6-6 6'); }
 function clearHeld(){ heldKeys.clear();heldPointers.clear();Object.values(buttons).forEach(b=>b.classList.remove('is-held')); }
 function updatePause(){ $('pauseLabel').textContent=state.running?'暂停':'继续';$('pauseButton').setAttribute('aria-label',state.running?'暂停骑行':'继续骑行');attr($('pauseIcon'),'d',state.running?'M7 4v12M13 4v12':'M6 3 16 10 6 17Z');$('pausedPill').hidden=state.running||state.over;$('pauseButton').disabled=state.over; }
 function togglePause(){ if(state.over)return;state.running=!state.running;clearHeld();last=null;updatePause(); }
 function jump(){ if(!state.running||state.over||state.jump>.1)return;state.jumpVelocity=525;state.jump=.01;makeSound('jump'); }
 function horn(){ notify('呱！借过一下～',1.15);makeSound('horn'); }
 function selectScene(scene){ state.scene=scene;document.body.dataset.scene=scene;document.querySelectorAll('button[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));$('sceneNote').textContent={day:'今天的目的地，是好心情。',sunset:'把一天的烦恼，留在身后。',night:'月亮亮着，车灯也亮着。'}[scene]; }
 function reset(){
  saveBest();Object.assign(state,{running:!reducedMotion,over:false,speed:18,travel:0,distance:0,elapsed:0,wheel:0,pedal:0,jump:0,jumpVelocity:0,pitch:0,lean:0,leaves:0,lives:3,invulnerable:0,nextWave:620,wave:0,wheelieTap:0});
  clearHeld();setTarget(18);for(const o of objects)o.node.remove();objects.length=0;for(const p of particles)p.node.remove();particles.length=0;
  $('endScreen').hidden=true;parts.toast.classList.remove('show');state.toastUntil=0;last=null;
  $('leafStat').hidden=state.mode!=='challenge';document.body.dataset.mode=state.mode;
  $('footerNote').textContent=state.mode==='challenge'?`本地最佳：${state.best} 枚荷叶`:'不赶路，只感受路。';
  $('helpText').innerHTML=state.mode==='challenge'?'收集荷叶，跳过路障；碰撞消耗一颗心。':'按住加减速，松开保持巡航。<span class="desktop-hint">　<kbd>空格</kbd> 跳一下 · <kbd>P</kbd> 暂停</span>';
  $('rideCaption').textContent=state.mode==='challenge'?'看准路障，跳一下。':'慢慢来，也很快活。';
  updatePause();updateHud();render(0);
 }
 function selectMode(mode){ if(state.mode===mode)return;state.mode=mode;document.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));reset();notify(mode==='challenge'?'荷叶挑战 · 空格跳过路障':'自由骑行 · 想多慢，就多慢',2.4); }
 function endRide(){ saveBest();state.over=true;state.running=false;clearHeld();updateHud();$('endSummary').innerHTML=`这一圈骑了 <strong>${Math.floor(state.distance)} 米</strong>，<br>收集了 <strong>${state.leaves} 枚荷叶</strong>。本地最佳 ${state.best} 枚。`;$('endScreen').hidden=false;parts.toast.classList.remove('show');state.toastUntil=0;updatePause();$('footerNote').textContent=`本地最佳：${state.best} 枚荷叶`;$('againButton').focus({preventScroll:true}); }
 function addObject(kind,x,height){const node=document.createElementNS(NS,'use');attr(node,'href',kind==='leaf'?'#leafToken':'#coneArt');$('objectsLayer').appendChild(node);objects.push({kind,x,height,node,done:false,warned:false});}
 function spawn(){
  while(state.nextWave<state.travel+1500){
   const x=state.nextWave;
   addObject('leaf',x,177);addObject('leaf',x+112,190);
   addObject('cone',x+490,0);addObject('leaf',x+395,265);addObject('leaf',x+515,273);addObject('leaf',x+640,230);
   state.nextWave+=1080;state.wave++;
  }
 }
 function burst(x,y,kind){for(let i=0;i<7;i++){const node=document.createElementNS(NS,'circle');attr(node,'r',kind==='leaf'?3.5:4.5);attr(node,'fill',kind==='leaf'?(i%2?'#edcf83':'#b9ce89'):'#e3c99b');$('particlesLayer').appendChild(node);const a=i/7*Math.PI*2;particles.push({node,x,y,vx:Math.cos(a)*85,vy:Math.sin(a)*70-50,life:.65,max:.65});}}
 function updateObjects(dt){
  spawn();
  for(let i=objects.length-1;i>=0;i--){const o=objects[i],x=570+o.x-state.travel,y=600-o.height;
   if(o.kind==='leaf'){
    const float=Math.sin(state.elapsed*2.7+o.x*.015)*5;
    attr(o.node,'transform',`translate(${x.toFixed(2)} ${(y+float).toFixed(2)})`);
    if(!o.done&&Math.abs(x-596)<67&&Math.abs(o.height-(165+state.jump))<74){o.done=true;state.leaves++;burst(x,y,'leaf');makeSound('leaf');o.node.remove();objects.splice(i,1);continue;}
   }else{
    attr(o.node,'transform',`translate(${x.toFixed(2)} 601)`);
    if(!o.warned&&x>720&&x<1020){o.warned=true;notify('前方路障 · 空格 / 点击跳跃',1.5);}
    if(!o.done&&x<753&&x>701&&state.jump<59){o.done=true;if(state.invulnerable<=0){state.lives--;state.speed*=.48;state.invulnerable=2.2;burst(715,582,'hit');makeSound('hit');notify(state.lives?'哎呀！下个路障跳过去。':'这一圈结束，歇一歇吧。');if(state.lives<=0){endRide();break;}}}
   }
   if(x<-130){o.node.remove();objects.splice(i,1);}
  }
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){p.node.remove();particles.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=170*dt;attr(p.node,'cx',p.x.toFixed(2));attr(p.node,'cy',p.y.toFixed(2));attr(p.node,'opacity',p.life/p.max);}
 }
 function joint(hip,foot,upper,lower){
  const dx=foot[0]-hip[0],dy=foot[1]-hip[1],distance=Math.max(.01,Math.hypot(dx,dy)),d=Math.min(distance,upper+lower-.01);
  const a=(upper*upper-lower*lower+d*d)/(2*d),h=Math.sqrt(Math.max(0,upper*upper-a*a));
  return [hip[0]+dx/distance*a+dy/distance*h,hip[1]+dy/distance*a-dx/distance*h];
 }
 function rotatePoint(x,y,degrees,cx,cy){const a=degrees*Math.PI/180;return[cx+(x-cx)*Math.cos(a)-(y-cy)*Math.sin(a),cy+(x-cx)*Math.sin(a)+(y-cy)*Math.cos(a)];}
 function render(dt){
  const t=state.elapsed,travel=state.travel,speed=state.speed;
  const airborne=state.jump>0;
  const wheelie=state.running&&(actionHeld('wheelie')||state.wheelieTap>0)&&speed>1&&!airborne;
  const targetPitch=airborne?-9*Math.sin(Math.min(1,state.jump/125)*Math.PI*.65):wheelie?-25:0;
  state.pitch+=(targetPitch-state.pitch)*Math.min(1,dt*10);
  const targetLean=(state.target-speed)*.38+speed*.08;
  state.lean+=(targetLean-state.lean)*Math.min(1,dt*7);
  const bob=state.running?Math.sin(state.pedal*2)*Math.min(1.4,speed*.06):0;
  attr(parts.bikeRig,'transform',`translate(570 ${(600-state.jump+bob).toFixed(2)}) rotate(${state.pitch.toFixed(2)} -104 -66)`);
  attr(parts.bikeRig,'opacity',state.invulnerable>0&&Math.floor(t*8)%2===0?.58:1);
  attr(parts.rearWheel,'transform',`rotate(${state.wheel.toFixed(2)})`);attr(parts.frontWheel,'transform',`rotate(${state.wheel.toFixed(2)})`);
  attr(parts.crank,'transform',`translate(-1 -81) rotate(${(state.pedal*180/Math.PI).toFixed(2)})`);
  for(const side of ['near','far']){const angle=state.pedal+(side==='far'?Math.PI:0),foot=[-1+Math.cos(angle)*27,-81+Math.sin(angle)*27],hip=[side==='near'?-35:-43,-181],knee=joint(hip,foot,71,78),path=`M${hip[0]} ${hip[1]}L${knee[0].toFixed(2)} ${knee[1].toFixed(2)}L${foot[0].toFixed(2)} ${foot[1].toFixed(2)}`;attr(parts[side+'Leg'],'d',path);attr(parts[side+'LegOutline'],'d',path);attr(parts[side+'Foot'],'transform',`translate(${foot[0].toFixed(2)} ${foot[1].toFixed(2)})`);}
  const lean=clamp(state.lean,-8,10);attr(parts.frogTorso,'transform',`rotate(${lean.toFixed(2)} -35 -181)`);
  const shoulder=rotatePoint(10,-263,lean,-35,-181),elbow=[65+lean*.8,-211],arm=`M${shoulder[0].toFixed(2)} ${shoulder[1].toFixed(2)}Q${elbow[0].toFixed(2)} ${elbow[1]} 131 -223`;
  attr(parts.arm,'d',arm);attr(parts.armOutline,'d',arm);attr(parts.sleeve,'d',`M${shoulder[0].toFixed(2)} ${shoulder[1].toFixed(2)}L${(shoulder[0]+11).toFixed(2)} ${(shoulder[1]+17).toFixed(2)}`);
  const flap=Math.sin(t*(4+speed*.1))*Math.min(11,speed*.35);attr(parts.scarfTail,'d',`M-4-290Q-47 ${-303+flap}-91 ${-284+flap}l-20-12 10 24q48-6 98-5Z`);
  const blink=t%5.1>4.84&&t%5.1<5;attr(parts.frogEyes,'opacity',blink?0:1);attr(parts.blinkEyes,'opacity',blink?1:0);
  attr(parts.townLayer,'transform',`translate(${-travel*.32%2000} 0)`);attr(parts.roadLayer,'transform',`translate(${-travel%2160} 0)`);
  attr(parts.waterLayer,'transform',`translate(${-travel*.17%1440} 0)`);attr(parts.railLayer,'transform',`translate(${-travel*.72%1440} 0)`);
  attr(parts.hillsLayer,'transform',`translate(${-travel*.04%1400} 0)`);attr(parts.cloudLayer,'transform',`translate(${-travel*.025%1800} 0)`);
  attr(parts.liliesLayer,'transform',`translate(${-travel*.4%1440} 0)`);attr(parts.lampsLayer,'transform',`translate(${-travel*.72%1400} 0)`);
  attr(parts.foreground,'transform',`translate(${-travel*1.17%1440} 0)`);
  attr(parts.bikeShadow,'rx',165-state.jump*.45);attr(parts.bikeShadow,'opacity',.18-state.jump*.0008);
  attr(parts.speedLines,'opacity',reducedMotion?0:clamp((speed-29)/35,0,.48));
 }
 function updateHud(){parts.speedValue.textContent=String(Math.round(state.speed)).padStart(2,'0');parts.distanceValue.textContent=String(Math.floor(state.distance)).padStart(4,'0');parts.leavesValue.textContent=String(state.leaves).padStart(2,'0');parts.speedTone.textContent=state.speed<.5?'停下来，听听风':state.speed<12?'慢悠悠':state.speed<28?'悠闲巡航':state.speed<40?'迎风飞驰':'风一样的青蛙';$('lives').textContent='♥ '.repeat(Math.max(0,state.lives))+'♡ '.repeat(3-Math.max(0,state.lives));$('lives').setAttribute('aria-label',`剩余 ${Math.max(0,state.lives)} 次机会`);}
 const keyActions={KeyW:'accelerate',ArrowUp:'accelerate',KeyS:'brake',ArrowDown:'brake',KeyA:'wheelie',ArrowLeft:'wheelie'};
 function actionHeld(action){return [...heldKeys].some(key=>keyActions[key]===action)||[...heldPointers.values()].includes(action);}
 function updateHeld(){for(const [action,button]of Object.entries(buttons))button.classList.toggle('is-held',actionHeld(action));}
 function animate(ms){
  const dt=last===null?0:Math.min(.04,(ms-last)/1000);last=ms;
  if(state.running&&!state.over){
   const acceleration=actionHeld('accelerate'),braking=actionHeld('brake');
   if(acceleration&&!braking)setTarget(state.target+13*dt);if(braking)setTarget(state.target-23*dt);
   const change=state.target-state.speed,maxStep=(change<0?25:13)*dt;state.speed+=clamp(change,-maxStep,maxStep);if(state.speed<.02&&state.target===0)state.speed=0;
   const motion=state.speed*5*dt;state.travel+=motion;state.distance+=state.speed/3.6*dt;state.elapsed+=dt;state.wheel=(state.wheel+motion/66*180/Math.PI)%360;
   if(state.jump===0&&!braking)state.pedal=(state.pedal+state.speed*.18*dt)%(Math.PI*2);
   state.wheelieTap=Math.max(0,state.wheelieTap-dt);state.invulnerable=Math.max(0,state.invulnerable-dt);
   if(state.jump>0||state.jumpVelocity>0){state.jumpVelocity-=1120*dt;state.jump+=state.jumpVelocity*dt;if(state.jump<0){state.jump=0;state.jumpVelocity=0;}}
   if(state.mode==='challenge')updateObjects(dt);
   render(dt);
  }
  if(state.toastUntil&&ms>state.toastUntil){parts.toast.classList.remove('show');state.toastUntil=0;}
  hudTick+=dt;if(hudTick>.08){updateHud();hudTick=0;}
  requestAnimationFrame(animate);
 }
 function onKeyDown(e){
  if(e.ctrlKey||e.metaKey||e.altKey||e.target.isContentEditable||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.code==='Space'&&e.target.closest('button'))return;
  if(keyActions[e.code]){e.preventDefault();if(!state.running||state.over)return;heldKeys.add(e.code);updateHeld();return;}
  if(!['Space','KeyP','KeyH','KeyR','Escape'].includes(e.code))return;e.preventDefault();if(e.repeat)return;
  if(e.code==='Space')jump();if(e.code==='KeyP')togglePause();if(e.code==='KeyH')horn();if(e.code==='KeyR')reset();if(e.code==='Escape'&&state.running)togglePause();
 }
 document.addEventListener('keydown',onKeyDown);
 document.addEventListener('keyup',e=>{if(keyActions[e.code]){heldKeys.delete(e.code);updateHeld();}});
 window.addEventListener('blur',clearHeld);
 document.addEventListener('visibilitychange',()=>{clearHeld();last=null;if(document.hidden&&state.running){state.running=false;updatePause();}});
 for(const [action,button]of Object.entries(buttons)){
  button.addEventListener('pointerdown',e=>{if(e.button!==0||!state.running||state.over)return;e.preventDefault();button.setPointerCapture(e.pointerId);heldPointers.set(e.pointerId,action);if(action==='accelerate')setTarget(state.target+2);if(action==='brake')setTarget(state.target-2);updateHeld();});
  const release=e=>{heldPointers.delete(e.pointerId);updateHeld();};button.addEventListener('pointerup',release);button.addEventListener('pointercancel',release);button.addEventListener('lostpointercapture',release);
  button.addEventListener('click',e=>{if(e.detail!==0||!state.running||state.over)return;if(action==='accelerate')setTarget(state.target+4);else if(action==='brake')setTarget(state.target-4);else state.wheelieTap=1.2;});
 }
 $('jumpButton').addEventListener('click',jump);$('hornButton').addEventListener('click',horn);$('pauseButton').addEventListener('click',togglePause);$('resetButton').addEventListener('click',reset);$('againButton').addEventListener('click',()=>{reset();$('stage').focus({preventScroll:true});});
 $('speedRange').addEventListener('input',e=>setTarget(Number(e.target.value)));
 $('soundButton').addEventListener('click',()=>{state.sound=!state.sound;updateSound();if(state.sound)makeSound('horn');});
 document.querySelectorAll('button[data-mode]').forEach(b=>b.addEventListener('click',()=>selectMode(b.dataset.mode)));
 document.querySelectorAll('button[data-scene]').forEach(b=>b.addEventListener('click',()=>selectScene(b.dataset.scene)));
 function fitScene(){const box=$('stage').getBoundingClientRect(),worldHeight=700,worldWidth=worldHeight*box.width/box.height,left=worldWidth<1100?570-worldWidth*.47:(1440-worldWidth)/2;attr($('world'),'viewBox',`${left.toFixed(2)} 0 ${worldWidth.toFixed(2)} ${worldHeight}`);}
 new ResizeObserver(fitScene).observe($('stage'));
 updateSound();setTarget(18);updatePause();updateHud();fitScene();render(0);requestAnimationFrame(animate);
})();
