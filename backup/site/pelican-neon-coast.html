<title>鹈鹕骑自行车 · 霓虹海岸赛博朋克动画</title>
<style>
  * { box-sizing: border-box; }
  html { background: #060713; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: clamp(12px, 3vw, 42px);
    color: #d9faff;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  main {
    width: min(1200px, 100%);
    overflow: hidden;
    border-radius: 8px;
    background: #090b18;
    box-shadow: 0 22px 65px #0000008c, 0 2px 8px #00000040;
  }
  svg { display: block; width: 100%; height: auto; }
  .cyber-status { padding: 10px 6% 0; color: #79faff; font: 600 11px "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 2.5px; text-align: right; }
  .status-dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: #ff3cac; box-shadow: 0 0 11px #ff3cac; animation: statusPulse 1.1s ease-in-out infinite alternate; }
  main.paused .status-dot { animation-play-state: paused; opacity: .45; }
  @keyframes statusPulse { from { opacity: .35; transform: scale(.8); } to { opacity: 1; transform: scale(1.15); } }
  .playback-controls { display: flex; justify-content: flex-end; padding: 0 6% 20px; }
  .playback-toggle {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px;
    border: 1px solid #1cddff; border-radius: 999px; background: #11183b;
    color: #8cffff; box-shadow: 0 0 13px #1cddff55; font: 600 13px "Segoe UI", "Microsoft YaHei", sans-serif; cursor: pointer;
  }
  .playback-toggle:hover { background: #201554; box-shadow: 0 0 20px #ff39b877; }
  .playback-toggle:focus-visible { outline: 3px solid #ff39b8; outline-offset: 3px; }
  .playback-icon { width: 12px; height: 12px; border-left: 4px solid currentColor; border-right: 4px solid currentColor; }
  .playback-toggle[aria-pressed="true"] .playback-icon {
    border: 0; background: currentColor; clip-path: polygon(15% 0, 100% 50%, 15% 100%);
  }
  @media (max-width: 600px) {
    body { padding: 8px; }
    main { border-radius: 4px; }
  }
  @media print {
    html, body { background: white; padding: 0; }
    main { width: 100%; box-shadow: none; }
    .playback-controls { display: none; }
  }
</style>

<script>
(() => {
  const scene = document.querySelector('main > svg');
  const toggle = document.getElementById('toggle-animation');
  const label = document.getElementById('playback-label');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let userPaused = reducedMotion.matches;
  function updatePlayback() {
    const paused = userPaused || document.hidden;
    if (paused) scene.pauseAnimations();
    else scene.unpauseAnimations();
    document.querySelector('main').classList.toggle('paused', paused);
    toggle.setAttribute('aria-pressed', String(userPaused));
    toggle.setAttribute('aria-label', userPaused ? '播放骑行动画' : '暂停骑行动画');
    label.textContent = userPaused ? '播放动画' : '暂停动画';
  }
  toggle.addEventListener('click', () => {
    userPaused = !userPaused;
    updatePlayback();
  });
  reducedMotion.addEventListener('change', event => {
    userPaused = event.matches;
    updatePlayback();
  });
  document.addEventListener('visibilitychange', updatePlayback);
  updatePlayback();
})();
</script>
