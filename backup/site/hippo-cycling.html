  <g id="butterfly" transform="translate(1028 326)">
    <g id="butterfly-wings"><path d="M0 0C-28-28-39-10-24 5C-39 18-16 29 0 4" fill="#e79a79" stroke="#aa725c" stroke-width="1.5"/><path d="M1 0C26-24 36-5 21 6C36 23 13 27 1 4" fill="#f3c078" stroke="#aa725c" stroke-width="1.5"/></g>
    <path d="M0-3v14m0-12-4-5m4 5 4-5" class="fine" stroke="#736458" stroke-width="2"/>
  </g>
  <g id="front-grass" color="#78966d" opacity=".9">
    <use href="#grass" transform="translate(168 855) scale(1.7)"/>
    <use href="#grass" transform="translate(1110 861) scale(1.5)"/>
  </g>
</svg>
</main>
<script>
(() => {
  'use strict';
  const ids = ['scene', 'rear-spokes', 'front-spokes', 'crank-arms', 'hippo-body', 'clouds', 'hills', 'trees', 'meadow', 'near-leg-outline', 'near-leg-fill', 'near-leg-shine', 'near-foot', 'near-pedal', 'far-leg-outline', 'far-leg-fill', 'far-foot', 'far-pedal', 'arm-outline', 'arm-fill', 'arm-shine', 'bouquet', 'butterfly', 'butterfly-wings', 'scarf-tail-back', 'scarf-tail-front', 'breeze', 'ground-shadow'];
  const el = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
  const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
  const narrowScreen = window.matchMedia('(max-width: 640px)');
  const TAU = Math.PI * 2;
  const cycleSeconds = 2.1;
  let elapsed = 0;
  let previous = 0;
  let frame = null;

  function set(id, attribute, value) { el[id].setAttribute(attribute, value); }
  function number(value) { return value.toFixed(2); }
  function point(x, y) { return `${number(x)} ${number(y)}`; }

  // Two equal leg segments place the knee forward of the hip and ankle.
  // The ankle is tied to the crank, so the feet stay on their own pedals.
  function leg(side, angle, bob) {
    const near = side === 'near';
    const hx = near ? 591 : 573;
    const hy = (near ? 470 : 476) + bob;
    const px = 624 + 44 * Math.cos(angle);
    const py = 622 + 44 * Math.sin(angle);
    const ax = px - 5;
    const ay = py - 15;
    const dx = ax - hx;
    const dy = ay - hy;
    const distance = Math.hypot(dx, dy);
    const length = near ? 110 : 107;
    const bend = Math.sqrt(Math.max(0, length * length - distance * distance / 4));
    const kx = (hx + ax) / 2 + (dy / distance) * bend;
    const ky = (hy + ay) / 2 - (dx / distance) * bend;
    const beforeX = hx + (kx - hx) * .78;
    const beforeY = hy + (ky - hy) * .78;
    const afterX = kx + (ax - kx) * .22;
    const afterY = ky + (ay - ky) * .22;
    const path = `M${point(hx, hy)} L${point(beforeX, beforeY)} Q${point(kx, ky)} ${point(afterX, afterY)} L${point(ax, ay)}`;
    set(`${side}-leg-outline`, 'd', path);
    set(`${side}-leg-fill`, 'd', path);
    set(`${side}-foot`, 'transform', `translate(${point(px, py - 12)})`);
    set(`${side}-pedal`, 'd', `M${point(px - 20, py)}h40`);
    if (near) {
      set('near-leg-shine', 'd', `M${point(hx + 8, hy - 8)}L${point(beforeX + 3, beforeY - 8)}Q${point(kx + 2, ky - 8)} ${point(afterX + 4, afterY - 6)}`);
    }
  }

  function draw(seconds) {
    const a = seconds / cycleSeconds * TAU - .65;
    const bob = Math.sin(a * 2) * 2.1;
    const degrees = a * 180 / Math.PI;
    // The 2.4:1 gear ratio also sets the scenery's ground speed.
    const wheelDegrees = seconds / cycleSeconds * 360 * 2.4;
    const groundSpeed = TAU * 114 * 2.4 / cycleSeconds;
    set('rear-spokes', 'transform', `rotate(${number(wheelDegrees)})`);
    set('front-spokes', 'transform', `rotate(${number(wheelDegrees)})`);
    set('crank-arms', 'transform', `translate(624 622) rotate(${number(degrees)})`);
    set('hippo-body', 'transform', `translate(0 ${number(bob)})`);
    leg('far', a + Math.PI, bob);
    leg('near', a, bob);
    const arm = `M650 ${number(376 + bob)}Q687 ${number(431 + bob * .5)} 774 423`;
    set('arm-outline', 'd', arm);
    set('arm-fill', 'd', arm);
    set('arm-shine', 'd', `M654 ${number(370 + bob)}Q684 ${number(411 + bob * .5)} 719 414`);
    set('clouds', 'transform', `translate(${number(-(seconds * 7 % 1400))} 0)`);
    set('hills', 'transform', `translate(${number(-(seconds * 14 % 1280))} 0)`);
    set('trees', 'transform', `translate(${number(-(seconds * 31 % 1280))} 0)`);
    set('meadow', 'transform', `translate(${number(-(seconds * groundSpeed % 1280))} 0)`);
    set('bouquet', 'transform', `rotate(${number(Math.sin(a * 2 - .5) * 2.3)} 883 452)`);
    const flutter = Math.sin(seconds * 5.6) * 5;
    set('scarf-tail-back', 'd', `M630 343Q589 ${number(326 + flutter)} 550 ${number(337 + flutter)}Q521 ${number(345 + flutter)} 496 ${number(325 + flutter)}L488 ${number(345 + flutter)}Q516 ${number(365 + flutter)} 550 ${number(354 + flutter)}Q593 341 627 358Z`);
    set('scarf-tail-front', 'd', `M628 348Q588 ${number(335 - flutter)} 557 ${number(363 - flutter)}Q539 ${number(376 - flutter)} 517 ${number(368 - flutter)}L521 ${number(390 - flutter)}Q550 ${number(392 - flutter)} 569 ${number(376 - flutter)}Q596 353 631 364Z`);
    set('butterfly', 'transform', `translate(${number(1032 + Math.sin(seconds * .68) * 40)} ${number(332 + Math.sin(seconds * 1.4) * 23)}) rotate(${number(Math.sin(seconds * 1.4) * 12)})`);
    set('butterfly-wings', 'transform', `scale(${number(.32 + .68 * Math.abs(Math.cos(seconds * 8)))} 1)`);
    set('breeze', 'opacity', number(.55 + Math.sin(seconds * 3) * .2));
    set('ground-shadow', 'rx', number(302 - bob * 1.2));
  }

  function tick(time) {
    frame = null;
    if (motionPreference.matches || document.hidden) { previous = 0; return; }
    if (previous) elapsed += Math.min((time - previous) / 1000, .05);
    previous = time;
    draw(elapsed);
    frame = requestAnimationFrame(tick);
  }

  function refreshMotion() {
    if (frame !== null) cancelAnimationFrame(frame);
    frame = null;
    previous = 0;
    if (!motionPreference.matches && !document.hidden) frame = requestAnimationFrame(tick);
    else draw(elapsed);
  }

  function resize() {
    set('scene', 'viewBox', narrowScreen.matches ? '245 125 790 710' : '0 0 1280 860');
  }

  motionPreference.addEventListener('change', refreshMotion);
  narrowScreen.addEventListener('change', resize);
  document.addEventListener('visibilitychange', refreshMotion);
  resize();
  draw(0);
  refreshMotion();
  // Read-only readiness information for browser verification.
  Object.defineProperty(window, '__hippoAnimation', { value: Object.freeze({
    ready: true,
    get elapsed() { return elapsed; },
    get reducedMotion() { return motionPreference.matches; },
    get running() { return frame !== null; },
    cycleSeconds
  }), writable: false });
})();
</script>
</body>
</html>
