<!doctype html>
<html lang="zh-CN">
<head>

  <title>城市脉搏 / METRO 24</title>
  <style>
    :root { --ink:#242a2a; --muted:#727c7b; --rule:#e2e7e5; --red:#e65a50; --teal:#168b85; --yellow:#ddb330; --paper:#fff; --number:"Bahnschrift SemiCondensed","Bahnschrift","Arial Narrow",sans-serif; }
    * { box-sizing:border-box; letter-spacing:0; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:"Segoe UI","Microsoft YaHei",sans-serif; font-size:13px; }
    button,input,a { -webkit-tap-highlight-color:transparent; }

    .shell { max-width:1360px; margin:0 auto; padding:0 40px; }

    .map { display:block; width:100%; height:100%; overflow:visible; }
    .route { fill:none; stroke-width:8; stroke-linecap:round; stroke-linejoin:round; }

    .route-teal { stroke:var(--teal); }
    .route-yellow { stroke:var(--yellow); }

    .station-sub { font:11px var(--number); fill:#697572; paint-order:stroke; stroke:#fbfcfb; stroke-width:4px; }
    .station-value { fill:var(--teal); font:15px var(--number); paint-order:stroke; stroke:#fbfcfb; stroke-width:5px; }
    .line-end { font:600 12px var(--number); fill:white; text-anchor:middle; dominant-baseline:central; }
    .flow-node { opacity:.23; }
    .station-core { fill:#fff; stroke:var(--ink); stroke-width:2.5; }
    .selected-ring { fill:none; stroke:var(--ink); stroke-width:1.7; stroke-dasharray:3 4; }

    .timeline { border-top:1px solid var(--rule); padding:21px 0 17px; display:grid; grid-template-columns:140px minmax(0,1fr); align-items:center; gap:20px; }
    .clock { display:flex; align-items:baseline; gap:2px; font-family:var(--number); }

    .playback { display:flex; align-items:center; gap:4px; }

    #play { background:var(--ink); color:white; border-color:var(--ink); }
    #hour { width:100%; margin:0; display:block; height:26px; cursor:pointer; accent-color:var(--teal); }
    .ticks { display:flex; justify-content:space-between; color:var(--muted); font:10px var(--number); margin-top:3px; }
    .sidebar { border-left:1px solid var(--rule); padding-left:25px; min-width:0; }
    .total-label { display:flex; align-items:center; justify-content:space-between; padding-top:9px; font-size:11px; }
    .total-line { display:flex; align-items:baseline; gap:8px; padding:11px 0 17px; border-bottom:1px solid var(--rule); }
    #total { font:500 49px/1 var(--number); font-variant-numeric:tabular-nums; }
    .unit { font-size:10px; color:var(--muted); }
    .rank-head { display:flex; justify-content:space-between; align-items:baseline; margin:19px 0 11px; }
    .rank-head h2 { font-size:12px; }
    #ranking { list-style:none; padding:0; margin:0; }
    .rank-button { width:100%; height:34px; padding:0 5px; display:grid; grid-template-columns:17px 8px minmax(0,1fr) 57px; align-items:center; gap:7px; border:0; background:transparent; position:relative; text-align:left; border-radius:3px; }
    .rank-button:hover { background:#f5f7f5; }

    .station-detail { border-top:1px solid var(--rule); margin-top:18px; padding-top:17px; }

    .detail-current { display:flex; align-items:baseline; justify-content:space-between; margin:12px 0 3px; }
    #selected-value { font:27px var(--number); }
    #station-chart { display:block; width:100%; aspect-ratio:258/145; overflow:visible; }
    .chart-grid { stroke:#e4e9e6; stroke-width:1; }
    .chart-label { fill:#77827b; font:10px var(--number); }
    #curve { fill:none; stroke:var(--teal); stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round; }
    #curve-area { fill:#168b850c; }

    #curve-dot { fill:var(--teal); stroke:white; stroke-width:2; }

    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (min-width:701px) {

      .map-key { padding:10px 0; }

    @media (max-width:700px) {

      .workspace { display:block; padding-top:13px; } .section-head { min-height:39px; } h2 { font-size:12px; } .subtle { font-size:10px; } .map-frame { background-size:18px 18px; } .station-label { font-size:26px; stroke-width:8px; } .station-sub { display:none; } .station-value { font-size:24px; stroke-width:7px; } .route { stroke-width:10; } .map-key { padding:11px 0; align-items:center; gap:7px; } .lines { gap:12px; } .line-key { font-size:10px; gap:5px; } .line-swatch { width:15px; } .scale-key { font-size:9px; gap:3px; } .scale-key svg { width:40px; height:20px; }
      .timeline { grid-template-columns:93px minmax(0,1fr); padding:14px 0 19px; gap:14px; } #hour-display { font-size:54px; } .clock-minutes { font-size:24px; } .timeline-top { margin-bottom:1px; } .clock-label { font-size:9px; } .icon-button { width:32px; height:32px; } .timeline-top label { font-size:10px; } .playback { gap:3px; }
      .sidebar { padding:0; border:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); column-gap:19px; border-top:1px solid var(--rule); }
      .summary { grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--rule); min-height:69px; gap:18px; } .total-label { flex-direction:column; align-items:start; gap:5px; padding:0; } .total-line { border:0; padding:0; } #total { font-size:38px; }
      .rank-head { margin-top:17px; } .rank-head .subtle { font-size:9px; } .rank-button { grid-template-columns:13px 5px minmax(0,1fr) 38px; gap:4px; padding:0 2px; height:29px; } .rank-name { font-size:10px; } .rank-value { font-size:11px; } .rank-bar { left:24px; } .rank-number { font-size:10px; }
      .station-detail { border:0; border-left:1px solid var(--rule); padding:17px 0 0 13px; margin:0; } .detail-heading { flex-wrap:wrap; gap:7px; } .detail-heading h2 { font-size:13px; } .detail-current { flex-direction:column-reverse; gap:4px; margin-top:15px; } #station-chart { margin-top:10px; } .chart-label { font-size:13px; } footer { font-size:9px; margin-top:17px; }
    }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto !important; } }
  </style>

  <script>
    'use strict';
    (() => {

      const stations = [
        { id:'west', name:'西街', en:'WEST STREET', x:160, y:270, lx:160, ly:323, anchor:'middle', color:'red', lines:[1] },

        { id:'central', name:'中央广场', en:'CENTRAL SQUARE', x:605, y:270, lx:640, ly:334, anchor:'middle', color:'teal', lines:[1,2,3] },

      // Each row is one unique station; columns are hours 00 through 23.
      const data = Object.freeze({

        garden:Object.freeze([60,20,5,0,0,40,290,570,780,920,1090,1260,1530,1680,1740,1650,1470,1590,1880,1610,1120,730,350,140]),

      const globalMax = Math.max(...Object.values(data).flat());
      const chartMax = Math.ceil(globalMax / 1000) * 1000;
      const format = number => number.toLocaleString('zh-CN');

      const $ = id => document.getElementById(id);
      const state = { hour:8, selected:'central' };

      const values = () => Object.fromEntries(stations.map(station => [station.id, data[station.id][state.hour]]));
      const ranking = () => stations.map((station, index) => ({ id:station.id, name:station.name, value:data[station.id][state.hour], index })).sort((a,b) => b.value-a.value || a.index-b.index);
      Object.defineProperty(window, 'labState', { value:Object.freeze({

        get total() { return Object.values(values()).reduce((sum,value) => sum+value,0); },

        get values() { return values(); },
        get ranking() { return ranking(); },
        get data() { return data; }
      }) });
      const ns = 'http://www.w3.org/2000/svg';
      function svgElement(tag, attributes, text) {
        const element = document.createElementNS(ns,tag);
        for (const [key,value] of Object.entries(attributes)) element.setAttribute(key,value);
        if (text !== undefined) element.textContent = text;
        return element;
      }
      const nodes = new Map();
      const rankNodes = new Map();
      stations.forEach(station => {
        const group = svgElement('g', { 'data-station-id':station.id });
        const flow = svgElement('circle', { cx:station.x, cy:station.y, r:0, fill:colors[station.color], class:'flow-node' });
        const ring = svgElement('circle', { cx:station.x, cy:station.y, r:35, class:'selected-ring' });
        const core = svgElement('circle', { cx:station.x, cy:station.y, r:station.id === 'central' ? 9 : 6, class:'station-core' });
        const label = svgElement('text', { x:station.lx, y:station.ly, 'text-anchor':station.anchor, class:'station-label' }, station.name);
        const en = svgElement('text', { x:station.lx, y:station.ly+17, 'text-anchor':station.anchor, class:'station-sub' }, station.en);
        group.append(flow,ring,core,label,en);
        $('station-nodes').append(group);
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'station-button'; button.dataset.station = station.id;
        button.style.left = `${station.x/920*100}%`; button.style.top = `${station.y/520*100}%`;
        button.addEventListener('click', () => select(station.id));
        $('station-buttons').append(button);
        nodes.set(station.id, { flow,ring,core,button });
        const li = document.createElement('li');
        const rankButton = document.createElement('button');
        rankButton.type='button'; rankButton.className='rank-button'; rankButton.dataset.rankStation=station.id;
        rankButton.style.setProperty('--line',colors[station.color]);
        rankButton.innerHTML='<span class="rank-number"></span><span class="rank-dot" aria-hidden="true"></span><span class="rank-name"></span><span class="rank-value"></span><span class="rank-bar" aria-hidden="true"><span></span></span>';
        rankButton.querySelector('.rank-name').textContent=station.name;
        rankButton.addEventListener('click', () => select(station.id));
        li.append(rankButton); $('ranking').append(li);
        rankNodes.set(station.id, { li,button:rankButton });
      });
      function render() {
        const hourText = `${pad(state.hour)}:00`;
        const current = values();
        $('hour').value = state.hour; $('hour').setAttribute('aria-valuetext',hourText);
        $('hour-display').textContent=pad(state.hour);
        $('period-label').textContent=state.hour < 5 ? '夜间' : state.hour < 7 ? '清晨' : state.hour < 10 ? '早高峰' : state.hour < 17 ? '日间' : state.hour < 20 ? '晚高峰' : '夜间';
        $('total').textContent=format(window.labState.total);
        $('total-period').textContent=`${hourText}–${pad(state.hour)}:59`;
        for (const station of stations) {
          const node=nodes.get(station.id);
          const selected=station.id===state.selected;
          node.flow.setAttribute('r',30*Math.sqrt(current[station.id]/globalMax));
          node.ring.style.display=selected?'':'none';
          node.core.setAttribute('stroke',selected ? colors[station.color] : '#242a2a');
          const label=`${station.name}，${station.lines.join('、')}号线，${hourText}进站${format(current[station.id])}人次，查看全天客流`;
          node.button.setAttribute('aria-label',label); node.button.title=label;
          node.button.setAttribute('aria-pressed',String(selected));
        }
        ranking().forEach((entry,index) => {
          const node=rankNodes.get(entry.id);
          node.button.querySelector('.rank-number').textContent=pad(index+1);
          node.button.querySelector('.rank-value').textContent=format(entry.value);
          node.button.style.setProperty('--width',`${entry.value/globalMax*100}%`);
          node.button.setAttribute('aria-pressed',String(entry.id===state.selected));
          node.button.setAttribute('aria-label',`${entry.name}，排名${index+1}，${format(entry.value)}人次，查看全天客流`);
          if ($('ranking').children[index]!==node.li) $('ranking').insertBefore(node.li,$('ranking').children[index] || null);
        });
        const station=stations.find(item=>item.id===state.selected);
        $('selected-name').textContent=station.name;
        $('selected-value').textContent=format(current[station.id]);
        $('selected-hour').textContent=hourText;
        const points=data[station.id].map((value,hour)=>[9+hour/23*238,116-value/chartMax*90]);
        const path=points.map(([x,y],index)=>`${index?'L':'M'}${x.toFixed(3)} ${y.toFixed(3)}`).join(' ');
        $('curve').setAttribute('d',path);
        $('curve').style.stroke=colors[station.color];
        $('curve-area').setAttribute('d',`${path} L247 116 L9 116 Z`);
        $('curve-area').style.fill=colors[station.color]+'0c';
        $('chart-max').textContent=`${format(chartMax)} 人次`;
        $('hour-marker').setAttribute('x1',points[state.hour][0]); $('hour-marker').setAttribute('x2',points[state.hour][0]);
        $('curve-dot').setAttribute('cx',points[state.hour][0]); $('curve-dot').setAttribute('cy',points[state.hour][1]); $('curve-dot').style.fill=colors[station.color];
        $('chart-title').textContent=`${station.name}全天进站客流，${data[station.id].map((value,hour)=>`${pad(hour)}时${value}人次`).join('，')}。当前${hourText}，${format(current[station.id])}人次。`;
      }
      function select(id) { state.selected=id; render(); $('selection-status').textContent=`已选择${stations.find(station=>station.id===id).name}，${pad(state.hour)}时${format(data[id][state.hour])}人次`; }
      function icons() { if (window.lucide) window.lucide.createIcons(); }
      function stop() {
        if (timer!==null) window.clearInterval(timer);
        timer=null; $('play').setAttribute('aria-pressed','false'); $('play').setAttribute('aria-label','播放时间轴'); $('play').title='播放时间轴';
        $('play').innerHTML='<i data-lucide="play" aria-hidden="true"></i>'; icons();
      }
      function move(delta) { stop(); state.hour=(state.hour+delta+24)%24; render(); }
      $('hour').addEventListener('input',event=>{ stop(); state.hour=Number(event.target.value); render(); });
      $('previous').addEventListener('click',()=>move(-1));
      $('next').addEventListener('click',()=>move(1));
      $('play').addEventListener('click',()=>{
        if (timer!==null) { stop(); return; }
        $('play').setAttribute('aria-pressed','true'); $('play').setAttribute('aria-label','暂停时间轴'); $('play').title='暂停时间轴';
        $('play').innerHTML='<i data-lucide="pause" aria-hidden="true"></i>'; icons();
        timer=window.setInterval(()=>{ state.hour=(state.hour+1)%24; render(); },1200);
      });
      document.addEventListener('visibilitychange',()=>{ if (document.hidden) stop(); });
      window.addEventListener('pagehide',stop);
      render(); icons();
    })();
  </script>
</body>
</html>
