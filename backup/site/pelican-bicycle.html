<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>鹈鹕，去兜风。</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #29464b;
      --muted: #607e7d;
      --sky: #eaf6f7;
      --accent: #df604f;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: var(--sky);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
      -webkit-tap-highlight-color: transparent;
    }
    main { position: relative; width: 100%; height: 100%; height: 100svh; isolation: isolate; }
    .artwork { position: absolute; inset: 0; width: 100%; height: 100%; }
    .masthead { position: absolute; top: 34px; left: 40px; pointer-events: none; }
    h1 {
      margin: 0 0 10px;
      font-family: "Palatino Linotype", "Noto Serif SC", "Songti SC", SimSun, serif;
      font-size: 30px;
      line-height: 1.35;
      font-weight: 600;
    }
    .masthead p { margin: 0; font-size: 10px; font-weight: 500; color: var(--muted); }
    .footer {
      position: absolute;
      right: 40px;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .caption { margin: 0; font-size: 12px; color: var(--muted); }
    .controls { display: flex; align-items: center; gap: 14px; height: 44px; flex-shrink: 0; }
    .icon-button {
      position: relative;
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      padding: 0;
      border: 1px solid #29464b30;
      border-radius: 50%;
      color: var(--ink);
      background: #ffffffa8;
      cursor: pointer;
      transition: background 160ms, border-color 160ms;
    }
    .icon-button:hover { background: #ffffff; border-color: #29464b70; }
    .icon-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon-button [hidden] { display: none; }
    .tooltip {
      position: absolute;
      bottom: 53px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 9px;
      border-radius: 4px;
      color: white;
      background: var(--ink);
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
    }
    .icon-button:hover .tooltip, .icon-button:focus-visible .tooltip { opacity: 1; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .divider { width: 1px; height: 20px; background: #29464b25; }
    .speed-label { font-size: 12px; color: var(--muted); }
    input[type="range"] {
      width: 98px;
      height: 28px;
      margin: 0;
      cursor: pointer;
      accent-color: var(--accent);
    }
    output { width: 32px; font-size: 12px; font-variant-numeric: tabular-nums; }
    @media (max-width: 600px) {
      .masthead { top: max(27px, env(safe-area-inset-top)); left: 24px; }
      h1 { font-size: 26px; }
      .footer { right: 24px; left: 24px; bottom: max(26px, env(safe-area-inset-bottom)); justify-content: center; }
      .caption { display: none; }
      .controls { gap: 13px; }
      input[type="range"] { width: 105px; }
    }
    @media (max-height: 500px) and (min-width: 601px) {
      .masthead { top: 18px; left: 24px; }
      h1 { font-size: 22px; margin-bottom: 5px; }
      .footer { bottom: 12px; right: 24px; left: 24px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const $ = (id) => document.getElementById(id);
      const scene = $('scene');
      const toggle = $('play-toggle');
      const speedInput = $('speed');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const parts = Object.fromEntries([
        'rear-spokes', 'front-spokes', 'chainring', 'near-crank', 'near-crank-highlight',
        'far-crank', 'pelican', 'tail', 'scarf-tail', 'eye', 'closed-eye', 'road',
        'ripples', 'clouds', 'distant-coast', 'verge', 'foreground', 'bicycle-and-rider', 'bike-shadow',
        'far-leg-outline', 'far-leg-color', 'far-foot', 'near-leg-outline', 'near-leg-color',
        'near-leg-highlight', 'near-foot'
      ].map((id) => [id, $(id)]));
      let playing = !reducedMotion.matches;
      let speed = 1;
      let phase = 0.55;
      let elapsed = 0;
      let previousTime = null;
      let frameId = null;
      const tau = Math.PI * 2;
      const attr = (id, name, value) => parts[id].setAttribute(name, value);
      const transform = (id, value) => attr(id, 'transform', value);
      const translate = (x, y) => 'translate(' + x.toFixed(3) + ' ' + y.toFixed(3) + ')';

      function fitScene() {
        const bounds = scene.getBoundingClientRect();
        if (!bounds.width || !bounds.height) return;
        const desiredWidth = bounds.width <= 600 ? 780 : 1240;
        const availableHeight = Math.max(220, bounds.height - (bounds.height < 500 ? 100 : 145));
        const scale = Math.min(bounds.width / desiredWidth, availableHeight / 650);
        const width = bounds.width / scale;
        const height = bounds.height / scale;
        scene.setAttribute('viewBox', [640 - width / 2, 457 - height / 2, width, height].join(' '));
      }

      // Two-link inverse kinematics keeps both webbed feet attached to opposite pedals.
      function leg(side, angle, bodyBob) {
        const hip = { x: side === 'near' ? 578 : 563, y: 477 + bodyBob };
        const pedal = { x: 603 + 43 * Math.cos(angle), y: 644 + 43 * Math.sin(angle) };
        const ankle = { x: pedal.x, y: pedal.y - 15 };
        const dx = ankle.x - hip.x;
        const dy = ankle.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const upper = 103;
        const lower = 115;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const knee = {
          x: hip.x + dx / distance * along + dy / distance * bend,
          y: hip.y + dy / distance * along - dx / distance * bend
        };
        const d = 'M' + hip.x + ' ' + hip.y + 'L' + knee.x + ' ' + knee.y + 'L' + ankle.x + ' ' + ankle.y;
        attr(side + '-leg-outline', 'd', d);
        attr(side + '-leg-color', 'd', d);
        if (side === 'near') attr('near-leg-highlight', 'd', d);
        transform(side + '-foot', translate(pedal.x, pedal.y));
        const crank = 'M603 644L' + pedal.x + ' ' + pedal.y;
        attr(side + '-crank', 'd', crank);
        if (side === 'near') attr('near-crank-highlight', 'd', crank);
      }

      function draw() {
        const bob = Math.sin(phase * 2) * 1.8;
        const wheelAngle = phase * 1.72 * 180 / Math.PI;
        const travelled = (phase - 0.55) * 1.72 * 108;
        transform('rear-spokes', 'rotate(' + wheelAngle + ')');
        transform('front-spokes', 'rotate(' + wheelAngle + ')');
        transform('chainring', 'translate(603 644) rotate(' + phase * 180 / Math.PI + ')');
        transform('pelican', translate(0, bob));
        transform('bicycle-and-rider', translate(0, Math.sin(phase * 4) * 0.45));
        transform('tail', 'rotate(' + Math.sin(phase * 2 + 0.6) * 2 + ' 456 416)');
        transform('scarf-tail', 'rotate(' + (Math.sin(phase * 2.3) * 4 + 1) + ' 630 359)');
        leg('far', phase + Math.PI, bob);
        leg('near', phase, bob);
        transform('road', translate(-(travelled % 1250), 795));
        transform('ripples', translate(-((travelled * 0.16) % 1200), 579));
        transform('clouds', translate(-Math.sin(elapsed * 0.035) * 24, 0));
        transform('distant-coast', translate(-Math.sin(elapsed * 0.025) * 14, 0));
        transform('verge', translate(-Math.sin(elapsed * 0.15) * 16, 0));
        transform('foreground', translate(-Math.sin(elapsed * 0.18) * 23, -48));
        attr('bike-shadow', 'rx', 344 + Math.sin(phase * 2) * 2);
        const blinkTime = elapsed % 5.7;
        const blinking = blinkTime > 4.9 && blinkTime < 5.06;
        attr('eye', 'visibility', blinking ? 'hidden' : 'visible');
        attr('closed-eye', 'visibility', blinking ? 'visible' : 'hidden');
      }

      function animate(now) {
        frameId = null;
        if (!playing || document.hidden) return;
        const dt = previousTime === null ? 0 : Math.min((now - previousTime) / 1000, 0.05);
        previousTime = now;
        elapsed += dt * speed;
        phase += dt * speed * tau / 1.8;
        draw();
        frameId = requestAnimationFrame(animate);
      }

      function syncPlayback() {
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        previousTime = null;
        toggle.setAttribute('aria-pressed', String(playing));
        toggle.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        $('pause-icon').toggleAttribute('hidden', !playing);
        $('play-icon').toggleAttribute('hidden', playing);
        $('play-tooltip').textContent = playing ? '暂停' : '播放';
        scene.dataset.playing = String(playing);
        if (playing && !document.hidden) frameId = requestAnimationFrame(animate);
      }

      toggle.addEventListener('click', () => { playing = !playing; syncPlayback(); });
      speedInput.addEventListener('input', () => {
        speed = Number(speedInput.value);
        $('speed-value').value = speed + '×';
        speedInput.setAttribute('aria-valuetext', speed + ' 倍速');
      });
      document.addEventListener('visibilitychange', syncPlayback);
      reducedMotion.addEventListener('change', (event) => {
        if (event.matches) { playing = false; syncPlayback(); }
      });
      window.addEventListener('resize', fitScene);
      fitScene();
      draw();
      syncPlayback();
    })();
  </script>
</body>
</html>
