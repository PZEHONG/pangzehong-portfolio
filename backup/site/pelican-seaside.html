        <path d="M784 282Q869 297 1018 305Q1029 309 1017 317C969 336 921 351 880 379C846 404 800 371 781 342L765 321Z" fill="url(#pouch)" class="outline"/>
        <path d="M786 308Q804 357 846 375Q862 383 884 373" fill="none" stroke="#f8d786" stroke-width="6" stroke-linecap="round"/>
        <path d="M785 281Q886 282 1019 304Q1039 308 1025 318L1011 320L1013 312Q900 316 781 311Z" fill="#f5ce72" class="outline" stroke-width="4"/>
        <path d="M811 290Q900 291 994 306" fill="none" stroke="#ffe7a1" stroke-width="3" stroke-linecap="round"/>
        <path d="M827 289l13 1" stroke="#b88b41" stroke-width="3" stroke-linecap="round"/>
        <ellipse cx="751" cy="299" rx="16" ry="10" fill="#eeb8a0" opacity=".65"/>
        <g id="eye">
          <circle cx="768" cy="267" r="12" fill="#fffdf2" stroke="#294651" stroke-width="2.7"/>
          <ellipse cx="772" cy="268" rx="5" ry="6.7" fill="#294651"/>
          <circle cx="773.5" cy="265.5" r="1.7" fill="#fffdf2"/>
        </g>
        <path d="M753 246q11-7 23-1" class="fine" stroke-width="3"/>
        <path d="M701 279q-1 17 7 27" class="fine" stroke="#c6d4cc" stroke-width="3"/>
      </g>
      <path d="M700 370Q732 389 770 372L775 393Q737 414 701 393Z" fill="#df7358" class="outline" stroke-width="3.5"/>
      <path d="M710 381Q738 397 765 384" fill="none" stroke="#f3ab87" stroke-width="3" stroke-linecap="round"/>
      <path d="M701 378q-17 1-16 15q5 13 20 6q9-12-4-21Z" fill="#df7358" class="outline" stroke-width="3"/>
    </g>
    <g id="front-wing" class="outline">
      <path id="wing-shape" d="M646 458C681 435 721 459 758 484Q818 525 876 520Q894 516 898 528Q895 538 878 540C837 552 789 548 749 532C701 519 654 514 643 488Q636 473 646 458Z" fill="url(#feather)"/>
      <path id="wing-feather-1" d="M665 475Q718 497 763 515Q828 543 882 532" class="fine" stroke="#c0cec5" stroke-width="3"/>
      <path id="wing-feather-2" d="M661 488Q705 510 744 517" class="fine" stroke="#c0cec5" stroke-width="2.7"/>
      <path d="M879 522q-3 8 2 14m7-15q-3 6 1 12" class="fine" stroke-width="2"/>
    </g>
    <g id="breeze" fill="none" stroke="#83b6be" stroke-width="3" stroke-linecap="round" opacity=".7">
      <path d="M445 378h-57m-17 0h-15M454 399h-26M410 552h-39m-16 0h-9"/>
    </g>
    <rect id="paper-overlay" x="20" y="45" width="1440" height="900" fill="transparent" filter="url(#paper)" opacity=".27" pointer-events="none"/>
  </svg>
  <button id="playback" type="button" aria-label="暂停动画" title="暂停动画（空格键）">
    <svg id="pause-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg>
    <svg id="play-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.7q0-1 1-.4l12 7q1 .7 0 1.4l-12 7q-1 .6-1-.4Z"/></svg>
  </button>
</main>
<script>
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const scene = byId('scene');
  const playback = byId('playback');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const parts = Object.fromEntries(['rear-wheel', 'front-wheel', 'crank', 'chainring', 'rear-sprocket', 'chain-links', 'chain-rivets', 'chain-master-link', 'pelican', 'front-leg-line', 'front-leg-color', 'back-leg-line', 'front-foot', 'back-foot', 'front-pedal', 'back-pedal', 'pedal-highlight', 'front-knee', 'eye', 'scarf-long', 'scarf-short', 'scarf-seam', 'wing-shape', 'wing-feather-1', 'wing-feather-2', 'sand-grain', 'road-marks', 'water-lines', 'sailboat', 'breeze'].map(id => [id, byId(id)]));
  const drivetrain = { chainringRadius: 34, sprocketRadius: 17, wheelRadius: 104 };
  const chainTrack = byId('chain-track');
  const chainLength = chainTrack.getTotalLength();
  const chainPitch = chainLength / Math.round(chainLength / 9);
  parts['chain-links'].setAttribute('stroke-dasharray', `${chainPitch * .62} ${chainPitch * .38}`);
  parts['chain-rivets'].setAttribute('stroke-dasharray', `0 ${chainPitch / 2}`);
  const clouds = [...document.querySelectorAll('[data-drift]')];
  const ground = [...document.querySelectorAll('[data-ground]')];
  let time = 0;
  let lastTime = null;
  let request = null;
  let playing = !reducedMotion.matches;
  const set = (name, attribute, value) => parts[name].setAttribute(attribute, value);
  const wrap = (value, width, left) => ((value - left) % width + width) % width + left;

  function resize() {
    const ratio = innerWidth / innerHeight;
    const width = ratio >= 1.2 ? Math.max(1400, 900 * ratio) : (ratio > .8 ? 1070 : 830);
    const height = width / ratio;
    scene.setAttribute('viewBox', `${740 - width / 2} ${495 - height / 2} ${width} ${height}`);
    const overlay = byId('paper-overlay');
    Object.entries({ x: 740 - width / 2, y: 495 - height / 2, width, height }).forEach(([key, value]) => overlay.setAttribute(key, value));
  }

  function leg(side, phase, bob) {
    const pedalX = 715 + Math.cos(phase) * 38;
    const pedalY = 722 + Math.sin(phase) * 38;
    const hipX = side === 'front' ? 670 : 655;
    const hipY = 549 + bob;
    const ankleX = pedalX - 5;
    const ankleY = pedalY - 10;
    const dx = ankleX - hipX;
    const dy = ankleY - hipY;
    const distance = Math.hypot(dx, dy);
    const upper = 105, lower = 119;
    const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
    const across = Math.sqrt(Math.max(0, upper * upper - along * along));
    const kneeX = hipX + dx / distance * along + dy / distance * across;
    const kneeY = hipY + dy / distance * along - dx / distance * across;
    const line = `M${hipX} ${hipY}L${kneeX} ${kneeY}L${ankleX} ${ankleY}`;
    set(`${side}-leg-line`, 'd', line);
    set(`${side}-foot`, 'transform', `translate(${pedalX} ${pedalY})`);
    set(`${side}-pedal`, 'transform', `translate(${pedalX} ${pedalY})`);
    if (side === 'front') {
      set('front-leg-color', 'd', line);
      set('front-knee', 'cx', kneeX);
      set('front-knee', 'cy', kneeY);
      set('pedal-highlight', 'transform', `translate(${pedalX} ${pedalY})`);
    }
  }

  function render() {
    const phase = time * 3.15 - .4;
    const bob = Math.sin(phase * 2) * 2.3;
    const flutter = Math.sin(time * 5.1) * 7;
    const flutter2 = Math.sin(time * 5.1 - .8) * 5;
    const crankAngle = phase * 180 / Math.PI;
    const chainDistance = (phase + .4) * drivetrain.chainringRadius;
    const rearPhase = chainDistance / drivetrain.sprocketRadius;
    const wheelAngle = rearPhase * 180 / Math.PI;
    set('chainring', 'transform', `translate(715 722) rotate(${crankAngle})`);
    set('rear-sprocket', 'transform', `translate(560 706) rotate(${wheelAngle % 360})`);
    set('chain-links', 'stroke-dashoffset', -chainDistance % chainPitch);
    set('chain-rivets', 'stroke-dashoffset', -chainDistance % chainPitch);
    const linkDistance = (chainDistance + chainPitch * 8) % chainLength;
    const linkPoint = chainTrack.getPointAtLength(linkDistance);
    const linkBefore = chainTrack.getPointAtLength((linkDistance - .5 + chainLength) % chainLength);
    const linkAfter = chainTrack.getPointAtLength((linkDistance + .5) % chainLength);
    const linkAngle = Math.atan2(linkAfter.y - linkBefore.y, linkAfter.x - linkBefore.x) * 180 / Math.PI;
    set('chain-master-link', 'transform', `translate(${linkPoint.x} ${linkPoint.y}) rotate(${linkAngle})`);
    set('rear-wheel', 'transform', `rotate(${wheelAngle % 360})`);
    set('front-wheel', 'transform', `rotate(${wheelAngle % 360})`);
    set('crank', 'transform', `translate(715 722) rotate(${crankAngle})`);
    set('pelican', 'transform', `translate(0 ${bob})`);
    leg('back', phase + Math.PI, bob);
    leg('front', phase, bob);
    set('wing-shape', 'd', `M646 ${458 + bob}C681 ${435 + bob} 721 ${459 + bob} 758 484Q818 525 876 520Q894 516 898 528Q895 538 878 540C837 552 789 548 749 532C701 ${519 + bob} 654 ${514 + bob} 643 ${488 + bob}Q636 ${473 + bob} 646 ${458 + bob}Z`);
    set('wing-feather-1', 'd', `M665 ${475 + bob}Q718 ${497 + bob} 763 515Q828 543 882 532`);
    set('wing-feather-2', 'd', `M661 ${488 + bob}Q705 ${510 + bob} 744 517`);
    set('scarf-long', 'd', `M706 378C647 ${351 + flutter2} 620 ${387 + flutter} 554 ${354 + flutter}L565 ${380 + flutter}L549 ${395 + flutter}C606 ${414 + flutter} 651 ${371 + flutter2} 712 398Z`);
    set('scarf-short', 'd', `M710 389C661 ${399 - flutter2} 644 ${436 - flutter} 601 ${422 - flutter}L613 ${439 - flutter}L607 ${451 - flutter}C660 ${461 - flutter} 670 ${416 - flutter2} 720 407Z`);
    set('scarf-seam', 'd', `M565 ${375 + flutter}Q620 ${401 + flutter} 690 378`);
    const blinkCycle = time % 5.6;
    const eyeScale = blinkCycle > 4.95 && blinkCycle < 5.17 ? Math.max(.06, Math.abs(blinkCycle - 5.06) / .11) : 1;
    set('eye', 'transform', `translate(768 267) scale(1 ${eyeScale}) translate(-768 -267)`);
    const roadDistance = rearPhase * drivetrain.wheelRadius;
    set('road-marks', 'patternTransform', `translate(${-roadDistance % 255} 0)`);
    set('sand-grain', 'patternTransform', `translate(${-roadDistance % 173} 0)`);
    set('water-lines', 'patternTransform', `translate(${-time * 12 % 460} 0)`);
    clouds.forEach(cloud => {
      const x = wrap(Number(cloud.dataset.start) - time * Number(cloud.dataset.drift), 2300, -400);
      cloud.setAttribute('transform', `translate(${x} ${cloud.dataset.y}) scale(${cloud.dataset.scale || 1.1})`);
    });
    ground.forEach(item => {
      const x = wrap(Number(item.dataset.start) - roadDistance, 2400, -450);
      item.setAttribute('transform', `translate(${x} ${item.dataset.y})`);
    });
    set('sailboat', 'transform', `translate(${wrap(1190 - time * 6, 2300, -350)} ${584 + Math.sin(time * 1.5) * 2}) rotate(${Math.sin(time * 1.2) * 1.6})`);
    set('breeze', 'transform', `translate(${Math.sin(time * 2) * 6} 0)`);
    set('breeze', 'opacity', .5 + Math.sin(time * 2) * .13);
  }

  function frame(now) {
    request = null;
    if (!playing || document.hidden) { lastTime = null; return; }
    if (lastTime !== null) time += Math.min((now - lastTime) / 1000, .06);
    lastTime = now;
    render();
    request = requestAnimationFrame(frame);
  }

  function schedule() {
    if (request !== null) cancelAnimationFrame(request);
    request = null;
    lastTime = null;
    if (playing && !document.hidden) request = requestAnimationFrame(frame);
  }

  function setPlaying(next) {
    playing = next;
    const label = playing ? '暂停动画' : '播放动画';
    playback.setAttribute('aria-label', label);
    playback.title = `${label}（空格键）`;
    schedule();
  }

  playback.addEventListener('click', () => setPlaying(!playing));
  document.addEventListener('keydown', event => {
    if (event.code === 'Space' && event.target !== playback && !event.repeat) {
      event.preventDefault();
      setPlaying(!playing);
    }
  });
  document.addEventListener('visibilitychange', schedule);
  reducedMotion.addEventListener('change', () => setPlaying(!reducedMotion.matches));
  window.addEventListener('resize', resize, { passive: true });
  resize();
  render();
  setPlaying(playing);
  Object.defineProperty(window, '__pelicanRide', { value: Object.freeze({ get ready() { return true; }, get time() { return time; }, get playing() { return playing; } }) });
})();
</script>
