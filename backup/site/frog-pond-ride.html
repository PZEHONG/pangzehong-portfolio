<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf5f5">
  <meta name="description" content="一只戴着荷叶帽的小青蛙，骑着自行车沿池塘兜风。原创 SVG 二维动画，离线也能播放。">
  <title>池塘放风日 · 青蛙骑行</title>
  <style>
    :root { color-scheme: light; --ink:#294e50; --muted:#718783; --paper:#f6f9f5; --green:#375d50; --line:#dbe5dd; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button { font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    button:focus-visible { outline:3px solid #cc865e; outline-offset:4px; }
    .page { width:min(100%,1536px); margin:auto; padding:24px 36px 16px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; height:42px; margin-bottom:20px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { width:37px; height:37px; }
    .brand-name { font-size:15px; font-weight:650; letter-spacing:.16em; }
    .brand-en { display:block; margin-top:3px; font-size:9px; letter-spacing:.25em; color:var(--muted); }
    .weather { display:flex; align-items:center; gap:8px; font-size:12px; letter-spacing:.06em; }
    .weather svg { width:19px; height:19px; }
    .weather span:last-child { color:#91a29c; padding-left:8px; border-left:1px solid var(--line); }
    .scene { position:relative; height:clamp(370px,calc(100svh - 211px),790px); min-height:min(615px,calc(42vw - 30px)); overflow:hidden; border-radius:22px; background:#e7f2f4; isolation:isolate; border:1px solid #d7e5e3; }
    .landscape { display:block; width:100%; height:100%; }
    .intro { position:absolute; top:9%; left:6%; pointer-events:none; }
    .eyebrow { display:flex; align-items:center; gap:10px; margin:0 0 19px; font-size:11px; letter-spacing:.23em; color:#617e76; }
    .eyebrow::before { content:""; width:23px; height:1px; background:#7c9789; }
    h1 { margin:0; font-family:"STKaiti","KaiTi","Kaiti SC","FangSong",serif; font-size:clamp(40px,4.3vw,67px); line-height:1.27; font-weight:550; letter-spacing:.05em; }
    .intro p:last-child { margin:18px 0 0; font-size:13px; letter-spacing:.12em; color:#647f78; line-height:1.8; }
    .scene-note { position:absolute; left:6%; bottom:6%; font-size:10px; letter-spacing:.22em; color:#536b50; }
    .controls { display:flex; align-items:center; justify-content:space-between; gap:24px; min-height:84px; padding:17px 1px 10px; }
    .play-group { display:flex; align-items:center; gap:17px; }
    .play-button { display:flex; align-items:center; justify-content:center; gap:9px; min-width:124px; height:44px; padding:0 20px; border:0; border-radius:24px; background:var(--green); color:white; font-size:13px; }
    .play-button:hover { background:#294a3e; }
    .play-button svg { width:15px; height:15px; fill:currentColor; }
    .status { margin:0; color:var(--muted); font-size:12px; letter-spacing:.025em; }
    .speed-group { display:flex; align-items:center; gap:15px; }
    .speed-label { font-size:11px; color:var(--muted); letter-spacing:.12em; }
    .speed-buttons { display:flex; padding:4px; gap:3px; background:#eaf0e8; border-radius:24px; }
    .speed-button { min-width:69px; min-height:36px; padding:6px 14px; border:0; border-radius:20px; background:transparent; font-size:12px; color:#71816f; }
    .speed-button[aria-pressed="true"] { background:white; color:#345443; box-shadow:0 1px 4px #2a493c0b; }
    .speed-button:hover { color:#254938; }
    footer { display:flex; justify-content:space-between; gap:10px; font-size:10px; color:#8b9a8c; letter-spacing:.08em; line-height:1.5; }
    kbd { font:inherit; padding:1px 5px; border:1px solid #dce5d8; border-radius:4px; margin-right:4px; }
    .sky-ink { fill:none; stroke:#769492; stroke-linecap:round; stroke-linejoin:round; }
    .ink { stroke:#34554e; stroke-linecap:round; stroke-linejoin:round; }
    .bike-ink { stroke:#34554e; stroke-linecap:round; stroke-linejoin:round; }
    @media (min-width:1700px) { .page { padding-top:32px; } }
    @media (min-width:601px) and (max-width:1000px) {
      .scene { height:clamp(350px,min(68vw,calc(100svh - 211px)),660px); min-height:0; }
    }
    @media (max-width:800px) {
      .page { padding:19px 22px 15px; }
      .status { max-width:190px; line-height:1.65; }
      .controls { gap:12px; }
      .play-group { gap:12px; }
      .speed-group { gap:9px; }
      .speed-label { display:none; }
      .speed-button { min-width:61px; padding:6px 10px; }
      .intro { top:8%; }
    }
    @media (max-width:600px) {
      .page { padding:17px 16px 15px; }
      .topbar { height:36px; margin-bottom:17px; }
      .brand-mark { width:33px; height:33px; }
      .brand { gap:8px; }
      .brand-name { font-size:13px; }
      .brand-en { font-size:8px; }
      .weather { font-size:11px; }
      .weather span:last-child { display:none; }
      .scene { height:max(clamp(422px,65svh,560px),calc((100vw - 32px) * .93 + 177px)); min-height:0; border-radius:19px; }
      .landscape { position:absolute; width:220%; height:auto; left:-72%; bottom:0; }
      .intro { top:28px; left:25px; }
      .eyebrow { font-size:9px; margin-bottom:12px; }
      h1 { font-size:42px; line-height:1.2; }
      .intro p:last-child { font-size:11px; margin-top:12px; letter-spacing:.06em; }
      .scene-note { left:25px; bottom:22px; font-size:8px; }
      .controls { align-items:flex-start; padding-top:17px; min-height:100px; }
      .play-group { align-items:flex-start; flex-direction:column; gap:9px; }
      .play-button { min-width:110px; height:43px; padding:0 17px; font-size:12px; }
      .status { font-size:10px; max-width:155px; }
      .speed-buttons { padding:4px 3px; gap:1px; }
      .speed-button { min-width:54px; padding:6px 9px; min-height:35px; font-size:11px; }
      footer { font-size:9px; align-items:center; }
      .keyboard-hint { display:none; }
    }
    @media (max-width:360px) {
      .page { padding-right:12px; padding-left:12px; }
      .speed-button { min-width:46px; padding:6px; }
      .controls { gap:8px; }
      .intro { left:21px; }
      h1 { font-size:38px; }
    }
  </style>
</head>

          <g fill="#8ebc67"><circle cx="595" cy="304" r="3.1"/><circle cx="605" cy="299" r="2.4"/><circle cx="605" cy="308" r="1.8"/></g>
          <g id="leaf-hat" transform="rotate(-9 663 234)"><path d="M611 235Q628 220 647 224Q663 206 685 215Q709 214 723 231Q704 242 678 241L664 230L661 243Q632 244 611 235Z" fill="#7ba970" stroke="#426948" stroke-width="2.8"/><path d="M664 230 644 228m20 2 22-11m-22 11 42 1" fill="none" stroke="#a7c789" stroke-width="1.6" stroke-linecap="round"/><path d="M665 227q-5-15 5-22" fill="none" stroke="#537d4e" stroke-width="3" stroke-linecap="round"/></g>

    <div class="intro"><p class="eyebrow">把今天，交给沿途</p><h1>骑着风，<br>慢慢晃。</h1><p>带一篮小花，去没有闹钟的地方。</p></div>

  <div class="controls">
    <div class="play-group"><button id="play-toggle" class="play-button" type="button" aria-label="暂停动画"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="play-icon" d="M4 2h3v12H4zM10 2h3v12h-3z"/></svg><span id="play-label">歇一会儿</span></button><p id="status" class="status" role="status" aria-live="polite">微风正好，慢慢骑。</p></div>
    <div class="speed-group" role="group" aria-label="骑行速度"><span class="speed-label">骑快一点？</span><div class="speed-buttons"><button class="speed-button" type="button" data-speed="0.65" aria-pressed="false">慢悠悠</button><button class="speed-button" type="button" data-speed="1" aria-pressed="true">兜兜风</button><button class="speed-button" type="button" data-speed="1.65" aria-pressed="false">追着风</button></div></div>
  </div>
  <footer><span>小小的车轮，大大的好天气。</span><span class="keyboard-hint"><kbd>Space</kbd> 暂停 / 继续</span><span>愿你今天也轻轻松松。</span></footer>
  <noscript><p>请启用 JavaScript 让小青蛙骑起来；这幅 SVG 插画仍然可以正常欣赏。</p></noscript>
</main>
<script>
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const parts = Object.fromEntries(['rear-wheel','front-wheel','cranks','frog-body','scarf-tail','left-eye','right-eye','near-leg-outline','near-leg-fill','far-leg-outline','far-leg-fill','near-foot','far-foot','knee-highlight','near-arm-outline','near-arm-fill','far-arm-outline','far-arm-fill','basket-flowers','clouds','trees','pond','ground','dragonfly','breeze','bike-shadow'].map(id => [id, byId(id)]));
  const toggle = byId('play-toggle');
  const speedButtons = [...document.querySelectorAll('[data-speed]')];
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let playing = !reducedMotion.matches;
  let speed = 1;
  let time = 0;
  let lastFrame = null;
  let frameId = null;
  const set = (id, attribute, value) => parts[id].setAttribute(attribute, value);
  const fixed = n => n.toFixed(3);

  // Two fixed-length leg segments keep each foot planted on its own pedal.
  function leg(side, phase, bob) {
    const pedal = {x:645 + Math.cos(phase) * 32, y:565 + Math.sin(phase) * 32};
    const hip = {x:side === 'near' ? 621 : 607, y:439 + bob};
    const ankle = {x:pedal.x, y:pedal.y - 7};
    const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
    const distance = Math.hypot(dx, dy);
    const upper = 79, lower = 91;
    const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
    const height = Math.sqrt(Math.max(0, upper * upper - along * along));
    const knee = {x:hip.x + dx * along / distance + dy * height / distance, y:hip.y + dy * along / distance - dx * height / distance};
    const d = `M${fixed(hip.x)} ${fixed(hip.y)}L${fixed(knee.x)} ${fixed(knee.y)}L${fixed(ankle.x)} ${fixed(ankle.y)}`;
    set(`${side}-leg-outline`, 'd', d);
    set(`${side}-leg-fill`, 'd', d);
    set(`${side}-foot`, 'transform', `translate(${fixed(pedal.x)} ${fixed(pedal.y - 8)})`);
    if (side === 'near') set('knee-highlight', 'd', `M${fixed(knee.x - 2)} ${fixed(knee.y - 7)}l2 11`);
  }

  function draw() {
    const phase = time * 2.45 + .45;
    const bob = Math.sin(phase * 2) * 2.1;
    const distance = time * 99;
    const wheelAngle = distance / 93 * 180 / Math.PI;
    set('rear-wheel', 'transform', `rotate(${fixed(wheelAngle)})`);
    set('front-wheel', 'transform', `rotate(${fixed(wheelAngle)})`);
    set('cranks', 'transform', `rotate(${fixed(phase * 180 / Math.PI)})`);
    set('frog-body', 'transform', `translate(0 ${fixed(bob)})`);
    leg('far', phase + Math.PI, bob);
    leg('near', phase, bob);
    const arm = `M665 ${fixed(370 + bob)}Q706 ${fixed(415 + bob * .5)} 779 402`;
    const farArm = `M654 ${fixed(361 + bob)}Q692 ${fixed(408 + bob * .5)} 776 394`;
    set('near-arm-outline', 'd', arm); set('near-arm-fill', 'd', arm);
    set('far-arm-outline', 'd', farArm); set('far-arm-fill', 'd', farArm);
    const flap = Math.sin(time * 5.8) * 5;
    set('scarf-tail', 'd', `M634 347C607 341 595 ${357 + flap} 573 ${338 + flap}Q565 ${331 + flap} 549 ${338 + flap}L554 ${353 + flap}L540 ${360 + flap}Q566 ${376 + flap} 589 ${366 + flap}L628 365Z`);
    const blinkPhase = time % 5.7;
    const blink = blinkPhase > 5.35 ? Math.max(.065, Math.abs(blinkPhase - 5.525) / .175) : 1;
    set('left-eye', 'transform', `translate(635 262) scale(1 ${fixed(blink)})`);
    set('right-eye', 'transform', `translate(700 260) scale(1 ${fixed(blink)})`);
    set('basket-flowers', 'transform', `rotate(${fixed(Math.sin(time * 3.1) * 2.5)} 840 437)`);
    for (const [id, rate] of [['clouds',.08],['trees',.25],['pond',.45],['ground',1]]) set(id, 'transform', `translate(${fixed(-(distance * rate % 1440))} 0)`);
    set('dragonfly', 'transform', `translate(${fixed(1096 + Math.sin(time * .8) * 35)} ${fixed(364 + Math.sin(time * 1.9) * 11)}) rotate(${fixed(Math.sin(time * 1.9) * 5)})`);
    set('breeze', 'opacity', fixed(.3 + (Math.sin(time * 2) + 1) * .15));
    set('bike-shadow', 'rx', fixed(261 + Math.sin(phase * 2) * 2));
  }

  function frame(now) {
    frameId = null;
    if (!playing || document.hidden) { lastFrame = null; return; }
    if (lastFrame !== null) time += Math.min((now - lastFrame) / 1000, .06) * speed;
    lastFrame = now;
    draw();
    frameId = requestAnimationFrame(frame);
  }

  function syncAnimation() {
    if (frameId !== null) cancelAnimationFrame(frameId);
    frameId = null;
    lastFrame = null;
    if (playing && !document.hidden) frameId = requestAnimationFrame(frame);
  }

  function updateControls() {
    toggle.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
    byId('play-label').textContent = playing ? '歇一会儿' : '继续出发';
    byId('play-icon').setAttribute('d', playing ? 'M4 2h3v12H4zM10 2h3v12h-3z' : 'M4 1.5v13L14 8z');
    byId('status').textContent = playing ? (speed < 1 ? '不着急，看看路边的小花。' : speed > 1 ? '跟上风，快乐加一点速。' : '微风正好，慢慢骑。') : reducedMotion.matches ? '已静止 · 点一下，自在出发。' : '停一停，也有好风景。';
    speedButtons.forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.speed) === speed)));
  }

  function togglePlayback() { playing = !playing; updateControls(); syncAnimation(); }
  toggle.addEventListener('click', togglePlayback);
  speedButtons.forEach(button => button.addEventListener('click', () => { speed = Number(button.dataset.speed); updateControls(); }));
  document.addEventListener('keydown', event => {
    if (event.code !== 'Space' || event.repeat || event.altKey || event.ctrlKey || event.metaKey || event.target.closest('button,input,select,textarea,a,[contenteditable]')) return;
    event.preventDefault(); togglePlayback();
  });
  document.addEventListener('visibilitychange', syncAnimation);
  reducedMotion.addEventListener('change', () => { if (reducedMotion.matches) { playing = false; updateControls(); syncAnimation(); } });
  draw(); updateControls(); syncAnimation();
})();
</script>
