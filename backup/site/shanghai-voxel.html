<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d4e5df">
  <title>方块上海 | Shanghai Voxel</title>
  <style>:root {
  color-scheme: light;
  --ink: #243c3b;
  --muted: #5f7672;
  --surface: rgba(250, 253, 248, .86);
  --line: rgba(43, 77, 68, .14);
  --accent: #be4e58;
  --active: #dfeee4;
  --shadow: 0 5px 22px rgba(35, 61, 53, .07);
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  letter-spacing: 0;
}
* { box-sizing: border-box; }
body { margin: 0; overflow: hidden; width: 100%; height: 100svh; background: #d4e5df; color: var(--ink); transition: color .7s; }
button, input { font: inherit; letter-spacing: 0; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
button { color: inherit; }
button:disabled { opacity: .45; cursor: wait; }
[hidden] { display: none !important; }
#world { position: fixed; inset: 0; }
#world canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
.masthead { position: fixed; left: 36px; top: 30px; pointer-events: none; }
.edition { display: flex; align-items: center; gap: 9px; font-size: 10px; font-weight: 650; }
.edition svg { width: 21px; height: 21px; stroke-width: 1.6; }
.edition-number { margin-left: 11px; opacity: .5; font-family: Consolas, monospace; }
h1 { font-size: 39px; line-height: 1.25; font-weight: 650; margin: 14px 0 9px; }
.title-dot { color: var(--accent); }
.city-meta { display: flex; gap: 12px; align-items: center; font: 10px Consolas, monospace; color: var(--muted); }
.meta-rule { width: 21px; height: 1px; background: var(--muted); opacity: .6; }
.surface { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); backdrop-filter: blur(14px); }
.atmosphere { position: fixed; right: 34px; top: 32px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.time-switch { display: flex; padding: 4px; gap: 3px; }
.icon-button { width: 39px; height: 39px; padding: 10px; flex-shrink: 0; display: grid; place-items: center; background: transparent; border: 0; border-radius: 3px; position: relative; transition: background .15s, color .15s; }
.icon-button svg { width: 19px; height: 19px; stroke-width: 1.6; }
.icon-button:hover, .view-button:hover { background: var(--active); }
.icon-button.active, .view-button.active { background: var(--active); color: #2c7256; }
.icon-button[aria-pressed="true"] { color: #2c7256; background: var(--active); }
.conditions { display: flex; align-items: center; gap: 7px; font-size: 10px; color: var(--muted); padding-right: 4px; }
.status-dot { width: 5px; height: 5px; background: #58a473; border-radius: 50%; }
.landmark-nav { position: fixed; left: 36px; top: 162px; z-index: 5; }
.text-button { display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 13px; font-size: 12px; }
.text-button svg { width: 16px; height: 16px; stroke-width: 1.5; }
.text-button .small-icon { width: 13px; height: 13px; margin-left: 12px; }
.landmarks-menu { width: 247px; position: absolute; left: 0; top: 47px; padding: 10px; }
.menu-heading { font-size: 10px; color: var(--muted); padding: 8px 8px 14px; display: flex; justify-content: space-between; }
.menu-heading span { font-family: Consolas, monospace; }
.landmarks-menu button { display: flex; align-items: center; gap: 11px; border: 0; background: transparent; width: 100%; min-height: 37px; text-align: left; font-size: 12px; border-radius: 3px; padding: 7px 8px; }
.landmarks-menu button:hover, .landmarks-menu button.selected { background: var(--active); }
.landmarks-menu button span:last-child { font-size: 10px; color: var(--muted); margin-left: auto; }
.landmark-swatch { width: 7px; height: 10px; flex: 0 0 7px; background: #72a9ac; }
.pink { background: #c56a8b; }.teal { background: #4aada7; }.blue { background: #6f97ba; }.silver { background: #9aaeb0; }.gold { background: #c5b477; }.green { background: #67a077; }.stone { background: #b1aea0; }
.building-info { position: fixed; left: 36px; bottom: 139px; width: 244px; padding: 20px 19px 17px; z-index: 3; }
.small-close { position: absolute; right: 4px; top: 5px; width: 28px; height: 28px; padding: 6px; }
.small-close svg { width: 15px; height: 15px; }
.eyebrow { font-size: 10px; color: var(--muted); margin-bottom: 10px; }
h2 { font-size: 21px; font-weight: 600; line-height: 1.35; margin: 0 0 8px; }
.building-english { font: 9px Consolas, monospace; color: var(--muted); line-height: 1.6; }
.building-divider { height: 1px; background: var(--line); margin: 16px 0 13px; }
.building-detail { font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
.mini-block { background: var(--accent); width: 7px; height: 7px; box-shadow: 3px -3px 0 rgba(194, 104, 108, .3); }
.tools { position: fixed; top: 50%; right: 34px; transform: translateY(-50%); padding: 4px; display: flex; flex-direction: column; gap: 3px; z-index: 4; }
.tool-divider { background: var(--line); height: 1px; margin: 4px 6px; }
.bottom-bar { position: fixed; bottom: 29px; left: 36px; right: 34px; display: flex; align-items: center; justify-content: space-between; gap: 20px; pointer-events: none; }
.bottom-bar > * { pointer-events: auto; }
.scene-caption { display: flex; gap: 13px; align-items: stretch; pointer-events: none; min-width: 220px; }
.caption-line { width: 2px; background: var(--accent); margin: 2px 0; }
.scene-caption strong { display: block; font-size: 16px; line-height: 1.5; font-weight: 600; }
.scene-caption span:not(.caption-line) { font-size: 10px; display: block; margin-top: 4px; color: var(--muted); }
.view-switch { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 5px; }
.view-button { min-width: 80px; height: 39px; padding: 0 13px; border: 0; background: transparent; border-radius: 3px; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 12px; }
.view-button svg { width: 16px; height: 16px; stroke-width: 1.5; }
.sound { display: flex; align-items: center; gap: 5px; padding: 5px 12px 5px 5px; margin-left: auto; }
.sound-caption { display: flex; flex-direction: column; min-width: 67px; gap: 4px; }
.sound-caption strong { font-size: 11px; font-weight: 500; }
.sound-caption span { font: 8px Consolas, monospace; color: var(--muted); }
#volume { width: 52px; height: 18px; accent-color: #529576; cursor: pointer; }
.camera-controls { position: fixed; bottom: 102px; right: 34px; display: flex; padding: 3px; gap: 1px; }
.camera-controls .tool-divider { width: 1px; height: auto; margin: 7px 4px; }
.camera-controls .icon-button { width: 34px; height: 34px; padding: 8px; }
.hover-label { position: fixed; z-index: 8; pointer-events: none; background: rgba(27, 53, 47, .91); color: #fff; font-size: 11px; padding: 8px 12px; border-radius: 4px; box-shadow: 0 3px 15px #1c34351c; }
.toast { position: fixed; z-index: 20; left: 50%; bottom: 103px; transform: translateX(-50%); font-size: 12px; padding: 12px 20px; max-width: calc(100% - 32px); text-align: center; }
[data-tip]::after { content: attr(data-tip); position: absolute; background: #27473f; color: #fff; padding: 7px 9px; font-size: 10px; line-height: 1.25; white-space: nowrap; pointer-events: none; opacity: 0; border-radius: 3px; transition: opacity .12s; bottom: calc(100% + 9px); left: 50%; transform: translateX(-50%); z-index: 30; }
[data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; }
.tools [data-tip]::after { left: auto; right: calc(100% + 12px); bottom: 50%; transform: translateY(50%); }
.time-switch [data-tip]::after { top: calc(100% + 10px); bottom: auto; }
.loading { position: fixed; inset: 0; background: #d4e5df; display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 24px; z-index: 99; transition: opacity .45s; }
.loading span { font-size: 12px; color: #527169; }
.loading-blocks { display: flex; gap: 5px; align-items: flex-end; height: 45px; }
.loading-blocks b { width: 16px; height: 24px; background: #80aba0; animation: assembling .9s ease-in-out infinite alternate; }
.loading-blocks b:nth-child(2) { height: 44px; background: #478a85; animation-delay: .2s; }
.loading-blocks b:nth-child(3) { height: 32px; background: #be687a; animation-delay: .4s; }
@keyframes assembling { from { transform: translateY(4px); opacity: .5; } to { transform: translateY(-4px); opacity: 1; } }
.error { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 101; width: min(400px, calc(100% - 40px)); padding: 28px; }
.error p { font-size: 13px; line-height: 1.8; color: var(--muted); }
.error button { border: 1px solid var(--line); background: var(--active); border-radius: 4px; }
body[data-time="night"] { --ink: #e1eeea; --muted: #9fbbb4; --surface: rgba(29, 50, 49, .86); --line: rgba(191, 220, 208, .16); --active: #35584b; --accent: #eaa69e; --shadow: 0 5px 22px rgba(0, 0, 0, .13); }
body[data-time="night"] .icon-button[aria-pressed="true"], body[data-time="night"] .view-button.active { color: #bcead2; }
body[data-time="sunset"] { --surface: rgba(255, 247, 240, .86); --active: #f0e4db; --accent: #b8535b; }
@media (max-width: 1150px) {
  .scene-caption { min-width: 170px; }
  .sound-caption { display: none; }
  .sound { padding-right: 9px; }
  .view-button { min-width: 71px; padding: 0 11px; }
}
@media (max-width: 700px) {
  .masthead { left: 19px; top: 21px; }
  .edition { font-size: 8px; gap: 6px; }
  .edition svg { width: 17px; height: 17px; }
  .edition-number { display: none; }
  h1 { font-size: 29px; margin-top: 11px; margin-bottom: 7px; }
  .city-meta { font-size: 8px; gap: 8px; }
  .city-meta span:last-child, .meta-rule { display: none; }
  .atmosphere { top: 21px; right: 17px; gap: 10px; }
  .time-switch { padding: 3px; gap: 1px; }
  .time-switch .icon-button { width: 32px; height: 32px; padding: 7px; }
  .conditions { font-size: 9px; }
  .landmark-nav { left: 19px; top: 131px; }
  .text-button { height: 34px; font-size: 11px; padding: 0 10px; gap: 6px; }
  .landmarks-menu { width: 238px; top: 42px; }
  .tools { left: 19px; right: auto; padding: 3px; gap: 1px; top: 184px; transform: none; flex-direction: row; }
  .tools .icon-button { width: 32px; height: 34px; padding: 8px; }
  .tools .icon-button svg { width: 17px; height: 17px; }
  .tools .tool-divider { width: 1px; height: auto; margin: 5px; }
  .tool-divider { margin: 3px 5px; }
  .bottom-bar { left: 16px; right: 16px; bottom: max(18px, env(safe-area-inset-bottom)); gap: 0; flex-wrap: wrap; }
  .view-switch { position: static; transform: none; width: 100%; order: 3; margin-top: 14px; gap: 2px; justify-content: center; padding: 4px; }
  .view-button { height: 38px; min-width: 0; flex: 1; font-size: 11px; gap: 5px; padding: 0 8px; }
  .view-button svg { width: 15px; height: 15px; }
  .scene-caption { min-width: 0; gap: 9px; }
  .scene-caption strong { font-size: 14px; }
  .scene-caption span:not(.caption-line) { font-size: 9px; margin-top: 3px; }
  .sound { padding: 2px 7px 2px 2px; gap: 2px; }
  .sound .icon-button { width: 33px; height: 33px; padding: 7px; }
  #volume { width: 38px; }
  .camera-controls { right: 15px; bottom: 141px; padding: 2px; }
  .camera-controls .icon-button { width: 30px; height: 30px; padding: 7px; }
  .building-info { bottom: 149px; left: 16px; width: 201px; padding: 15px 14px 12px; }
  .building-info h2 { font-size: 17px; margin-bottom: 5px; }
  .building-english { font-size: 8px; }
  .eyebrow { font-size: 9px; margin-bottom: 7px; }
  .building-divider { margin: 10px 0; }
  .building-detail { font-size: 10px; }
  .toast { bottom: 204px; font-size: 11px; width: max-content; }
  [data-tip]::after { display: none; }
}
@media (max-height: 620px) and (min-width: 701px) {
  .masthead { top: 18px; left: 24px; }
  h1 { font-size: 30px; margin: 9px 0 6px; }
  .landmark-nav { left: 24px; top: 127px; }
  .bottom-bar { bottom: 17px; left: 24px; right: 24px; }
  .tools { top: 47%; flex-direction: row; }
  .tools .tool-divider { width: 1px; height: auto; }
  .building-info { bottom: 94px; left: 24px; }
  .camera-controls { bottom: 80px; right: 24px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
