<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d52">
  <title>哪吒 · 踏火行</title>
  <style>
    :root {
      color-scheme: dark;
      --sky: #173d52;
      --ink: #172c40;
      --paper: #fff1cf;
      --muted: #a6beb9;
      --gold: #ffd16a;
      --red: #ec442e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--sky); color: var(--paper); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    button { font: inherit; }
    [hidden] { display: none !important; }
    .poster { position: relative; width: 100%; height: 100vh; height: 100svh; min-height: 640px; overflow: hidden; isolation: isolate; }
    .poster::after {
      content: ""; position: absolute; inset: 18px; border: 1px solid rgba(207, 222, 199, .14);
      pointer-events: none; z-index: 4;
    }
    .scene { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
    .masthead { position: absolute; z-index: 3; top: 48px; left: 5.5%; right: 5.5%; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .collection { display: flex; align-items: center; gap: 13px; color: #d7dfc6; font-size: 12px; letter-spacing: .3em; }
    .collection::before { content: ""; width: 26px; height: 1px; background: var(--gold); }
    .seal { display: grid; place-items: center; width: 40px; height: 45px; border: 1px solid #ffbc83; outline: 3px solid rgba(236,68,46,.75); background: #b5362a; color: #fff0c7; font: 19px/1.1 "KaiTi", "STKaiti", serif; transform: rotate(3deg); }
    .title { position: absolute; top: 32%; left: 8%; z-index: 2; pointer-events: none; }
    .eyebrow { margin: 0 0 20px 5px; color: var(--gold); font-size: 11px; letter-spacing: .48em; }
    h1 { margin: 0; font: 700 clamp(96px, 10vw, 158px)/1.1 "KaiTi", "STKaiti", "FangSong", serif; letter-spacing: .06em; text-shadow: 0 4px 30px rgba(13,42,57,.15); }
    .subtitle { margin: 27px 0 0 11px; font: 22px/1.5 "KaiTi", "STKaiti", serif; letter-spacing: .65em; }
    .title-line { width: 36px; height: 2px; background: var(--red); margin: 33px 0 0 12px; }
    .verse { position: absolute; z-index: 2; right: 5.9%; top: 38%; margin: 0; writing-mode: vertical-rl; font: 16px/2.1 "KaiTi", "STKaiti", serif; letter-spacing: .4em; color: #c7d5bf; }
    .footer { position: absolute; z-index: 5; bottom: 43px; left: 5.5%; right: 5.5%; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .caption { margin: 0; color: #b0c4bb; font-size: 11px; letter-spacing: .26em; }
    .motion-toggle { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-width: 112px; min-height: 44px; padding: 10px 16px; color: var(--paper); border: 1px solid rgba(215,223,198,.32); border-radius: 30px; background: rgba(22,54,71,.65); cursor: pointer; font-size: 12px; letter-spacing: .08em; transition: border-color .2s, background .2s; }
    .motion-toggle:hover { border-color: var(--gold); background: rgba(38,72,86,.85); }
    .motion-toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 5px; }
    .motion-toggle svg { width: 15px; height: 15px; fill: currentColor; }
    .intro { animation: arrive 1.3s ease both; }
    .title.intro { animation-delay: .15s; }
    .breeze { stroke-dasharray: 100 460; animation: breeze 10s linear infinite; }
    .breeze.slow { animation-duration: 16s; animation-delay: -7s; }
    .ink-trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trace 2.8s .1s ease forwards; }
    .is-paused *, .is-paused *::before, .is-paused *::after { animation-play-state: paused !important; }
    @keyframes arrive { from { opacity: 0; transform: translateY(13px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes breeze { to { stroke-dashoffset: -1120; } }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    @media (min-aspect-ratio: 18/10) { .title { left: 12%; } }
    @media (max-width: 900px) {
      .title { left: 6%; top: 28%; }
      h1 { font-size: 100px; }
      .verse { right: 5%; font-size: 14px; }
    }
    @media (max-width: 700px) {
      .poster { min-height: 680px; }
      .poster::after { inset: 12px; }
      .masthead { top: 31px; left: 29px; right: 29px; }
      .collection { font-size: 10px; letter-spacing: .2em; }
      .collection::before { width: 17px; }
      .seal { width: 31px; height: 36px; font-size: 15px; }
      .title { top: 101px; left: 32px; }
      h1 { font-size: 70px; }
      .eyebrow { font-size: 9px; margin: 0 0 8px 4px; letter-spacing: .32em; }
      .subtitle { margin: 11px 0 0 5px; font-size: 16px; letter-spacing: .45em; }
      .title-line { display: none; }
      .scene { top: 120px; height: calc(100% - 180px); }
      .verse { top: 120px; right: 31px; font-size: 12px; }
      .footer { bottom: 30px; left: 29px; right: 29px; gap: 10px; }
      .caption { font-size: 9px; letter-spacing: .12em; }
      .motion-toggle { min-width: 100px; font-size: 11px; padding: 9px 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .intro, .ink-trace, .breeze { animation: none; }
      .ink-trace { stroke-dashoffset: 0; }
      .motion-toggle { transition: none; }
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="哪吒踏风火轮的动态画卷">
    <header class="masthead intro">
      <div class="collection">东方神话 · 少年哪吒</div>
      <div class="seal" aria-label="乾坤">乾<br>坤</div>
    </header>

    <div class="title intro">
      <p class="eyebrow">NE ZHA · THE FIRE RIDER</p>
      <h1>哪吒</h1>
      <p class="subtitle">踏 火 凌 霄</p>
      <div class="title-line"></div>
    </div>
    <p class="verse intro">脚踏风火轮<br>心有万重天</p>

    <svg id="scene" class="scene" viewBox="0 0 1440 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sceneTitle sceneDesc">

      <defs>

    <footer class="footer intro">
      <p class="caption">风起 · 火生 · 少年行</p>
      <button id="motionToggle" class="motion-toggle" type="button" aria-label="暂停动画" aria-pressed="false" hidden>
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <g id="pauseIcon"><rect x="5" y="4" width="3" height="12" rx=".7"/><rect x="12" y="4" width="3" height="12" rx=".7"/></g>
          <path id="playIcon" d="M6 3L17 10 6 17Z" hidden/>
        </svg>
        <span id="motionLabel">暂停动画</span>
      </button>

  <script>
    (() => {
      'use strict';
      const svgNS = 'http://www.w3.org/2000/svg';
      const byId = id => document.getElementById(id);
      const scene = byId('scene');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const narrowScreen = matchMedia('(max-width: 700px)');
      const toggle = byId('motionToggle');
      const parts = Object.fromEntries([
        'flightRig', 'backWheel', 'frontWheel', 'backFlames', 'frontFlames',
        'ribbonBack', 'ribbonEdge', 'ribbonLoop', 'beltRibbon', 'spearTassel',
        'hairRibbonLeft', 'hairRibbonRight', 'trailBack', 'trailFront', 'eyes', 'ringGlint'
      ].map(id => [id, byId(id)]));

      const setView = () => scene.setAttribute('viewBox', narrowScreen.matches ? '380 40 890 940' : '0 0 1440 1000');
      setView();
      narrowScreen.addEventListener('change', setView);

      // 固定种子的星空：每次打开保持同一张画卷。
      let seed = 9047;
      function random() {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      }
      const stars = [];
      for (let i = 0; i < 55; i++) {
        const dot = document.createElementNS(svgNS, 'circle');
        dot.setAttribute('cx', (80 + random() * 1280).toFixed(2));
        dot.setAttribute('cy', (60 + random() * 700).toFixed(2));
        dot.setAttribute('r', (.55 + random() * 1.1).toFixed(2));
        byId('stars').appendChild(dot);
        stars.push({ node: dot, phase: random() * Math.PI * 2 });
      }
      const embers = [];
      for (let i = 0; i < 46; i++) {
        const dot = document.createElementNS(svgNS, 'ellipse');
        dot.setAttribute('fill', ['#ffe29a', '#ffb744', '#ff7133'][i % 3]);
        const size = 1.1 + random() * 2.6;
        dot.setAttribute('rx', (size * 1.8).toFixed(2));
        dot.setAttribute('ry', size.toFixed(2));
        byId('embers').appendChild(dot);
        embers.push({ node: dot, front: i % 2 === 0, phase: random(), speed: .28 + random() * .3, reach: 180 + random() * 300, drift: (random() - .5) * 130 });
      }

      let paused = reducedMotion.matches;
      let time = 0;
      let previous = null;
      let frame = null;
      const f = value => value.toFixed(2);

      function draw(t) {
        const a = Math.sin(t * 1.8);
        const b = Math.sin(t * 1.8 - .9);
        const c = Math.sin(t * 2.5 + .6);
        parts.flightRig.setAttribute('transform', `translate(0 ${f(a * 9)}) rotate(${f(b * .85)} 820 490)`);
        parts.backWheel.setAttribute('transform', `rotate(${f((t * 235) % 360)})`);
        parts.frontWheel.setAttribute('transform', `rotate(${f((t * 255 + 24) % 360)})`);
        parts.backFlames.setAttribute('transform', `rotate(${f((-t * 120) % 360)}) scale(${f(1 + .045 * c)})`);
        parts.frontFlames.setAttribute('transform', `rotate(${f((-t * 145 + 17) % 360)}) scale(${f(1 + .045 * Math.sin(t * 6))})`);
        parts.ringGlint.setAttribute('transform', `rotate(${f((t * 36) % 360)})`);

        parts.ribbonBack.setAttribute('d', `M12-88C-120 ${f(-144 + a * 12)} -102 ${f(-264 + b * 24)} -261 ${f(-252 + a * 19)}C-409 ${f(-241 + b * 29)} -367 ${f(-111 + c * 25)} -487 ${f(-139 + b * 36)}C-411 ${f(-88 + b * 36)} -352 ${f(-138 + c * 23)} -333 ${f(-190 + a * 20)}C-302 ${f(-275 + a * 19)} -178 ${f(-224 + b * 24)} -161 ${f(-137 + a * 12)}C-141-42-39-26 20-59Z`);
        parts.ribbonEdge.setAttribute('d', `M8-82C-124 ${f(-128 + a * 12)} -116 ${f(-255 + b * 24)} -262 ${f(-242 + a * 19)}C-393 ${f(-231 + b * 29)} -371 ${f(-107 + c * 25)} -477 ${f(-135 + b * 36)}`);
        parts.ribbonLoop.setAttribute('d', `M40 57C145 ${f(103 + a * 10)} 243 ${f(109 + b * 12)} 256 ${f(42 + a * 11)}C274 ${f(-35 + c * 13)} 160 ${f(-94 + b * 17)} 201 ${f(-143 + c * 14)}C239 ${f(-92 + b * 17)} 324 ${f(-50 + c * 13)} 301 ${f(25 + a * 11)}C274 ${f(124 + b * 12)} 129 ${f(131 + a * 10)} 28 83Z`);
        parts.beltRibbon.setAttribute('d', `M-23 59C-81 ${f(49 + a * 10)} -120 ${f(53 + b * 15)} -150 ${f(84 + c * 17)}C-119 ${f(80 + b * 17)} -112 ${f(105 + a * 9)} -88 95C-109 123 -95 ${f(147 + b * 10)} -122 ${f(170 + c * 17)}C-56 ${f(151 + b * 10)} -78 88-17 73Z`);
        parts.spearTassel.setAttribute('d', `M-8 17C-40 41 ${f(-52 + a * 9)} 50 ${f(-54 + b * 17)} 99C${f(-38 + a * 10)} 73-12 75 0 38C9 74 ${f(39 + b * 8)} 64 ${f(37 + c * 13)} 84C46 50 18 35 8 17Z`);
        parts.hairRibbonLeft.setAttribute('transform', `rotate(${f(a * 6)} -63 -215)`);
        parts.hairRibbonRight.setAttribute('transform', `rotate(${f(b * 8)} 64 -215)`);
        parts.trailBack.setAttribute('d', `M-493 ${f(347 + b * 15)}C-349 ${f(290 + c * 18)} -261 ${f(374 + a * 13)} -100 303`);
        parts.trailFront.setAttribute('d', `M-279 ${f(361 + c * 13)}C-115 ${f(282 + a * 18)} 9 ${f(332 + b * 13)} 160 278`);

        const blinkCycle = t % 5.7;
        const blink = blinkCycle > 5.43 ? Math.max(.06, Math.abs(blinkCycle - 5.565) / .135) : 1;
        parts.eyes.setAttribute('transform', `translate(0 -150) scale(1 ${f(blink)}) translate(0 150)`);

        for (const ember of embers) {
          const life = (t * ember.speed + ember.phase) % 1;
          const x = (ember.front ? 160 : -101) - life * ember.reach;
          const y = (ember.front ? 287 : 312) + life * ember.drift + Math.sin(life * 7 + ember.phase * 10) * 12;
          ember.node.setAttribute('cx', f(x));
          ember.node.setAttribute('cy', f(y));
          ember.node.setAttribute('opacity', f(Math.sin(life * Math.PI) * .85));
        }
        for (const star of stars) {
          star.node.setAttribute('opacity', f(.16 + (Math.sin(t * .7 + star.phase) + 1) * .19));
        }
      }

      function tick(now) {
        frame = null;
        if (paused || document.hidden) { previous = null; return; }
        if (previous !== null) time += Math.min((now - previous) / 1000, .05);
        previous = now;
        draw(time);
        frame = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        document.body.classList.toggle('is-paused', paused);
        const label = paused ? '播放动画' : '暂停动画';
        byId('motionLabel').textContent = label;
        byId('pauseIcon').toggleAttribute('hidden', paused);
        byId('playIcon').toggleAttribute('hidden', !paused);
        toggle.setAttribute('aria-label', label);
        toggle.setAttribute('aria-pressed', String(paused));
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        previous = null;
        if (!paused && !document.hidden) frame = requestAnimationFrame(tick);
      }

      toggle.hidden = false;
      toggle.addEventListener('click', () => { paused = !paused; syncPlayback(); });
      reducedMotion.addEventListener('change', event => { paused = event.matches; syncPlayback(); });
      document.addEventListener('visibilitychange', syncPlayback);
      draw(0);
      syncPlayback();
    })();
  </script>
