<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Octo Rhythm Lab · 章鱼鼓手</title>
<style>
:root{--loop:2307ms;--ink:#f8f6ff;--muted:#a6abd0}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;display:grid;place-items:center;min-width:320px;overflow-x:hidden;background:radial-gradient(circle at 50% -10%,#25366e,#0c1230 42%,#050714 82%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.app{width:min(1280px,100%);padding:clamp(14px,3vw,34px)}
.topbar{display:flex;align-items:end;justify-content:space-between;gap:18px;max-width:1180px;margin:0 auto 14px}
.eyebrow{margin:0 0 5px;color:#8ee9dc;font-size:.72rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
h1{margin:0;font-size:clamp(1.55rem,3vw,2.45rem);line-height:1;letter-spacing:-.045em}
.tagline{margin:9px 0 0;color:var(--muted);font-size:clamp(.78rem,1.4vw,.92rem)}
.badge{padding:10px 13px;border:1px solid rgba(186,198,255,.18);border-radius:999px;background:rgba(20,27,66,.66);color:#e5e7ff;font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 9px 24px #0003}
.stage-shell{position:relative;overflow:hidden;max-width:1180px;margin:0 auto;border:1px solid #a8b8ff38;border-radius:26px;background:#080d25;box-shadow:0 32px 80px #0006,inset 0 1px #ffffff14}
.stage-shell:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 0 1px #ffffff0a,inset 0 -70px 130px #0003}
svg{display:block;width:100%;height:auto}
.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 22px;max-width:1180px;margin:13px auto 0;padding:12px 15px;border:1px solid #bac6ff2e;border-radius:16px;background:#0b102ad1;backdrop-filter:blur(16px)}
.control-group{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}
button{min-width:104px;padding:9px 14px;border:1px solid #97ebdc7a;border-radius:11px;background:linear-gradient(135deg,#8ee9dc,#7fa6ff);color:#081026;font:inherit;font-size:.78rem;font-weight:850;cursor:pointer;box-shadow:0 8px 22px #68dbd83d;transition:transform .2s,box-shadow .2s,filter .2s}
button:hover{transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 11px 26px #68dbd846}button:active{transform:translateY(1px)}button:focus-visible,input:focus-visible{outline:2px solid #f4c8ff;outline-offset:3px}
input[type=range]{width:min(190px,38vw);accent-color:#8ee9dc;cursor:pointer}output{min-width:62px;color:#f8f6ff;font-variant-numeric:tabular-nums;font-weight:750}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-left:auto;color:#8088b5;font-size:.7rem}.legend span:before{content:"";display:inline-block;width:7px;height:7px;margin:0 5px 1px 0;border-radius:50%;background:var(--dot,#8ee9dc);box-shadow:0 0 8px var(--dot,#8ee9dc)}
.stage-title{font-size:13px;font-weight:800;letter-spacing:.18em;fill:#aeb8e8}.stage-caption{font-size:11px;letter-spacing:.14em;fill:#6e78ab}
.arm,.head-bob,.hit-target{transform-box:fill-box;transform-origin:center}
.arm{animation:armStrike var(--loop) ease-in-out infinite;animation-delay:calc(-1 * var(--phase))}
.arm-core{fill:none;stroke:var(--arm,#9c6cff);stroke-width:30;stroke-linecap:round;stroke-linejoin:round;filter:url(#softShadow)}.arm-shine{fill:none;stroke:#ffffff38;stroke-width:5;stroke-linecap:round;stroke-dasharray:2 22}
.suction{fill:#ffffff57}.grip{fill:var(--arm,#9c6cff);stroke:#2c194b;stroke-width:4}.stick{stroke:#f3d4a6;stroke-width:7;stroke-linecap:round;filter:url(#stickShadow)}.stick-tip{fill:#fff0c8;filter:url(#tipGlow)}
.head-bob{animation:headBob var(--loop) cubic-bezier(.55,0,.35,1) infinite}.hit-target{animation:hitFeedback var(--loop) ease-out infinite;animation-delay:calc(-1 * var(--phase))}
.drum-shell{fill:url(#drumShell);stroke:#27305f;stroke-width:4}.drum-head{fill:url(#drumHead);stroke:#7b83b5;stroke-width:3}.drum-rim{fill:none;stroke:#e6e9ff;stroke-width:5;opacity:.72}.lug{fill:#c7d0ff;stroke:#353e78;stroke-width:2}
.cymbal{fill:url(#cymbal);stroke:#f5d98c;stroke-width:3}.cymbal-line{fill:none;stroke:#ffffff85;stroke-width:2}.stand{stroke:#7680ad;stroke-width:6;stroke-linecap:round}.label{font-size:10px;font-weight:800;letter-spacing:.14em;fill:#d7d9f5;opacity:.68}
@keyframes armStrike{0%,11%{transform:translate(0,0) rotate(0)}17%{transform:translate(var(--dx,0px),var(--dy,0px)) rotate(var(--swing,2deg))}24%{transform:translate(calc(var(--dx,0px)*.55),calc(var(--dy,0px)*.55)) rotate(calc(var(--swing,2deg)*.45))}33%,100%{transform:translate(0,0) rotate(0)}}
@keyframes hitFeedback{0%,12%{transform:translate(0,0) scale(1);filter:none}17%{transform:translate(0,3px) scale(1.045);filter:drop-shadow(0 0 13px var(--glow,#8ee9dc))}24%{transform:translate(0,0) scale(.99);filter:drop-shadow(0 0 6px var(--glow,#8ee9dc))}33%,100%{transform:translate(0,0) scale(1);filter:none}}
@keyframes headBob{0%,10%,100%{transform:translateY(0) rotate(0)}17%{transform:translateY(5px) rotate(-1deg)}28%{transform:translateY(0) rotate(.8deg)}42%{transform:translateY(2px) rotate(0)}}
#stage.is-paused *{animation-play-state:paused!important}
@media(max-width:680px){.app{padding:12px}.topbar{align-items:start;flex-direction:column;gap:10px}.badge{align-self:start}.stage-shell{border-radius:18px}.controls{border-radius:14px}.legend{width:100%;margin-left:0}}
@media(prefers-reduced-motion:reduce){.arm,.head-bob,.hit-target{animation-duration:calc(var(--loop)*1.8)}button{transition:none}}
</style>
</head>

<script>
(()=>{const stage=document.getElementById('stage'),toggle=document.getElementById('toggle'),modeText=document.getElementById('modeText'),statusBadge=document.getElementById('statusBadge'),tempo=document.getElementById('tempo'),tempoValue=document.getElementById('tempoValue');const applyTempo=()=>{const bpm=Number(tempo.value),loopMs=Math.round(240000/bpm);document.documentElement.style.setProperty('--loop',loopMs+'ms');tempoValue.textContent=bpm+' BPM'};toggle.addEventListener('click',()=>{const paused=stage.classList.toggle('is-paused');toggle.setAttribute('aria-pressed',String(paused));toggle.textContent=paused?'继续节拍':'暂停节拍';modeText.textContent=paused?'已暂停':'自动循环中';statusBadge.textContent=paused?'PAUSED · ready':'LIVE · looping';statusBadge.style.color=paused?'#ffd78b':'#e5e7ff'});tempo.addEventListener('input',applyTempo);applyTempo()})();
</script>
