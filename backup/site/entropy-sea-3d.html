    :root{color-scheme:dark;background:#030505;color:#c6cece;font-family:'Microsoft YaHei','PingFang SC',sans-serif;--frame:min(100vw,190svh)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;min-width:280px}button,input{font:inherit}
    button{color:inherit}button:focus-visible,input:focus-visible{outline:1px solid #81c7c7;outline-offset:6px}
    #experience{position:relative;width:100%;height:100svh;height:100dvh;overflow:hidden;background:#030505}
    #scene{position:absolute;inset:0;cursor:grab;touch-action:none}#scene.dragging{cursor:grabbing}#scene canvas{display:block;width:100%;height:100%;outline:none}
    .identity{position:absolute;left:5.1%;top:41.1%;width:31.5%;text-align:center;pointer-events:none;user-select:none}
    .name{font-size:calc(var(--frame)*.022);font-weight:300;letter-spacing:.3em;padding-left:.3em;line-height:1.2;margin:0 0 .3vw}
    h1{font-family:'Six Caps',sans-serif;font-size:calc(var(--frame)*.066);font-weight:400;letter-spacing:.135em;white-space:nowrap;line-height:1;margin:0;padding-left:.08em;-webkit-text-stroke:calc(var(--frame)*.00064) #030505;text-shadow:0 0 25px #c5e0e00e}
    .hint{position:absolute;left:6.2%;bottom:35px;font-size:10px;letter-spacing:.22em;color:#788b8b;opacity:.58;pointer-events:none}
    .controls{position:absolute;right:28px;bottom:21px;display:flex;gap:18px;align-items:center;color:#a1b3b3;font-size:11px;letter-spacing:.1em;opacity:.68;transition:opacity .2s}
    .controls:hover,.controls:focus-within{opacity:1}
    button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border:0;background:none;padding:0 2px;font-size:11px;letter-spacing:.1em;cursor:pointer}
    button:hover{color:#eef7f7}svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.2}
    .slider{display:flex;align-items:center;gap:10px;font-size:10px;color:#a8b4b3}
    input[type=range]{width:76px;accent-color:#ba8466;cursor:ew-resize;height:22px}
    #progress-value{width:29px;font-size:10px;text-align:right;letter-spacing:0;font-variant-numeric:tabular-nums}
    #status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#a0b6b5;font-size:12px;letter-spacing:.14em;max-width:80%;text-align:center;line-height:1.8}
    #status:empty{display:none}.controls[hidden],button[hidden]{display:none}
    #notice{position:absolute;right:30px;bottom:85px;font-size:12px;color:#c3cfcb;max-width:80%}
    @media(max-aspect-ratio:1/1){
      .identity{left:5%;top:10%;width:90%}.name{font-size:clamp(22px,5vw,35px);margin-bottom:10px}h1{font-size:20vw;letter-spacing:.095em;-webkit-text-stroke:.5px #030505}
      .hint{left:0;right:0;text-align:center;bottom:113px;font-size:9px}
      .controls{left:14px;right:14px;bottom:max(22px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px 8px}
      .slider{grid-column:1/-1;justify-content:center;height:35px}input[type=range]{width:105px}.controls button{min-height:37px;font-size:10px;gap:4px;letter-spacing:0;white-space:nowrap}#notice{right:20px;left:20px;text-align:center;bottom:150px}
    }
    @media(max-height:480px) and (min-aspect-ratio:1/1){.controls{bottom:5px;right:18px;gap:14px}.hint{bottom:20px}}
    @media(prefers-reduced-motion:reduce){.controls{transition:none}}

  <main id="experience">
    <div id="scene" aria-label="从完整山水星球到粒子消散，可拖动旋转"></div>

    <p class="hint">拖动旋转 · 滚轮缩放</p>

      <button id="evolve" type="button" aria-label="开始破碎"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 3 8l3 5m4-10 3 5-3 5M8 1v3m0 8v3"/></svg><span>开始破碎</span></button>
      <button id="motion" type="button" aria-label="暂停动效" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="motion-icon" d="M5.5 3v10M10.5 3v10"/></svg><span>暂停动效</span></button>
      <button id="reset" type="button" aria-label="重置视角"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6a5 5 0 1 1-.1 4M3 2v4h4"/></svg><span>重置视角</span></button>
      <button id="fullscreen" type="button" aria-label="全屏观看"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2H2v4m8-4h4v4M2 10v4h4m8-4v4h-4"/></svg><span>全屏观看</span></button>
    </div>
    <div id="status" role="status">正在构建星球</div>
    <div id="notice" role="status" aria-live="polite"></div>
