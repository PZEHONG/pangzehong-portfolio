<!doctype html>

<title>鹈鹕的海风小旅行</title>
<style>
:root{color-scheme:light;--ink:#274b50;--muted:#678182;--paper:#f8fbf4;--sea:#318e91}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#e2ede7}
body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);display:grid;place-items:center;min-height:100svh;padding:30px 28px;background:radial-gradient(ellipse at 8% 6%,#f4f7e9 0,transparent 44%),radial-gradient(ellipse at 100% 100%,#cfe4df 0,transparent 58%),#e2ede7}
main{width:min(1180px,100%);margin:auto}
.masthead{display:flex;align-items:center;justify-content:space-between;padding:0 5px 18px;gap:15px}
.signature{display:flex;align-items:center;gap:11px;font-size:14px;letter-spacing:.16em;font-weight:600}
.signature svg{width:33px;height:27px}
.edition{font-size:11px;letter-spacing:.2em;color:#6c8582}
.postcard{overflow:hidden;border-radius:24px;background:#d9eeee;border:1px solid #ffffffcc;box-shadow:0 20px 70px #345e5918,0 2px 5px #345e5908}
.stage{position:relative;aspect-ratio:1280/820;isolation:isolate}
.art{display:block;width:100%;height:100%}
.headline{position:absolute;z-index:1;top:7%;left:6.2%;pointer-events:none}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.29em;color:#638b8a;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:26px;height:1px;background:currentColor}
h1{font-family:"STKaiti","KaiTi","Kaiti SC","Noto Serif CJK SC",serif;font-size:clamp(27px,3.5vw,46px);font-weight:500;letter-spacing:.06em;line-height:1.35;margin:15px 0 10px}
.headline p{font-size:13px;letter-spacing:.16em;margin:0;color:#608485}
.toolbar{background:var(--paper);border-top:1px solid #e0e9df;min-height:77px;display:flex;align-items:center;justify-content:space-between;padding:17px 31px;gap:20px}
.note{display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.08em;color:#5c7e7b}
.status-dot{width:7px;height:7px;border-radius:50%;background:#6faa8e;box-shadow:0 0 0 5px #6faa8e15;flex:none}
.controls{display:flex;align-items:center;gap:21px}
.keyhint{font-size:11px;color:#8c9f99;letter-spacing:.07em}
button{font:inherit;border:1px solid #c8dbd0;border-radius:999px;background:transparent;color:#315d59;display:flex;align-items:center;justify-content:center;gap:9px;padding:10px 18px;min-width:97px;min-height:40px;cursor:pointer;touch-action:manipulation;transition:background .2s,border-color .2s}
button:hover{background:#e7eee3;border-color:#9fbdae}
button:focus-visible{outline:3px solid #33999a;outline-offset:4px}
button svg{width:13px;height:13px;fill:currentColor}
button .play-icon{display:none}
button[aria-pressed="true"] .pause-icon{display:none}
button[aria-pressed="true"] .play-icon{display:block}
.footer{text-align:center;color:#81948b;font-family:Georgia,serif;font-size:12px;font-style:italic;letter-spacing:.07em;margin:18px 0 0}
@media(max-width:650px){body{padding:20px 14px}.masthead{padding-bottom:14px}.signature{font-size:12px;letter-spacing:.1em;gap:8px}.edition{font-size:9px;letter-spacing:.12em}.postcard{border-radius:19px}.stage{aspect-ratio:4/5}.headline{top:7%;left:8%}h1{font-size:30px;margin-top:12px}.eyebrow{font-size:8px}.headline p{font-size:10px;letter-spacing:.1em}.toolbar{padding:15px 18px;min-height:72px}.note{font-size:10px;gap:10px;letter-spacing:.02em}.keyhint{display:none}.controls{gap:0}button{min-width:84px;padding:9px 13px;font-size:12px}.footer{font-size:10px;margin-top:14px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>

      <path d="M664 278c15-18 42-24 67-2" fill="none" stroke="#f5ac89" stroke-width="4"/>
      <path d="M698 246c-13 12-19 27-18 46" fill="none" stroke="#f3e8c2" stroke-width="9"/>
      <path d="M716 249c-8 13-11 28-9 44" fill="none" stroke="#f3e8c2" stroke-width="6"/>
      <path d="m664 286 4-9m62 8-3-11" fill="none" stroke="#b95f51" stroke-width="4"/>
      <path d="M654 300q45-14 93-2l9 5q-5 8-17 5-38-9-75 2Z" fill="#d97a61" stroke="#705e50" stroke-width="2.5"/>
      <!-- Neck scarf and wing, reaching forward to the handlebar. -->
      <path id="scarfTail" d="M676 394C638 398 608 369 564 378L575 363 559 348C614 349 633 382 681 384Z" fill="#e99471" stroke="#a76e53" stroke-width="2.2"/>
      <path id="scarfStripe" d="M595 354 591 375M609 360 604 380" fill="none" stroke="#f5deb0" stroke-width="7"/>
      <path d="M652 382q19 15 47 11l-2 15q-27 2-53-13Z" fill="#eb9672" stroke="#a76e53" stroke-width="2.2"/>
      <path d="M664 389v14m14-9v13" stroke="#f5deb0" stroke-width="5"/>
      <path d="M650 387q-13-5-12 7 6 12 15 2Z" fill="#d98666" stroke="#a76e53" stroke-width="2"/>
      <path d="M524 463c26-22 58-23 84-8 28 17 50 36 88 33l91-12q13-1 12 8-1 7-13 9l-46 14c-40 11-79 13-113 6-42-8-78-25-103-50Z" fill="#f9f8e8" stroke="#36585a" stroke-width="3"/>
      <path d="M539 466c39 32 84 44 124 41 33-3 63-8 86-15-47 1-62 9-88 6-35-3-70-23-91-34" fill="#d4e0d3"/>
      <path d="M577 465q43 33 93 32m-70-29q33 22 69 22m-122-8q36 25 65 26" fill="none" stroke="#abbfad" stroke-width="2.5"/>
      <path d="m779 481 18-4q9 1 7 7l-16 7m-7-4 16-4" fill="#77938a" stroke="#36585a" stroke-width="2"/>
      <path d="m506 458 6 3m0 14 5 3" stroke="#d4dfcd" stroke-width="3"/>
    </g>
    <g id="windLines" stroke="#6faaa4" stroke-width="2" stroke-linecap="round" fill="none" opacity=".45"><path d="M341 348h38q10 0 10-8t-10-8M313 365h50M351 389h33M997 496h38q14 0 14-10t-12-10"/></g>
    <g id="foregroundMotion"><use href="#frontPlants"/><use href="#frontPlants" x="1280"/></g>
    <rect width="1280" height="820" filter="url(#paperNoise)" opacity=".035" style="mix-blend-mode:multiply;pointer-events:none"/>
    </svg>
  </div>
  <div class="toolbar">
    <div class="note"><span class="status-dot" aria-hidden="true"></span><span id="status" aria-live="polite">正在兜风 · 沿海慢行</span></div>
    <div class="controls"><span class="keyhint">空格键，歇一会儿</span><button id="toggle" type="button" aria-label="暂停动画" aria-pressed="false"><svg class="pause-icon" viewBox="0 0 14 14" aria-hidden="true"><rect x="3" y="2" width="3" height="10" rx="1"/><rect x="8" y="2" width="3" height="10" rx="1"/></svg><svg class="play-icon" viewBox="0 0 14 14" aria-hidden="true"><path d="M4 2 12 7 4 12Z"/></svg><span id="toggle-label">暂停</span></button></div>
  </div>
</section>
<p class="footer">A little less hurry, a little more sea.</p>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const ids = ['scene','rearSpin','frontSpin','chainring','farCrank','nearCrank','nearCrankHighlight','nearLeg','nearLegOutline','farLeg','farLegOutline','nearFoot','farFoot','riderBody','scarfTail','scarfTailBack','scarfStripe','eye','roadMotion','passingPlants','foregroundMotion','clouds','skyBirds','seaRipples','sailboat','windLines','bikeShadow'];
  const el = Object.fromEntries(ids.map(id => [id, $(id)]));
  const toggle = $('toggle'), label = $('toggle-label'), status = $('status');
  const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
  const compact = matchMedia('(max-width: 650px)');
  let paused = motionPreference.matches, elapsed = 0, last = null, frame = null;
  const pt = p => p.x.toFixed(2) + ' ' + p.y.toFixed(2);
  const translate = (x,y) => 'translate(' + x.toFixed(2) + ' ' + y.toFixed(2) + ')';

  function fitScene() {
    el.scene.setAttribute('viewBox', compact.matches ? '290 -130 760 950' : '0 0 1280 820');
  }
  // Two fixed-length bones keep each ankle attached to its moving pedal.
  function knee(hip, ankle, thigh, shin) {
    const dx = ankle.x-hip.x, dy = ankle.y-hip.y;
    const d = Math.hypot(dx,dy);
    const a = (thigh*thigh-shin*shin+d*d)/(2*d);
    const h = Math.sqrt(Math.max(0,thigh*thigh-a*a));
    return {x:hip.x+a*dx/d+h*dy/d, y:hip.y+a*dy/d-h*dx/d};
  }
  function leg(side, hip, pedal) {
    const ankle = {x:pedal.x, y:pedal.y-19};
    const joint = knee(hip,ankle,76,81);
    const d = 'M'+pt(hip)+'L'+pt(joint)+'L'+pt(ankle);
    el[side+'Leg'].setAttribute('d',d);
    el[side+'LegOutline'].setAttribute('d',d);
    el[side+'Foot'].setAttribute('transform',translate(pedal.x,pedal.y-6));
    el[side+'Crank'].setAttribute('d','M626 641L'+pt(pedal));
    if(side==='near') el.nearCrankHighlight.setAttribute('d','M626 641L'+pt(pedal));
  }
  function draw(t) {
    const angle = t*2.25 + .7;
    const wave = Math.sin(angle*2);
    const bob = wave*1.5;
    const distance = t*2.25*1.55*103;
    const degrees = angle*180/Math.PI;
    const pedal = {x:626+35*Math.cos(angle),y:641+35*Math.sin(angle)};
    const farPedal = {x:626-35*Math.cos(angle),y:641-35*Math.sin(angle)};
    leg('far',{x:607,y:526+bob},farPedal);
    leg('near',{x:583,y:528+bob},pedal);
    const rotate = 'rotate('+(degrees*1.55).toFixed(2)+')';
    el.frontSpin.setAttribute('transform',rotate);
    el.rearSpin.setAttribute('transform',rotate);
    el.chainring.setAttribute('transform','rotate('+degrees.toFixed(2)+' 626 641)');
    el.riderBody.setAttribute('transform',translate(0,bob));
    el.roadMotion.setAttribute('transform',translate(-(distance%1280),0));
    el.passingPlants.setAttribute('transform',translate(-((distance*.73)%1280),0));
    el.foregroundMotion.setAttribute('transform',translate(-((distance*1.12)%1280),0));
    el.seaRipples.setAttribute('transform',translate(-((distance*.055)%250),0));
    el.clouds.setAttribute('transform',translate(Math.sin(t*.055)*40-40,0));
    el.skyBirds.setAttribute('transform',translate(Math.sin(t*.34)*8,Math.sin(t*.7)*3));
    el.sailboat.setAttribute('transform',translate(1144+Math.sin(t*.15)*8,455+Math.sin(t*1.3)*2));
    el.windLines.setAttribute('opacity',(.25+.16*(Math.sin(t*2)+1)).toFixed(2));
    el.bikeShadow.setAttribute('rx',(259+wave*2).toFixed(1));
    const flutter = Math.sin(t*4)*5, follow = Math.sin(t*4-1.1)*6;
    el.scarfTail.setAttribute('d','M676 394C638 '+(398+flutter)+' 608 '+(369+follow)+' 564 '+(378+follow)+'L575 '+(363+follow)+' 559 '+(348+follow)+'C614 '+(349+follow)+' 633 '+(382+flutter)+' 681 384Z');
    el.scarfTailBack.setAttribute('d','M676 392C626 '+(409-flutter)+' 604 '+(372-follow)+' 558 '+(390-follow)+'L568 '+(372-follow)+' 550 '+(359-follow)+'C612 '+(357-follow)+' 625 '+(397-flutter)+' 676 382Z');
    el.scarfStripe.setAttribute('d','M595 '+(354+follow)+' 591 '+(375+follow)+'M609 '+(360+follow)+' 604 '+(380+follow));
    const blinkPhase = t%6.2;
    const blink = blinkPhase>5.92 && blinkPhase<6.1 ? Math.max(.06,Math.abs(blinkPhase-6.01)/.09) : 1;
    el.eye.setAttribute('transform','translate(716 318) scale(1 '+blink.toFixed(3)+')');
  }
  function syncControls() {
    toggle.setAttribute('aria-pressed',String(paused));
    toggle.setAttribute('aria-label',paused?'继续播放动画':'暂停动画');
    label.textContent=paused?'继续骑行':'暂停';
    status.textContent=paused?'歇一会儿 · 听听海风':'正在兜风 · 沿海慢行';
    document.querySelector('.status-dot').style.background=paused?'#b7b491':'#6faa8e';
  }
  function tick(now) {
    frame=null;
    if(paused || document.hidden){last=null;return;}
    if(last!==null) elapsed+=Math.min((now-last)/1000,.08);
    last=now;
    draw(elapsed);
    frame=requestAnimationFrame(tick);
  }
  function schedule() {
    last=null;
    if(frame!==null) cancelAnimationFrame(frame);
    frame=null;
    if(!paused && !document.hidden) frame=requestAnimationFrame(tick);
  }
  function setPaused(value) {paused=value;syncControls();schedule();}
  toggle.addEventListener('click',()=>setPaused(!paused));
  document.addEventListener('keydown',event=>{
    if(event.code==='Space' && !event.repeat && !/^(BUTTON|INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)){
      event.preventDefault();setPaused(!paused);
    }
  });
  document.addEventListener('visibilitychange',schedule);
  motionPreference.addEventListener('change',event=>setPaused(event.matches));
  compact.addEventListener('change',fitScene);
  fitScene();draw(0);syncControls();schedule();
})();
</script>
</body>
